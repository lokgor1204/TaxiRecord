<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>的士替更編更 · 雲端紀錄</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            orderBy,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_bNvEgF5-4m8czZSv15ZTY8-7_7LYQPg",
            authDomain: "taxirecord123.firebaseapp.com",
            databaseURL: "https://taxirecord123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taxirecord123",
            storageBucket: "taxirecord123.firebasestorage.app",
            messagingSenderId: "23507400232",
            appId: "1:23507400232:web:bfe1110e57b2d82b25e71d",
            measurementId: "G-2BVTVP5W7N"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const recordsCollection = collection(db, "shiftRecords");
        const notesCollection = collection(db, "shiftNotes");

        const form = document.getElementById('recordForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const recordsList = document.getElementById('recordsList');
        const loadingIndicator = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const saveBtn = document.getElementById('saveBtn');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const versionEl = document.getElementById('version');
        const cloudSaveBtn = document.getElementById('cloudSaveBtn');
        const saveStatusMsg = document.getElementById('saveStatusMsg');

        const tabRecords = document.getElementById('tabRecords');
        const tabNotes = document.getElementById('tabNotes');
        const panelRecords = document.getElementById('panelRecords');
        const panelNotes = document.getElementById('panelNotes');

        const noteForm = document.getElementById('noteForm');
        const noteDriver = document.getElementById('noteDriver');
        const notePhone = document.getElementById('notePhone');
        const noteStart = document.getElementById('noteStart');
        const noteEnd = document.getElementById('noteEnd');
        const noteText = document.getElementById('noteText');
        const notesList = document.getElementById('notesList');
        const noteTitle = document.getElementById('noteTitle');
        const noteCancelBtn = document.getElementById('noteCancelBtn');
        const addNoteBtn = document.getElementById('addNoteBtn');

        const APP_VERSION = 'V1.0';
        versionEl.textContent = APP_VERSION;

        let selectedWeekdays = new Set();
        let selectedShift = null;
        let currentRecords = [];
        let editingId = null;

        let currentNotes = [];
        let editingNoteId = null;

        let pendingChanges = [];
        let pendingNoteChanges = [];

        const WEEKDAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const WEEKDAY_LABEL = {
            'mon': '一', 'tue': '二', 'wed': '三',
            'thu': '四', 'fri': '五', 'sat': '六', 'sun': '日'
        };
        const SHIFT_LABEL = { 'morning': '早更', 'night': '夜更' };

        const NOTE_EXPIRE_DAYS = 6;

        const WA_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

        function setStatus(type) {
            const map = {
                connecting: { text: '連接中…', cls: 'status-connecting' },
                connected: { text: '已連接', cls: 'status-connected' },
                failed: { text: '連線失敗', cls: 'status-failed' }
            };
            const s = map[type] || map.connecting;
            connectionStatus.textContent = s.text;
            connectionStatus.className = 'conn-status ' + s.cls;
        }

        function showSaveMsg(text, ok) {
            saveStatusMsg.textContent = text;
            saveStatusMsg.className = 'save-msg ' + (ok ? 'save-ok' : 'save-fail');
            saveStatusMsg.style.display = 'inline-block';
            clearTimeout(window.__saveMsgTimer);
            window.__saveMsgTimer = setTimeout(() => {
                saveStatusMsg.style.display = 'none';
            }, 3000);
        }

        function updatePendingIndicator() {
            const total = pendingChanges.length + pendingNoteChanges.length;
            if (total > 0) {
                cloudSaveBtn.classList.add('has-pending');
                cloudSaveBtn.textContent = `儲存 (${total})`;
            } else {
                cloudSaveBtn.classList.remove('has-pending');
                cloudSaveBtn.textContent = '儲存';
            }
        }

        function switchTab(tab) {
            if (tab === 'records') {
                tabRecords.classList.add('active');
                tabNotes.classList.remove('active');
                panelRecords.style.display = 'block';
                panelNotes.style.display = 'none';
            } else {
                tabNotes.classList.add('active');
                tabRecords.classList.remove('active');
                panelNotes.style.display = 'block';
                panelRecords.style.display = 'none';
            }
        }

        function isNoteExpired(note) {
            if (!note.endDate) return false;
            const end = new Date(note.endDate + 'T23:59:59');
            const expireAt = new Date(end.getTime() + NOTE_EXPIRE_DAYS * 24 * 60 * 60 * 1000);
            return new Date() > expireAt;
        }

        async function cleanupExpiredNotes(notes) {
            const expired = notes.filter(n => isNoteExpired(n));
            if (expired.length === 0) return;
            for (const n of expired) {
                try {
                    await deleteDoc(doc(db, "shiftNotes", n.id));
                    console.log('自動刪除過期備註:', n.id, n.driver, n.endDate);
                } catch (err) {
                    console.error('自動刪除失敗:', n.id, err);
                }
            }
        }

        function listenToRecords() {
            loadingIndicator.style.display = 'block';
            errorMessage.textContent = '';
            setStatus('connecting');

            const q = query(recordsCollection, orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
                if (pendingChanges.length > 0) return;

                currentRecords = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let weekdays = data.weekdays;
                    if (!Array.isArray(weekdays)) {
                        weekdays = data.weekday ? [data.weekday] : [];
                    }
                    currentRecords.push({
                        id: docSnap.id,
                        name: data.name || '',
                        phone: data.phone || '',
                        weekdays: weekdays,
                        shift: data.shift || '',
                        createdAt: data.createdAt || null
                    });
                });
                renderRecords(currentRecords);
                loadingIndicator.style.display = 'none';
                setStatus('connected');
            }, (error) => {
                console.error("監聽錯誤:", error);
                errorMessage.textContent = `載入失敗：${error.message}`;
                loadingIndicator.style.display = 'none';
                setStatus('failed');
            });

            return unsubscribe;
        }

        function listenToNotes() {
            const q = query(notesCollection, orderBy("createdAt", "desc"));
            const unsubscribe = onSnapshot(q, (snapshot) => {
                if (pendingNoteChanges.length > 0) return;
                currentNotes = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    currentNotes.push({
                        id: docSnap.id,
                        driver: data.driver || '',
                        phone: data.phone || '', // 新增電話號碼
                        startDate: data.startDate || '',
                        endDate: data.endDate || '',
                        text: data.text || '',
                        createdAt: data.createdAt || null
                    });
                });

                cleanupExpiredNotes(currentNotes);

                renderNotes(currentNotes);
            }, (error) => {
                console.error("備註監聽錯誤:", error);
            });
            return unsubscribe;
        }

        function renderRecords(records) {
            if (records.length === 0) {
                recordsList.innerHTML = `<div class="empty-message">暫時未有紀錄，請新增替更資料。</div>`;
                return;
            }

            let html = '';
            records.forEach((rec) => {
                const sortedDays = WEEKDAY_ORDER.filter(d => rec.weekdays.includes(d));
                const daysTags = sortedDays.length > 0
                    ? sortedDays.map(d => `<span class="day-tag">${WEEKDAY_LABEL[d]}</span>`).join('')
                    : '<span class="day-tag empty">未設定</span>';

                const shiftDisplay = SHIFT_LABEL[rec.shift] || rec.shift;

                const cleanPhone = rec.phone.replace(/[^0-9]/g, '');
                let waNumber = cleanPhone;
                if (cleanPhone.length === 8) waNumber = '852' + cleanPhone;
                const waLink = `https://wa.me/${waNumber}`;

                const isPending = rec._pending;

                html += `
                    <div class="record-item ${isPending ? 'pending' : ''}" data-id="${rec.id}">
                        <div class="record-row-top">
                            <div class="row-left">
                                <span class="record-name">${escapeHtml(rec.name)}</span>
                                <span class="record-shift ${rec.shift}">${shiftDisplay}</span>
                            </div>
                            <div class="record-contact">
                                <span class="record-phone">${escapeHtml(rec.phone)}</span>
                                <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener" title="用 WhatsApp 聯絡">${WA_ICON}</a>
                            </div>
                        </div>
                        <div class="record-row-bottom">
                            <div class="days-tags">${daysTags}</div>
                            <div class="record-actions">
                                <button class="edit-btn" data-id="${rec.id}">修改</button>
                                <button class="delete-btn" data-id="${rec.id}">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            recordsList.innerHTML = html;

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) queueDelete(id);
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) enterEditMode(id);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderNotes(notes) {
            if (notes.length === 0) {
                notesList.innerHTML = `<div class="empty-message">暫時未有備註。</div>`;
                return;
            }

            let html = '';
            notes.forEach((n) => {
                const isPending = n._pending;
                const dateRange = n.startDate && n.endDate
                    ? `${n.startDate} 至 ${n.endDate}`
                    : (n.startDate || n.endDate || '未設定日期');

                // 處理電話同 WhatsApp
                const cleanPhone = n.phone ? n.phone.replace(/[^0-9]/g, '') : '';
                let waLink = '';
                if (cleanPhone) {
                    let waNumber = cleanPhone;
                    if (cleanPhone.length === 8) waNumber = '852' + cleanPhone;
                    waLink = `https://wa.me/${waNumber}`;
                }

                const waBtnHtml = waLink 
                    ? `<a class="wa-btn" href="${waLink}" target="_blank" rel="noopener" title="用 WhatsApp 聯絡">${WA_ICON}</a>` 
                    : '';

                let expireHint = '';
                if (n.endDate) {
                    const end = new Date(n.endDate + 'T23:59:59');
                    const expireAt = new Date(end.getTime() + NOTE_EXPIRE_DAYS * 24 * 60 * 60 * 1000);
                    const y = expireAt.getFullYear();
                    const m = String(expireAt.getMonth() + 1).padStart(2, '0');
                    const d = String(expireAt.getDate()).padStart(2, '0');
                    expireHint = `<span class="note-expire">${y}-${m}-${d} 自動刪除</span>`;
                }

                html += `
                    <div class="note-item ${isPending ? 'pending' : ''}" data-id="${n.id}">
                        <!-- 第一行：左邊時間，右邊備註事情 (字體加大) -->
                        <div class="note-row-top">
                            <span class="note-date">${dateRange}</span>
                            <span class="note-text">${escapeHtml(n.text)}</span>
                        </div>
                        <!-- 第二行：左邊司機名，右邊電話 + WhatsApp -->
                        <div class="note-row-bottom">
                            <div class="row-left">
                                <span class="note-driver">${escapeHtml(n.driver)}</span>
                            </div>
                            <div class="record-contact">
                                ${n.phone ? `<span class="record-phone">${escapeHtml(n.phone)}</span>` : ''}
                                ${waBtnHtml}
                            </div>
                        </div>
                        <!-- 第三行：自動刪除提示 + 修改/刪除掣 -->
                        <div class="note-row-actions">
                            ${expireHint}
                            <div class="note-actions">
                                <button class="note-edit-btn" data-id="${n.id}">修改</button>
                                <button class="note-delete-btn" data-id="${n.id}">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            notesList.innerHTML = html;

            document.querySelectorAll('.note-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) queueDeleteNote(id);
                });
            });

            document.querySelectorAll('.note-edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) enterNoteEditMode(id);
                });
            });
        }

        function generateTempId() {
            return 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        }

        function queueAdd(data) {
            const tempId = generateTempId();
            currentRecords.unshift({
                id: tempId,
                name: data.name,
                phone: data.phone,
                weekdays: data.weekdays,
                shift: data.shift,
                createdAt: new Date(),
                _pending: true
            });
            pendingChanges.push({ type: 'add', tempId, data });
            renderRecords(currentRecords);
            updatePendingIndicator();
        }

        function queueUpdate(id, data) {
            const idx = currentRecords.findIndex(r => r.id === id);
            if (idx === -1) return;
            const pendingAdd = pendingChanges.find(c => c.type === 'add' && c.tempId === id);
            if (pendingAdd) {
                pendingAdd.data = data;
            } else {
                pendingChanges = pendingChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingChanges.push({ type: 'update', id, data });
            }
            currentRecords[idx] = { ...currentRecords[idx], ...data, _pending: true };
            renderRecords(currentRecords);
            updatePendingIndicator();
        }

        function queueDelete(id) {
            if (!confirm('確定要刪除這筆紀錄嗎？（撳「儲存」後才會真正刪除雲端資料）')) return;
            const pendingAddIdx = pendingChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pendingAddIdx !== -1) {
                pendingChanges.splice(pendingAddIdx, 1);
                currentRecords = currentRecords.filter(r => r.id !== id);
                renderRecords(currentRecords);
                updatePendingIndicator();
                if (editingId === id) exitEditMode();
                return;
            }
            pendingChanges = pendingChanges.filter(c => !(c.type === 'update' && c.id === id));
            pendingChanges.push({ type: 'delete', id });
            currentRecords = currentRecords.filter(r => r.id !== id);
            renderRecords(currentRecords);
            updatePendingIndicator();
            if (editingId === id) exitEditMode();
        }

        function queueAddNote(data) {
            const tempId = 'note_' + generateTempId();
            currentNotes.unshift({
                id: tempId,
                driver: data.driver,
                phone: data.phone,
                startDate: data.startDate,
                endDate: data.endDate,
                text: data.text,
                createdAt: new Date(),
                _pending: true
            });
            pendingNoteChanges.push({ type: 'add', tempId, data });
            renderNotes(currentNotes);
            updatePendingIndicator();
        }

        function queueUpdateNote(id, data) {
            const idx = currentNotes.findIndex(n => n.id === id);
            if (idx === -1) return;
            const pendingAdd = pendingNoteChanges.find(c => c.type === 'add' && c.tempId === id);
            if (pendingAdd) {
                pendingAdd.data = data;
            } else {
                pendingNoteChanges = pendingNoteChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingNoteChanges.push({ type: 'update', id, data });
            }
            currentNotes[idx] = { ...currentNotes[idx], ...data, _pending: true };
            renderNotes(currentNotes);
            updatePendingIndicator();
        }

        function queueDeleteNote(id) {
            if (!confirm('確定要刪除這筆備註嗎？（撳「儲存」後才會真正刪除雲端資料）')) return;
            const pendingAddIdx = pendingNoteChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pendingAddIdx !== -1) {
                pendingNoteChanges.splice(pendingAddIdx, 1);
                currentNotes = currentNotes.filter(n => n.id !== id);
                renderNotes(currentNotes);
                updatePendingIndicator();
                if (editingNoteId === id) exitNoteEditMode();
                return;
            }
            pendingNoteChanges = pendingNoteChanges.filter(c => !(c.type === 'update' && c.id === id));
            pendingNoteChanges.push({ type: 'delete', id });
            currentNotes = currentNotes.filter(n => n.id !== id);
            renderNotes(currentNotes);
            updatePendingIndicator();
            if (editingNoteId === id) exitNoteEditMode();
        }

        async function commitToCloud() {
            const total = pendingChanges.length + pendingNoteChanges.length;
            if (total === 0) {
                showSaveMsg('冇改動需要儲存', true);
                return;
            }

            cloudSaveBtn.disabled = true;
            const originalText = cloudSaveBtn.textContent;
            cloudSaveBtn.textContent = '儲存中…';

            let successCount = 0;
            let failCount = 0;
            let failMsg = '';

            for (const change of pendingChanges) {
                try {
                    if (change.type === 'add') {
                        await addDoc(recordsCollection, {
                            name: change.data.name,
                            phone: change.data.phone,
                            weekdays: change.data.weekdays,
                            shift: change.data.shift,
                            createdAt: new Date()
                        });
                        successCount++;
                    } else if (change.type === 'update') {
                        await updateDoc(doc(db, "shiftRecords", change.id), {
                            name: change.data.name,
                            phone: change.data.phone,
                            weekdays: change.data.weekdays,
                            shift: change.data.shift
                        });
                        successCount++;
                    } else if (change.type === 'delete') {
                        await deleteDoc(doc(db, "shiftRecords", change.id));
                        successCount++;
                    }
                } catch (err) {
                    console.error('紀錄同步失敗:', change, err);
                    failCount++;
                    failMsg = err.message;
                }
            }

            for (const change of pendingNoteChanges) {
                try {
                    if (change.type === 'add') {
                        await addDoc(notesCollection, {
                            driver: change.data.driver,
                            phone: change.data.phone,
                            startDate: change.data.startDate,
                            endDate: change.data.endDate,
                            text: change.data.text,
                            createdAt: new Date()
                        });
                        successCount++;
                    } else if (change.type === 'update') {
                        await updateDoc(doc(db, "shiftNotes", change.id), {
                            driver: change.data.driver,
                            phone: change.data.phone,
                            startDate: change.data.startDate,
                            endDate: change.data.endDate,
                            text: change.data.text
                        });
                        successCount++;
                    } else if (change.type === 'delete') {
                        await deleteDoc(doc(db, "shiftNotes", change.id));
                        successCount++;
                    }
                } catch (err) {
                    console.error('備註同步失敗:', change, err);
                    failCount++;
                    failMsg = err.message;
                }
            }

            cloudSaveBtn.disabled = false;
            cloudSaveBtn.textContent = originalText;

            if (failCount === 0) {
                pendingChanges = [];
                pendingNoteChanges = [];
                updatePendingIndicator();
                showSaveMsg(`儲存成功（${successCount} 項）`, true);
                currentRecords.forEach(r => delete r._pending);
                currentNotes.forEach(n => delete n._pending);
            } else {
                showSaveMsg(`儲存失敗：${failMsg}`, false);
            }
        }

        function enterEditMode(id) {
            const rec = currentRecords.find(r => r.id === id);
            if (!rec) return;
            editingId = id;
            nameInput.value = rec.name;
            phoneInput.value = rec.phone;
            selectedWeekdays = new Set(rec.weekdays);
            document.querySelectorAll('.weekday-btn').forEach(btn => {
                btn.classList.toggle('active', selectedWeekdays.has(btn.dataset.day));
            });
            selectedShift = rec.shift || null;
            document.querySelectorAll('.shift-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.shift === selectedShift);
            });
            formTitle.textContent = '修改紀錄';
            saveBtn.textContent = '加入修改';
            cancelEditBtn.style.display = 'inline-block';
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            nameInput.focus();
        }

        function exitEditMode() {
            editingId = null;
            nameInput.value = '';
            phoneInput.value = '';
            selectedWeekdays.clear();
            document.querySelectorAll('.weekday-btn').forEach(b => b.classList.remove('active'));
            selectedShift = null;
            document.querySelectorAll('.shift-btn').forEach(b => b.classList.remove('active'));
            formTitle.textContent = '新增紀錄';
            saveBtn.textContent = '加入新增';
            cancelEditBtn.style.display = 'none';
        }

        function enterNoteEditMode(id) {
            const n = currentNotes.find(x => x.id === id);
            if (!n) return;
            editingNoteId = id;
            noteDriver.value = n.driver;
            notePhone.value = n.phone || '';
            noteStart.value = n.startDate;
            noteEnd.value = n.endDate;
            noteText.value = n.text;
            noteTitle.textContent = '修改備註';
            addNoteBtn.textContent = '加入修改';
            noteCancelBtn.style.display = 'inline-block';
            noteForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
            noteDriver.focus();
        }

        function exitNoteEditMode() {
            editingNoteId = null;
            noteDriver.value = '';
            notePhone.value = '';
            noteStart.value = '';
            noteEnd.value = '';
            noteText.value = '';
            noteTitle.textContent = '新增備註';
            addNoteBtn.textContent = '加入備註';
            noteCancelBtn.style.display = 'none';
        }

        function initWeekdayButtons() {
            const container = document.getElementById('weekdayButtons');
            container.innerHTML = '';
            WEEKDAY_ORDER.forEach(day => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'weekday-btn';
                btn.dataset.day = day;
                btn.textContent = WEEKDAY_LABEL[day];
                btn.addEventListener('click', () => {
                    if (selectedWeekdays.has(day)) {
                        selectedWeekdays.delete(day);
                        btn.classList.remove('active');
                    } else {
                        selectedWeekdays.add(day);
                        btn.classList.add('active');
                    }
                });
                container.appendChild(btn);
            });
        }

        function initShiftButtons() {
            const container = document.getElementById('shiftButtons');
            container.innerHTML = '';
            ['morning', 'night'].forEach(shift => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'shift-btn';
                btn.dataset.shift = shift;
                btn.textContent = SHIFT_LABEL[shift];
                btn.addEventListener('click', () => {
                    if (selectedShift === shift) {
                        selectedShift = null;
                        btn.classList.remove('active');
                    } else {
                        selectedShift = shift;
                        document.querySelectorAll('.shift-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                });
                container.appendChild(btn);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initWeekdayButtons();
            initShiftButtons();
            switchTab('records');

            tabRecords.addEventListener('click', () => switchTab('records'));
            tabNotes.addEventListener('click', () => switchTab('notes'));

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                const weekdaysArray = Array.from(selectedWeekdays);

                if (!name || !phone) { alert('請填寫人名、電話。'); return; }
                if (weekdaysArray.length === 0) { alert('請最少揀選一日返工日子。'); return; }
                if (!selectedShift) { alert('請揀選更別（早更或夜更）。'); return; }
                if (phone.length < 8) { alert('電話號碼似乎太短，請確認。'); return; }

                const data = { name, phone, weekdays: weekdaysArray, shift: selectedShift };

                if (editingId) {
                    queueUpdate(editingId, data);
                    showSaveMsg('已加入修改', true);
                } else {
                    queueAdd(data);
                    showSaveMsg('已加入新增', true);
                }
                exitEditMode();
            });

            cancelEditBtn.addEventListener('click', () => {
                if (confirm('取消修改？填寫嘅內容會清空。')) exitEditMode();
            });

            noteForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const driver = noteDriver.value.trim();
                const phone = notePhone.value.trim();
                const startDate = noteStart.value;
                const endDate = noteEnd.value;
                const text = noteText.value.trim();

                if (!driver) { alert('請填寫司機姓名。'); return; }
                if (!phone) { alert('請填寫電話號碼。'); return; }
                if (!startDate) { alert('請揀選開始日期。'); return; }
                if (!endDate) { alert('請揀選結束日期。'); return; }
                if (endDate < startDate) { alert('結束日期唔可以早過開始日期。'); return; }
                if (!text) { alert('請填寫備註事情。'); return; }

                const data = { driver, phone, startDate, endDate, text };

                if (editingNoteId) {
                    queueUpdateNote(editingNoteId, data);
                    showSaveMsg('已加入備註修改', true);
                } else {
                    queueAddNote(data);
                    showSaveMsg('已加入備註', true);
                }
                exitNoteEditMode();
            });

            noteCancelBtn.addEventListener('click', () => {
                if (confirm('取消修改？填寫嘅內容會清空。')) exitNoteEditMode();
            });

            cloudSaveBtn.addEventListener('click', commitToCloud);

            if (deleteAllBtn) {
                deleteAllBtn.addEventListener('click', () => {
                    if (currentRecords.length === 0) {
                        showSaveMsg('冇紀錄可以刪除', true);
                        return;
                    }
                    if (!confirm('確定要刪除所有替更紀錄嗎？（撳「儲存」後才會真正刪除雲端資料）')) return;
                    currentRecords.forEach(r => {
                        if (!pendingChanges.find(c => c.type === 'delete' && c.id === r.id)) {
                            const addIdx = pendingChanges.findIndex(c => c.type === 'add' && c.tempId === r.id);
                            if (addIdx !== -1) pendingChanges.splice(addIdx, 1);
                            else pendingChanges.push({ type: 'delete', id: r.id });
                        }
                    });
                    pendingChanges = pendingChanges.filter(c => c.type !== 'update');
                    currentRecords = [];
                    renderRecords(currentRecords);
                    updatePendingIndicator();
                    exitEditMode();
                    showSaveMsg('已加入全部刪除', true);
                });
            }

            listenToRecords();
            listenToNotes();
        });
    </script>

<body>
    <div class="container">
        <div class="header-row">
            <div class="title-wrap">
                <h1>的士替更編更</h1>
                <span class="version" id="version">V1.0</span>
            </div>
            <div class="right-top">
                <span id="connectionStatus" class="conn-status status-connecting">連接中…</span>

                    <span id="saveStatusMsg" class="save-msg"></span>
                    <button type="button" id="cloudSaveBtn" class="cloud-save-btn">儲存</button>

            </div>

            記錄每星期替更師傅：人名、電話、逢星期幾返工（可揀多日）、早/夜更。所有改動會先暫存，撳右上角「儲存」才會寫上雲端。
        </div>

        <div class="tabs">
            <button type="button" id="tabRecords" class="tab-btn active">替更紀錄</button>
            <button type="button" id="tabNotes" class="tab-btn">備註</button>
        </div>

        <div id="panelRecords">
            <div class="form-card">
                <h2 id="formTitle">新增紀錄</h2>
                <form id="recordForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>人名</label>
                            <input type="text" id="name" placeholder="陳大文" required>
                        </div>
                        <div class="input-group">
                            <label>電話號碼</label>
                            <input type="tel" id="phone" placeholder="91234567" required>
                        </div>
                        <div class="input-group" style="grid-column: 1 / -1;">
                            <label>逢星期幾返工（可揀多日）</label>
                            <div id="weekdayButtons" class="weekday-selector"></div>
                        </div>
                        <div class="input-group" style="grid-column: 1 / -1;">
                            <label>更別</label>
                            <div id="shiftButtons" class="shift-selector"></div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button type="submit" id="saveBtn" class="btn btn-primary">加入新增</button>
                            <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display: none;">取消修改</button>

                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button type="button" id="deleteAllBtn" class="btn btn-danger">刪除全部</button>

                    </div>

                <div id="loading" class="loading" style="display: none;">同步中...</div>
                <div id="errorMessage" class="error"></div>
            </div>
            <div id="recordsList" class="records-list">
                <div class="empty-message">載入中...</div>
            </div>
        </div>

        <div id="panelNotes" style="display: none;">
            <div class="note-form-card">
                <h3 id="noteTitle">新增備註</h3>
                <form id="noteForm">
                    <!-- 第一行：開始日期 + 結束日期 -->
                    <div class="note-line-1">
                        <div class="input-group">
                            <label>開始日期</label>
                            <input type="date" id="noteStart" required>
                        </div>
                        <div class="input-group">
                            <label>結束日期</label>
                            <input type="date" id="noteEnd" required>
                        </div>
                    </div>
                    <!-- 第二行：司機姓名 + 電話號碼 -->
                    <div class="note-line-2">
                        <div class="input-group">
                            <label>司機姓名</label>
                            <input type="text" id="noteDriver" placeholder="A司機" required>
                        </div>
                        <div class="input-group">
                            <label>電話號碼</label>
                            <input type="tel" id="notePhone" placeholder="91234567" required>
                        </div>
                    </div>
                    <!-- 第三行：備註事情 + 加入掣 -->
                    <div class="note-line-3">
                        <div class="input-group">
                            <label>備註事情</label>
                            <input type="text" id="noteText" placeholder="放假 / 優先排更" required>
                        </div>
                        <button type="submit" id="addNoteBtn" class="btn btn-primary" style="padding: 9px 16px; white-space: nowrap;">加入備註</button>
                        <button type="button" id="noteCancelBtn" class="btn btn-outline" style="display: none; padding: 9px 16px; white-space: nowrap;">取消修改</button>
                    </div>
                </form>
            </div>

            <div id="notesList">
                <div class="empty-message">載入中...</div>
            </div>
        </div>

        <footer>
            手動儲存模式 · 改動暫存本機，撳右上角「儲存」才寫上雲端 · 備註結束日期後 6 日自動刪除
        </footer>
    </div>
</body>
</html>
