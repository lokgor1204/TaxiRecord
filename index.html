<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的士替更編更雲端系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 未儲存變更提示橫幅 (浮動置頂) -->
    <div id="unsavedBanner" class="hidden sticky top-0 z-50 bg-amber-500 text-slate-950 px-4 py-2.5 shadow-md flex items-center justify-between gap-2 text-xs sm:text-sm font-bold">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation animate-bounce"></i>
            <span>您有未儲存的更改！記得按下方或右上角按鈕儲存，否則其他人睇唔到最新紀錄。</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="discardChanges()" class="px-2.5 py-1 bg-white/80 hover:bg-white text-slate-800 rounded text-xs transition">還原</button>
            <button id="bannerSaveBtn" onclick="saveToCloud()" class="px-3 py-1 bg-slate-900 text-white rounded shadow hover:bg-slate-800 transition flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>立即儲存並同步</span>
            </button>
        </div>
    </div>

    <!-- 頂部導航欄 -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center shadow-md shrink-0">
                    <i class="fa-solid fa-taxi text-white text-base"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-sm sm:text-lg tracking-tight whitespace-nowrap leading-tight text-white">的士編更雲端系統</h1>
                    <p class="text-[11px] text-slate-400 truncate">團隊共用排班表</p>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <!-- 雲端連線狀態指示燈 -->
                <div id="syncStatusBadge" class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1.5 rounded-full border border-slate-700 text-[11px] sm:text-xs">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="statusText" class="hidden sm:inline">連線雲端中...</span>
                    <span class="sm:hidden">連線中</span>
                </div>

                <!-- 主儲存按鈕 -->
                <button id="mainSaveBtn" onclick="saveToCloud()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-xl text-xs shadow-md transition flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                    <span id="mainSaveBtnText" class="hidden sm:inline">儲存紀錄並同步給所有人</span>
                    <span class="sm:hidden">儲存</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：加入新替更紀錄表單 -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-20">
                <h2 class="font-bold text-base text-slate-900 mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fa-solid fa-user-plus text-red-600"></i>
                    加入替更司機紀錄
                </h2>

                <form onsubmit="handleAddRecord(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">司機姓名 <span class="text-rose-500">*</span></label>
                        <input type="text" id="driverName" required placeholder="例如：陳大文" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">電話號碼 <span class="text-rose-500">*</span></label>
                        <input type="tel" id="driverPhone" required placeholder="例如：91234567" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">更份選擇 <span class="text-rose-500">*</span></label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/50 has-[:checked]:text-amber-900 font-semibold text-xs">
                                <input type="radio" name="shiftType" value="早更" checked class="text-amber-600 focus:ring-amber-500">
                                <i class="fa-solid fa-sun text-amber-500"></i> 早更
                            </label>
                            <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/50 has-[:checked]:text-indigo-900 font-semibold text-xs">
                                <input type="radio" name="shiftType" value="夜更" class="text-indigo-600 focus:ring-indigo-500">
                                <i class="fa-solid fa-moon text-indigo-500"></i> 夜更
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">每星期返工星期 (可選多個) <span class="text-rose-500">*</span></label>
                        <div class="grid grid-cols-4 gap-1.5">
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期一" class="hidden"> 星期一
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期二" class="hidden"> 星期二
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期三" class="hidden"> 星期三
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期四" class="hidden"> 星期四
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期五" class="hidden"> 星期五
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期六" class="hidden"> 星期六
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100 text-xs font-medium has-[:checked]:bg-red-600 has-[:checked]:text-white has-[:checked]:border-red-600 transition">
                                <input type="checkbox" name="workDay" value="星期日" class="hidden"> 星期日
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i> 加入暫存列表
                    </button>
                </form>
            </div>
        </div>

        <!-- 右側：排班紀錄列表與快速篩選 -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- 快速篩選與搜尋列 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col gap-3">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="relative w-full sm:w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋姓名或電話..." 
                            class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                    </div>

                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button onclick="setFilterShift('ALL')" data-shift="ALL" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm transition">全部更</button>
                            <button onclick="setFilterShift('早更')" data-shift="早更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition">☀️早更</button>
                            <button onclick="setFilterShift('夜更')" data-shift="夜更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition">🌙夜更</button>
                        </div>
                        <span id="recordCountBadge" class="text-xs font-bold text-slate-500 px-2 py-1 bg-slate-100 rounded-lg whitespace-nowrap">共 0 筆</span>
                    </div>
                </div>

                <!-- 8 格平均分佈星期篩選列 (手機超友善) -->
                <div class="grid grid-cols-8 gap-1 pt-1 border-t border-slate-100">
                    <button onclick="setFilterDay('ALL')" data-day="ALL" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-bold bg-red-600 text-white shadow-sm transition truncate text-center">全部</button>
                    <button onclick="setFilterDay('星期一')" data-day="星期一" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">一</button>
                    <button onclick="setFilterDay('星期二')" data-day="星期二" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">二</button>
                    <button onclick="setFilterDay('星期三')" data-day="星期三" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">三</button>
                    <button onclick="setFilterDay('星期四')" data-day="星期四" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">四</button>
                    <button onclick="setFilterDay('星期五')" data-day="星期五" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">五</button>
                    <button onclick="setFilterDay('星期六')" data-day="星期六" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">六</button>
                    <button onclick="setFilterDay('星期日')" data-day="星期日" class="day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center">日</button>
                </div>
            </div>

            <!-- 排班紀錄展示 (手機卡片 / 電腦表格) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                
                <!-- 手機版卡片清單 (sm 以下顯示) -->
                <div id="mobileRosterList" class="block sm:hidden p-3 space-y-3">
                    <!-- 動態渲染 -->
                </div>

                <!-- 電腦版表格 (sm 以上顯示) -->
                <div class="hidden sm:block overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider">
                                <th class="px-5 py-3">司機姓名</th>
                                <th class="px-5 py-3">電話號碼</th>
                                <th class="px-5 py-3">返工星期</th>
                                <th class="px-5 py-3">更份</th>
                                <th class="px-5 py-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="desktopRosterBody" class="divide-y divide-slate-100 text-sm">
                            <!-- 動態渲染 -->
                        </tbody>
                    </table>
                </div>

                <!-- 空狀態提示 -->
                <div id="emptyState" class="hidden py-16 text-center text-slate-400">
                    <i class="fa-solid fa-clipboard-list text-4xl mb-3 text-slate-300"></i>
                    <p class="text-sm font-medium">暫時沒有符合條件的替更紀錄</p>
                </div>

            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500 space-y-1">
            <p>的士編更雲端系統 • 資料儲存於獨立雲端資料庫，更新網頁程式碼絕不影響現有紀錄。</p>
            <p class="font-mono text-slate-400 font-medium">Version 1.4.2</p>
        </div>
    </footer>

    <!-- 自訂提示訊息框 (Toast Notification) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Firebase SDK 與應用程式邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 【重要設定區】Firebase Config
        // =========================================================================
        const customFirebaseConfig = {
            apiKey: "AIzaSyB_bNvEgF5-4m8czZSv15ZTY8-7_7LYQPg",
            authDomain: "taxirecord123.firebaseapp.com",
            databaseURL: "https://taxirecord123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taxirecord123",
            storageBucket: "taxirecord123.firebasestorage.app",
            messagingSenderId: "23507400232",
            appId: "1:23507400232:web:bfe1110e57b2d82b25e71d",
            measurementId: "G-2BVTVP5W7N"
        };

        const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config) 
            ? JSON.parse(__firebase_config) 
            : customFirebaseConfig;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taxi-shift-roster-prod';

        let app, auth, db, currentUser, rosterDocRef;
        let cloudRecords = [];
        let localRecords = [];
        let hasUnsavedChanges = false;
        let isSaving = false;
        let filterDay = 'ALL';
        let filterShift = 'ALL';

        const DAYS_ORDER = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

        function updateConnectionStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            const badge = document.getElementById('syncStatusBadge');
            if (!dot || !label || !badge) return;

            label.textContent = text;
            if (state === 'connected') {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                badge.className = 'flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-emerald-500/40 text-emerald-300';
            } else if (state === 'error') {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                badge.className = 'flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-rose-500/40 text-rose-300';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                badge.className = 'flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-amber-500/40 text-amber-200';
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-900 border-amber-400',
                info: 'bg-slate-800 text-white border-slate-700'
            };

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${bgColors[type] || bgColors.info}`;
            toast.textContent = message;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function updateUnsavedUI(unsaved) {
            hasUnsavedChanges = unsaved;
            const banner = document.getElementById('unsavedBanner');
            const mainBtn = document.getElementById('mainSaveBtn');
            if (banner) {
                if (unsaved) {
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }
            }
            if (mainBtn) {
                if (unsaved) {
                    mainBtn.classList.add('ring-4', 'ring-emerald-300', 'animate-pulse');
                } else {
                    mainBtn.classList.remove('ring-4', 'ring-emerald-300', 'animate-pulse');
                }
            }
        }

        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;
                updateConnectionStatus('connected', '雲端已連線 (即時同步)');

                rosterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_roster', 'shared_schedule');

                onSnapshot(rosterDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        cloudRecords = Array.isArray(data.records) ? data.records : [];
                    } else {
                        cloudRecords = [];
                    }

                    if (!hasUnsavedChanges) {
                        localRecords = JSON.parse(JSON.stringify(cloudRecords));
                        renderTable();
                    } else {
                        showToast('雲端資料有新變動，請先儲存或重新載入以免衝突', 'warning');
                    }
                }, (error) => {
                    console.error("監聽雲端資料錯誤:", error);
                    updateConnectionStatus('error', '雲端讀取受阻');
                    if (error.code === 'permission-denied') {
                        showToast('讀取受阻：權限不足，請確認 Firebase Rules 已設為 allow read, write: if true;', 'error');
                    } else if (error.code === 'not-found') {
                        showToast('提示：雲端尚無資料，將於首次儲存時自動建立', 'info');
                    } else {
                        showToast('讀取雲端資料失敗 (' + error.code + ')：' + error.message, 'error');
                    }
                });

            } catch (error) {
                console.error("初始化錯誤:", error);
                updateConnectionStatus('error', '雲端連線失敗');
                showToast('雲端連線失敗：' + error.message, 'error');
            }
        }

        window.handleAddRecord = function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('driverName');
            const phoneInput = document.getElementById('driverPhone');
            const dayCheckboxes = document.querySelectorAll('input[name="workDay"]:checked');
            const shiftRadio = document.querySelector('input[name="shiftType"]:checked');

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const days = Array.from(dayCheckboxes).map(cb => cb.value);
            const shift = shiftRadio ? shiftRadio.value : '早更';

            if (!name || !phone) {
                showToast('請輸入司機姓名及電話號碼', 'warning');
                return;
            }
            if (days.length === 0) {
                showToast('請至少選擇一個返工星期', 'warning');
                return;
            }

            const newRecord = {
                id: 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name,
                phone,
                days,
                shift,
                createdAt: Date.now()
            };

            localRecords.unshift(newRecord);
            updateUnsavedUI(true);
            renderTable();

            nameInput.value = '';
            phoneInput.value = '';
            dayCheckboxes.forEach(cb => cb.checked = false);
            showToast(`已加入「${name}」至暫存列表，記得按「儲存」同步！`, 'info');
        };

        window.deleteRecord = function(id) {
            const target = localRecords.find(r => r.id === id);
            localRecords = localRecords.filter(r => r.id !== id);
            updateUnsavedUI(true);
            renderTable();
            if (target) {
                showToast(`已移除「${target.name}」，記得按「儲存」確認刪除！`, 'warning');
            }
        };

        window.discardChanges = function() {
            localRecords = JSON.parse(JSON.stringify(cloudRecords));
            updateUnsavedUI(false);
            renderTable();
            showToast('已還原為雲端最新儲存版本', 'info');
        };

        window.saveToCloud = async function() {
            if (isSaving) return;

            if (!currentUser || !rosterDocRef) {
                showToast('雲端尚未連線完成，請稍等幾秒見頂部變綠色後再試！', 'error');
                return;
            }

            isSaving = true;
            const mainBtn = document.getElementById('mainSaveBtn');
            const mainBtnText = document.getElementById('mainSaveBtnText');
            const bannerBtn = document.getElementById('bannerSaveBtn');
            const bannerBtnText = bannerBtn ? bannerBtn.querySelector('span') : null;
            
            mainBtn.disabled = true;
            if (bannerBtn) bannerBtn.disabled = true;
            mainBtnText.textContent = '儲存中...';
            if (bannerBtnText) bannerBtnText.textContent = '儲存中...';

            try {
                const savePromise = setDoc(rosterDocRef, {
                    records: localRecords,
                    updatedAt: Date.now(),
                    updatedBy: currentUser.uid
                });

                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('連線超時（超過12秒）。請檢查網絡連線，或確認 Firebase Firestore 資料庫已建立並開啟讀寫權限！')), 12000);
                });

                await Promise.race([savePromise, timeoutPromise]);

                cloudRecords = JSON.parse(JSON.stringify(localRecords));
                updateUnsavedUI(false);
                renderTable();
                showToast('✅ 成功儲存至雲端！所有同事依家都睇到最新紀錄。', 'success');
            } catch (error) {
                console.error("儲存失敗:", error);
                showToast('❌ 儲存失敗：' + error.message, 'error');
            } finally {
                isSaving = false;
                mainBtn.disabled = false;
                if (bannerBtn) bannerBtn.disabled = false;
                mainBtnText.textContent = '儲存紀錄並同步給所有人';
                if (bannerBtnText) bannerBtnText.textContent = '立即儲存並同步';
            }
        };

        window.setFilterDay = function(day) {
            filterDay = day;
            document.querySelectorAll('.day-filter-btn').forEach(btn => {
                if (btn.dataset.day === day) {
                    btn.className = 'day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-bold bg-red-600 text-white shadow-sm transition truncate text-center';
                } else {
                    btn.className = 'day-filter-btn py-1.5 rounded-lg text-[11px] sm:text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition truncate text-center';
                }
            });
            renderTable();
        };

        window.setFilterShift = function(shift) {
            filterShift = shift;
            document.querySelectorAll('.shift-filter-btn').forEach(btn => {
                if (btn.dataset.shift === shift) {
                    btn.className = 'shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm transition';
                } else {
                    btn.className = 'shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition';
                }
            });
            renderTable();
        };

        function getWhatsAppUrl(phone) {
            const digits = String(phone || '').replace(/\D/g, '');
            if (!digits) return '#';
            const fullNumber = digits.length === 8 ? '852' + digits : digits;
            return `https://wa.me/${fullNumber}`;
        }

        window.renderTable = function() {
            const searchInput = document.getElementById('searchInput');
            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

            const filtered = localRecords.filter(rec => {
                const matchQuery = !query || 
                    (rec.name && rec.name.toLowerCase().includes(query)) || 
                    (rec.phone && rec.phone.toLowerCase().includes(query));
                const matchDay = filterDay === 'ALL' || (Array.isArray(rec.days) && rec.days.includes(filterDay));
                const matchShift = filterShift === 'ALL' || rec.shift === filterShift;
                return matchQuery && matchDay && matchShift;
            });

            const countBadge = document.getElementById('recordCountBadge');
            if (countBadge) {
                countBadge.textContent = `共 ${filtered.length} 筆`;
            }

            const mobileList = document.getElementById('mobileRosterList');
            const desktopBody = document.getElementById('desktopRosterBody');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                if (mobileList) mobileList.innerHTML = '';
                if (desktopBody) desktopBody.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            if (mobileList) {
                mobileList.innerHTML = filtered.map(rec => {
                    const isUnsaved = !cloudRecords.some(c => c.id === rec.id);
                    const sortedDays = (rec.days || []).slice().sort((a, b) => DAYS_ORDER.indexOf(a) - DAYS_ORDER.indexOf(b));
                    const shiftBadge = rec.shift === '早更'
                        ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200"><i class="fa-solid fa-sun text-amber-500"></i> 早更</span>'
                        : '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-bold bg-indigo-100 text-indigo-800 border border-indigo-200"><i class="fa-solid fa-moon text-indigo-500"></i> 夜更</span>';

                    return `
                        <div class="bg-white rounded-xl p-3.5 shadow-sm border ${isUnsaved ? 'border-amber-400 bg-amber-50/30' : 'border-slate-200'} flex flex-col gap-2.5">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="font-bold text-slate-900 text-base truncate">${escapeHTML(rec.name)}</span>
                                    ${shiftBadge}
                                    ${isUnsaved ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-200 text-amber-900">未儲存</span>' : ''}
                                </div>
                                <button onclick="deleteRecord('${rec.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="刪除紀錄">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="flex flex-wrap gap-1">
                                ${sortedDays.map(d => `<span class="px-2 py-0.5 bg-red-50 text-red-700 border border-red-200 rounded text-xs font-semibold">${escapeHTML(d)}</span>`).join('')}
                            </div>
                            <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">
                                <a href="tel:${escapeHTML(rec.phone)}" class="inline-flex items-center gap-1.5 text-sm font-mono font-semibold text-slate-700 hover:text-red-600">
                                    <i class="fa-solid fa-phone text-xs text-slate-400"></i>
                                    ${escapeHTML(rec.phone)}
                                </a>
                                <a href="${getWhatsAppUrl(rec.phone)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-sm transition">
                                    <i class="fa-brands fa-whatsapp text-sm"></i>
                                    WhatsApp
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (desktopBody) {
                desktopBody.innerHTML = filtered.map(rec => {
                    const isUnsaved = !cloudRecords.some(c => c.id === rec.id);
                    const sortedDays = (rec.days || []).slice().sort((a, b) => DAYS_ORDER.indexOf(a) - DAYS_ORDER.indexOf(b));
                    const shiftBadge = rec.shift === '早更'
                        ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200"><i class="fa-solid fa-sun text-amber-500"></i> 早更</span>'
                        : '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800 border border-indigo-200"><i class="fa-solid fa-moon text-indigo-500"></i> 夜更</span>';

                    return `
                        <tr class="${isUnsaved ? 'bg-amber-50/50' : 'hover:bg-slate-50'} transition">
                            <td class="px-5 py-3.5 font-bold text-slate-900">
                                <div class="flex items-center gap-2">
                                    <span>${escapeHTML(rec.name)}</span>
                                    ${isUnsaved ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-200 text-amber-900">未儲存</span>' : ''}
                                </div>
                            </td>
                            <td class="px-5 py-3.5">
                                <div class="flex items-center gap-2">
                                    <a href="tel:${escapeHTML(rec.phone)}" class="font-mono font-medium text-slate-700 hover:text-red-600">${escapeHTML(rec.phone)}</a>
                                    <a href="${getWhatsAppUrl(rec.phone)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-sm transition" title="WhatsApp 聯絡司機">
                                        <i class="fa-brands fa-whatsapp"></i>
                                        WhatsApp
                                    </a>
                                </div>
                            </td>
                            <td class="px-5 py-3.5">
                                <div class="flex flex-wrap gap-1.5">
                                    ${sortedDays.map(d => `<span class="px-2.5 py-0.5 bg-red-50 text-red-700 border border-red-200 rounded-md text-xs font-semibold">${escapeHTML(d)}</span>`).join('')}
                                </div>
                            </td>
                            <td class="px-5 py-3.5">${shiftBadge}</td>
                            <td class="px-5 py-3.5 text-right">
                                <button onclick="deleteRecord('${rec.id}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-transparent hover:border-rose-200 transition">
                                    <i class="fa-solid fa-trash-can"></i> 刪除
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        };

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('beforeunload', (e) => {
            if (hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
