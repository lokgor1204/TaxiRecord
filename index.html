<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的士編更雲端系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 頂部導航列 -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-taxi text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">的士編更雲端系統</h1>
                    <div class="flex items-center gap-2 text-xs text-blue-200 mt-0.5">
                        <span id="version-tag" class="bg-blue-900/60 px-2 py-0.5 rounded font-mono">v2.0.0</span>
                        <span>•</span>
                        <span id="conn-status" class="flex items-center gap-1.5 text-emerald-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 雲端資料庫已連線 (即時同步)
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- 分頁切換按鈕 -->
            <div class="flex bg-blue-900/50 p-1 rounded-xl backdrop-blur-sm border border-blue-600/30">
                <button onclick="switchTab('roster')" id="tab-roster-btn" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-blue-900 shadow">
                    <i class="fa-solid fa-calendar-days mr-1.5"></i> 排班與備註
                </button>
                <button onclick="switchTab('drivers')" id="tab-drivers-btn" class="px-4 py-2 rounded-lg font-medium text-sm transition-all text-blue-100 hover:text-white">
                    <i class="fa-solid fa-users mr-1.5"></i> 司機資料庫 <span id="driver-badge" class="ml-1 bg-blue-600 text-white text-xs px-1.5 py-0.2 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- ================= 頁籤一：排班與備註 ================= -->
        <div id="tab-roster-content" class="space-y-6">
            
            <!-- 頂部控制面板 -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-200">
                        <span class="text-xs font-semibold text-gray-500">篩選星期:</span>
                        <select id="filter-day" onchange="renderAll()" class="bg-transparent text-sm font-medium focus:outline-none cursor-pointer">
                            <option value="ALL">全部顯示</option>
                            <option value="星期一">星期一</option>
                            <option value="星期二">星期二</option>
                            <option value="星期三">星期三</option>
                            <option value="星期四">星期四</option>
                            <option value="星期五">星期五</option>
                            <option value="星期六">星期六</option>
                            <option value="星期日">星期日</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-200">
                        <span class="text-xs font-semibold text-gray-500">身份:</span>
                        <select id="filter-shift" onchange="renderAll()" class="bg-transparent text-sm font-medium focus:outline-none cursor-pointer">
                            <option value="ALL">全部身份</option>
                            <option value="正更">正更</option>
                            <option value="替更">替更</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="saveAllData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-sm hover:shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 立即儲存並同步
                    </button>
                    <button onclick="resetData()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2.5 rounded-xl text-sm transition" title="重設資料">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- 兩欄佈局：新增表單 vs 記錄列表 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左側：新增/修改表單 -->
                <div class="lg:col-span-1 space-y-6">
                    
                    <!-- 排班紀錄表單 -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2">
                                <i class="fa-solid fa-user-plus text-blue-600"></i> 新增排班紀錄
                            </h2>
                            <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden text-xs text-red-500 hover:underline">取消修改</button>
                        </div>
                        
                        <input type="hidden" id="edit-index" value="-1">

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">星期 (Day)</label>
                            <select id="input-day" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="星期一">星期一</option>
                                <option value="星期二">星期二</option>
                                <option value="星期三">星期三</option>
                                <option value="星期四">星期四</option>
                                <option value="星期五">星期五</option>
                                <option value="星期六">星期六</option>
                                <option value="星期日">星期日</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">司機姓名</label>
                            <input type="text" id="input-name" list="driver-suggestions" oninput="autofillDriverInfo(this.value)" placeholder="輸入或選取司機姓名..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <datalist id="driver-suggestions"></datalist>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">身份分類</label>
                            <select id="input-shift-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="正更">正更</option>
                                <option value="替更">替更</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">聯絡電話</label>
                            <input type="text" id="input-phone" placeholder="例如: 91234567" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">正更放假日期 (選填)</label>
                                <input type="date" id="input-leave-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">替更優先排更 (選填)</label>
                                <input type="date" id="input-priority-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>

                        <button onclick="saveRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> <span id="form-btn-text">確認新增紀錄</span>
                        </button>
                    </div>

                    <!-- 備註與交接記事表單 -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h2 id="note-form-title" class="font-bold text-gray-800 flex items-center gap-2">
                                <i class="fa-solid fa-note-sticky text-amber-500"></i> 新增備註與交接
                            </h2>
                            <button id="cancel-note-btn" onclick="cancelNoteEdit()" class="hidden text-xs text-red-500 hover:underline">取消</button>
                        </div>
                        
                        <input type="hidden" id="edit-note-index" value="-1">

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">涉及司機 (選填)</label>
                            <input type="text" id="note-driver" list="driver-suggestions" placeholder="輸入司機姓名..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">開始日期</label>
                                <input type="date" id="note-start-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-2 text-xs focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">結束日期</label>
                                <input type="date" id="note-end-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-2 text-xs focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">備註內容</label>
                            <textarea id="note-content" rows="3" placeholder="輸入交接事項、驗車日期或特別安排..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                        </div>

                        <button onclick="saveNote()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> <span id="note-btn-text">儲存備註記事</span>
                        </button>
                    </div>

                </div>

                <!-- 右側：排班列表與備註清單 -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- 排班紀錄清單 -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h2 class="font-bold text-gray-800 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-blue-600"></i> 排班與請假名單
                            </h2>
                            <span id="record-count" class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full font-medium">共 0 項</span>
                        </div>

                        <div id="roster-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                            <!-- 動態載入 -->
                        </div>
                    </div>

                    <!-- 備註記事清單 -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h2 class="font-bold text-gray-800 flex items-center gap-2">
                                <i class="fa-solid id-card text-amber-500"></i> 備註與交接記事清單
                            </h2>
                            <span id="note-count" class="text-xs bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full font-medium">共 0 項</span>
                        </div>

                        <div id="notes-list" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                            <!-- 動態載入 -->
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- ================= 頁籤二：司機資料庫 ================= -->
        <div id="tab-drivers-content" class="space-y-6 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-blue-600"></i> 司機資料庫管理
                    </h2>
                    <p class="text-xs text-gray-500 mt-0.5">統一管理全體正替更司機姓名、電話與身份，支援與排班表自動聯動。</p>
                </div>
                <div class="flex flex-wrap items-center gap-2.5">
                    <button onclick="importDriversFromRoster()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-arrow-down"></i> 從現有排班匯入
                    </button>
                    <button onclick="openDriverModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-user-plus"></i> 新增司機
                    </button>
                </div>
            </div>

            <!-- 搜尋與篩選列 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-3">
                <div class="relative flex-1 min-w-[240px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="driver-search-input" oninput="renderDriversList()" placeholder="搜尋司機姓名或電話..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-center gap-1.5 bg-gray-50 p-1 rounded-xl border border-gray-200 text-xs font-medium">
                    <button onclick="setDriverFilter('ALL')" id="dfilter-all" class="px-3 py-1.5 rounded-lg bg-white shadow-sm text-blue-900 transition">全部</button>
                    <button onclick="setDriverFilter('正更')" id="dfilter-pos" class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">正更</button>
                    <button onclick="setDriverFilter('替更')" id="dfilter-rel" class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">替更</button>
                </div>
            </div>

            <!-- 司機卡片/表格清單 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <span id="driver-total-count" class="text-xs font-semibold text-gray-500">共 0 位司機</span>
                </div>
                <div id="drivers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 動態載入 -->
                </div>
            </div>
        </div>

    </main>

    <!-- 新增/修改司機彈窗 Modal -->
    <div id="driver-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4 animate-in fade-in zoom-in-95">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="driver-modal-title" class="font-bold text-gray-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-blue-600"></i> 新增司機
                </h3>
                <button onclick="closeDriverModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <input type="hidden" id="modal-driver-id" value="">

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">司機姓名</label>
                <input type="text" id="modal-driver-name" placeholder="例如: 陳大文" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">身份分類</label>
                <select id="modal-driver-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="正更">正更</option>
                    <option value="替更">替更</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">聯絡電話</label>
                <input type="text" id="modal-driver-phone" placeholder="例如: 91234567" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="closeDriverModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium text-sm transition">取消</button>
                <button onclick="saveDriverFromModal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-medium text-sm shadow transition">儲存司機</button>
            </div>
        </div>
    </div>

    <!-- 底部版權提示 -->
    <footer class="text-center py-6 text-xs text-gray-400 space-y-1">
        <p>的士編更雲端系統 • 高效排班與司機資料同步管理</p>
        <p class="font-mono">Version 2.0.0 (Persistent Local Cloud Engine)</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 資料結構初始化
        let rosterRecords = JSON.parse(localStorage.getItem('taxi_roster_records_v2')) || [
            { day: '星期一', name: '陳大文', shiftType: '正更', phone: '91234567', leaveDate: '', priorityDate: '' },
            { day: '星期二', name: '李小龍', shiftType: '替更', phone: '98765432', leaveDate: '', priorityDate: '2026-06-15' }
        ];

        let notesRecords = JSON.parse(localStorage.getItem('taxi_notes_records_v2')) || [
            { driver: '陳大文', startDate: '2026-06-10', endDate: '2026-06-12', content: '車輛定期保養維修' }
        ];

        let driversDb = JSON.parse(localStorage.getItem('taxi_drivers_db_v2')) || [
            { id: '1', name: '陳大文', shiftType: '正更', phone: '91234567' },
            { id: '2', name: '李小龍', shiftType: '替更', phone: '98765432' }
        ];

        let driverFilterTab = 'ALL';

        // 初始化載入
        window.onload = function() {
            renderAll();
            updateDriverSuggestions();
        };

        // 分頁切換
        function switchTab(tab) {
            const rosterContent = document.getElementById('tab-roster-content');
            const driversContent = document.getElementById('tab-drivers-content');
            const rosterBtn = document.getElementById('tab-roster-btn');
            const driversBtn = document.getElementById('tab-drivers-btn');

            if (tab === 'roster') {
                rosterContent.classList.remove('hidden');
                driversContent.classList.add('hidden');
                rosterBtn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-blue-900 shadow";
                driversBtn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all text-blue-100 hover:text-white";
                renderAll();
            } else {
                driversContent.classList.remove('hidden');
                rosterContent.classList.add('hidden');
                driversBtn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-blue-900 shadow";
                rosterBtn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all text-blue-100 hover:text-white";
                renderDriversList();
            }
        }

        // 自動建議選單更新
        function updateDriverSuggestions() {
            const datalist = document.getElementById('driver-suggestions');
            datalist.innerHTML = '';
            driversDb.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.name;
                datalist.appendChild(opt);
            });
            document.getElementById('driver-badge').innerText = driversDb.length;
        }

        // 選擇司機時自動填入電話與身份
        function autofillDriverInfo(name) {
            const found = driversDb.find(d => d.name === name);
            if (found) {
                if (found.phone) document.getElementById('input-phone').value = found.phone;
                if (found.shiftType) document.getElementById('input-shift-type').value = found.shiftType;
            }
        }

        // 排序規則：優先 (正更 > 替更) > 次排序 (A-Z)
        function sortRecords(arr) {
            return arr.sort((a, b) => {
                if (a.shiftType === '正更' && b.shiftType !== '正更') return -1;
                if (a.shiftType !== '正更' && b.shiftType === '正更') return 1;
                return a.name.localeCompare(b.name, 'zh-HK');
            });
        }

        // 渲染全部
        function renderAll() {
            renderRosterList();
            renderNotesList();
            updateDriverSuggestions();
        }

        // 渲染排班清單
        function renderRosterList() {
            const listEl = document.getElementById('roster-list');
            const filterDay = document.getElementById('filter-day').value;
            const filterShift = document.getElementById('filter-shift').value;

            let filtered = rosterRecords.filter(r => {
                if (filterDay !== 'ALL' && r.day !== filterDay) return false;
                if (filterShift !== 'ALL' && r.shiftType !== filterShift) return false;
                return true;
            });

            filtered = sortRecords(filtered);
            document.getElementById('record-count').innerText = `共 ${filtered.length} 項`;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm bg-gray-50/50 rounded-xl border border-dashed border-gray-200">暫無符合條件的排班紀錄</div>`;
                return;
            }

        // 儲存排班紀錄
        function saveRecord() {
            const editIndex = parseInt(document.getElementById('edit-index').value);
            const day = document.getElementById('input-day').value;
            const name = document.getElementById('input-name').value.trim();
            const shiftType = document.getElementById('input-shift-type').value;
            const phone = document.getElementById('input-phone').value.trim();
            const leaveDate = document.getElementById('input-leave-date').value;
            const priorityDate = document.getElementById('input-priority-date').value;

            if (!name) {
                alert('請輸入司機姓名');
                return;
            }

            const recordData = { day, name, shiftType, phone, leaveDate, priorityDate };

            if (editIndex === -1) {
                rosterRecords.push(recordData);
            } else {
                rosterRecords[editIndex] = recordData;
                cancelEdit();
            }

            saveAllData();
            clearRecordForm();
            renderAll();
        }

        function clearRecordForm() {
            document.getElementById('input-name').value = '';
            document.getElementById('input-phone').value = '';
            document.getElementById('input-leave-date').value = '';
            document.getElementById('input-priority-date').value = '';
        }

        function editRecord(index) {
            const r = rosterRecords[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('input-day').value = r.day;
            document.getElementById('input-name').value = r.name;
            document.getElementById('input-shift-type').value = r.shiftType;
            document.getElementById('input-phone').value = r.phone || '';
            document.getElementById('input-leave-date').value = r.leaveDate || '';
            document.getElementById('input-priority-date').value = r.priorityDate || '';

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-user-pen text-blue-600"></i> 修改排班紀錄`;
            document.getElementById('form-btn-text').innerText = '確認修改紀錄';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('edit-index').value = '-1';
            clearRecordForm();
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-user-plus text-blue-600"></i> 新增排班紀錄`;
            document.getElementById('form-btn-text').innerText = '確認新增紀錄';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function deleteRecord(index) {
            if (confirm('確定要刪除這筆排班紀錄嗎？')) {
                rosterRecords.splice(index, 1);
                saveAllData();
                renderAll();
            }
        }

        // 儲存備註
        function saveNote() {
            const editIndex = parseInt(document.getElementById('edit-note-index').value);

        // ================= 司機資料庫邏輯 =================
        function setDriverFilter(type) {
            driverFilterTab = type;
            document.getElementById('dfilter-all').className = type === 'ALL' ? 'px-3 py-1.5 rounded-lg bg-white shadow-sm text-blue-900 transition' : 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition';
            document.getElementById('dfilter-pos').className = type === '正更' ? 'px-3 py-1.5 rounded-lg bg-white shadow-sm text-blue-900 transition' : 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition';
            document.getElementById('dfilter-rel' ).className = type === '替更' ? 'px-3 py-1.5 rounded-lg bg-white shadow-sm text-blue-900 transition' : 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition';
            renderDriversList();
        }

        function renderDriversList() {
            const gridEl = document.getElementById('drivers-grid');
            const searchVal = document.getElementById('driver-search-input').value.toLowerCase();

            let filtered = driversDb.filter(d => {
                if (driverFilterTab !== 'ALL' && d.shiftType !== driverFilterTab) return false;
                if (searchVal && !d.name.toLowerCase().includes(searchVal) && !d.phone.includes(searchVal)) return false;
                return true;
            });

            // 正更排先，次排序 A-Z
            filtered.sort((a, b) => {
                if (a.shiftType === '正更' && b.shiftType !== '正更') return -1;
                if (a.shiftType !== '正更' && b.shiftType === '正更') return 1;
                return a.name.localeCompare(b.name, 'zh-HK');
            });

            document.getElementById('driver-total-count').innerText = `共 ${filtered.length} 位司機`;

            if (filtered.length === 0) {
                gridEl.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-sm bg-gray-50/50 rounded-xl border border-dashed border-gray-200">司機資料庫暫無記錄</div>`;
                return;
            }

            gridEl.innerHTML = filtered.map(d => {
                const isPos = d.shiftType === '正更';
                return `
                    <div class="bg-gray-50/90 border border-gray-200/80 rounded-xl p-4 flex justify-between items-center gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-gray-800 text-base">${d.name}</span>
                                <span class="px-2 py-0.5 rounded text-xs font-semibold ${isPos ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">${d.shiftType}</span>
                            </div>
                            <div class="text-xs text-gray-500">
                                <i class="fa-solid fa-phone text-gray-400 mr-1"></i>${d.phone || '未填寫電話'}
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            ${d.phone ? `<a href="https://wa.me/852${d.phone.replace(/[^0-9]/g,'')}" target="_blank" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 p-2 rounded-lg text-xs" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>` : ''}
                            <button onclick="openDriverModal('${d.id}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2.5 py-1.5 rounded-lg text-xs font-medium">修改</button>
                            <button onclick="deleteDriver('${d.id}')" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded-lg text-xs font-medium">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

                    document.getElementById('modal-driver-type').value = found.shiftType;
                    document.getElementById('modal-driver-phone').value
