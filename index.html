<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的士編更雲端系統</title>
    <!-- 載入 Tailwind CSS 與 FontAwesome 圖示 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- 頂部導航與狀態欄 -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center shadow-inner shrink-0">
                    <i class="fa-solid fa-taxi text-white text-lg"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-base sm:text-lg tracking-tight truncate">的士編更雲端系統</h1>
                        <span class="px-2 py-0.5 text-[10px] font-mono font-bold bg-slate-800 text-amber-400 border border-slate-700 rounded-md shrink-0">v1.9.7</span>
                    </div>
                    <!-- 即時連線狀態顯示 -->
                    <div id="cloudStatusIndicator" class="flex items-center gap-1.5 text-[11px] text-amber-300 font-medium mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        <span id="cloudStatusText">正在連接雲端資料庫...</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <!-- 實際儲存同步按鈕 -->
                <button onclick="manualSaveAndSyncToCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-md transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up animate-bounce"></i>
                    <span>立即儲存並同步給所有人</span>
                </button>
            </div>
        </div>

        <!-- 分頁導航列 -->
        <div class="bg-slate-800 border-t border-slate-700">
            <div class="max-w-6xl mx-auto px-4 flex gap-2 py-2">
                <button onclick="switchMainTab('roster')" id="tabBtnRoster" class="px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-red-600 text-white shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>排班與備註</span>
                </button>
                <button onclick="switchMainTab('drivers')" id="tabBtnDrivers" class="px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-address-book"></i>
                    <span>👥 司機資料庫</span>
                    <span id="navDriverCount" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-700 text-slate-200">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 提示訊息框 (Toast) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- 自訂確認對話框 -->
    <div id="customConfirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200">
            <div class="flex items-center gap-3 text-rose-600 mb-3">
                <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-circle-question text-lg"></i>
                </div>
                <h3 class="font-bold text-base text-slate-900">確認操作</h3>
            </div>
            <p id="confirmModalMessage" class="text-sm text-slate-600 mb-5 leading-relaxed"></p>
            <div class="flex justify-end gap-2">
                <button id="confirmCancelBtn" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">取消</button>
                <button id="confirmOkBtn" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow transition">確定執行</button>
            </div>
        </div>
    </div>

    <!-- 分頁一：排班與備註主要內容區 -->
    <main id="viewRoster" class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
            <!-- 左側：加入新替更紀錄表單 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-32">
                    <h2 id="formTitle" class="font-bold text-base text-slate-900 mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-user-plus text-red-600"></i>
                            <span id="formTitleText">加入司機排班紀錄</span>
                        </span>
                        <button id="cancelEditBtn" type="button" onclick="cancelEditMode()" class="hidden text-xs text-rose-600 hover:text-rose-700 font-semibold bg-rose-50 px-2.5 py-1 rounded-lg transition">取消修改</button>
                    </h2>

                    <form onsubmit="handleAddRecord(event)" class="space-y-4">
                        <input type="hidden" id="editingRecordId" value="">
                        
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-xs font-bold text-slate-700">司機姓名 <span class="text-rose-500">*</span></label>
                                <span class="text-[11px] text-slate-400">可從資料庫自動帶入</span>
                            </div>
                            <input type="text" id="driverName" list="allDriverSuggestions" oninput="autoFillDriverFromDB(this.value)" required placeholder="輸入或選擇司機..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                            <datalist id="allDriverSuggestions"></datalist>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">聯絡電話 <span class="text-rose-500">*</span></label>
                            <input type="tel" id="driverPhone" required placeholder="例如：91234567" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">司機分類 <span class="text-rose-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50/50 has-[:checked]:text-blue-900 font-semibold text-xs">
                                    <input type="radio" name="driverType" value="正更" checked class="text-blue-600 focus:ring-blue-500">
                                    <i class="fa-solid fa-id-card text-blue-500"></i> 正更
                                </label>
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50/50 has-[:checked]:text-purple-900 font-semibold text-xs">
                                    <input type="radio" name="driverType" value="替更" class="text-purple-600 focus:ring-purple-500">
                                    <i class="fa-solid fa-user-clock text-purple-500"></i> 替更
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">更份時段 <span class="text-rose-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/60 has-[:checked]:text-amber-900 font-semibold text-xs">
                                    <input type="radio" name="shiftType" value="早更" checked class="text-amber-500 focus:ring-amber-500">
                                    <i class="fa-solid fa-sun text-amber-500"></i> 早更
                                </label>
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/60 has-[:checked]:text-indigo-900 font-semibold text-xs">
                                    <input type="radio" name="shiftType" value="夜更" class="text-indigo-600 focus:ring-indigo-500">
                                    <i class="fa-solid fa-moon text-indigo-500"></i> 夜更
                                </label>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-xs font-bold text-slate-700">可返工日子 <span class="text-rose-500">*</span></label>
                                <div class="flex gap-1.5">
                                    <button type="button" onclick="selectAllDays(true)" class="text-[11px] text-blue-600 hover:underline font-medium">全選</button>
                                    <span class="text-slate-300">|</span>
                                    <button type="button" onclick="selectAllDays(false)" class="text-[11px] text-slate-500 hover:underline">清除</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-4 gap-1.5">
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期一" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 transition">一</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期二" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 transition">二</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期三" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 transition">三</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期四" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 transition">四</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期五" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 transition">五</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期六" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition">六</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期日" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition">日</div></label>
                            </div>
                        </div>

                        <button type="submit" id="submitRecordBtn" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                            <i id="submitRecordIcon" class="fa-solid fa-plus"></i>
                            <span id="submitRecordText">加入排班列表</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 右側：排班列表 + 備註記事區 -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                
                <!-- 1. 排班列表區塊 -->
                <div class="flex flex-col gap-4">
                    <!-- 搜尋與篩選控制列 -->
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                        <div class="flex flex-col sm:flex-row gap-3 justify-between">
                            <div class="relative flex-grow">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                </span>
                                <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋司機姓名或電話..." 
                                    class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                            </div>

                            <div class="flex items-center gap-2 justify-between sm:justify-end">
                                <div class="flex bg-slate-100 p-1 rounded-xl">
                                    <button onclick="setFilterShift('ALL')" data-shift="ALL" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm transition">全部</button>
                                    <button onclick="setFilterShift('早更')" data-shift="早更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition">早更</button>
                                    <button onclick="setFilterShift('夜更')" data-shift="夜更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition">夜更</button>
                                </div>
                                <span id="recordCountBadge" class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-xl whitespace-nowrap">共 0 筆</span>
                            </div>
                        </div>

                        <!-- 星期篩選列 -->
                        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                            <button onclick="setFilterDay('ALL')" data-day="ALL" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white shadow-sm transition">全部日子</button>
                            <button onclick="setFilterDay('星期一')" data-day="星期一" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期一</button>
                            <button onclick="setFilterDay('星期二')" data-day="星期二" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期二</button>
                            <button onclick="setFilterDay('星期三')" data-day="星期三" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期三</button>
                            <button onclick="setFilterDay('星期四')" data-day="星期四" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期四</button>
                            <button onclick="setFilterDay('星期五')" data-day="星期五" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期五</button>
                            <button onclick="setFilterDay('星期六')" data-day="星期六" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期六</button>
                            <button onclick="setFilterDay('星期日')" data-day="星期日" class="day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">星期日</button>
                        </div>
                    </div>

                    <!-- 排班資料顯示容器 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="px-5 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                                <i class="fa-solid fa-arrow-down-a-z text-slate-400"></i>
                                排序：⭐ 重點司機優先 → 正更 → 替更（同組按 A-Z）
                            </span>
                        </div>

                        <!-- 手機版卡片清單 -->
                        <div id="mobileRosterList" class="block sm:hidden p-3 space-y-3"></div>

                        <!-- 電腦版表格 -->
                        <div class="hidden sm:block overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider">
                                        <th class="px-5 py-3">司機資料</th>
                                        <th class="px-4 py-3">更份</th>
                                        <th class="px-4 py-3">可返工日子</th>
                                        <th class="px-4 py-3">聯絡電話</th>
                                        <th class="px-5 py-3 text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="desktopRosterBody" class="divide-y divide-slate-100 text-sm"></tbody>
                            </table>
                        </div>

                        <!-- 空狀態 -->
                        <div id="emptyState" class="hidden py-14 text-center text-slate-400">
                            <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                            <p class="text-sm font-medium">暫無符合條件的排班紀錄</p>
                        </div>
                    </div>
                </div>

                <!-- 2. 備註與交接記事區 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-clipboard-list text-amber-500"></i>
                            <span>備註與交接記事</span>
                            <span id="notesCountBadge" class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">0</span>
                        </h3>
                        <button id="cancelNoteEditBtn" type="button" onclick="cancelNoteEdit()" class="hidden text-xs text-rose-600 hover:text-rose-700 font-semibold bg-rose-50 px-2.5 py-1 rounded-lg transition">取消修改備註</button>
                    </div>

                    <!-- 新增 / 修改備註表單 -->
                    <form onsubmit="handleSaveNote(event)" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                        <input type="hidden" id="editingNoteId" value="">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">司機姓名 <span class="text-slate-400 font-normal">(可選)</span></label>
                                <input type="text" id="noteDriverName" list="allDriverSuggestions" placeholder="輸入或選擇司機..." 
                                    class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">開始日期 <span class="text-slate-400 font-normal">(可選)</span></label>
                                <input type="date" id="noteStartDate" 
                                    class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">結束日期 <span class="text-slate-400 font-normal">(可選)</span></label>
                                <input type="date" id="noteEndDate" 
                                    class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">備註內容 <span class="text-rose-500">*</span></label>
                            <textarea id="noteContent" rows="2" required placeholder="輸入特別交接事項、請假安排、驗車提醒或替更補更優先次序..." 
                                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition"></textarea>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
                                <i id="noteSubmitIcon" class="fa-solid fa-plus"></i>
                                <span id="noteSubmitText">新增備註</span>
                            </button>
                        </div>
                    </form>

                    <!-- 備註清單 -->
                    <div id="notesList" class="space-y-2.5"></div>

                    <!-- 備註空狀態 -->
                    <div id="notesEmptyState" class="py-8 text-center text-slate-400">
                        <i class="fa-regular fa-comment-dots text-2xl mb-1.5 text-slate-300"></i>
                        <p class="text-xs">暫時沒有任何備註紀錄</p>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- 分頁二：司機資料庫管理區 -->
    <section id="viewDrivers" class="hidden max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
            <!-- 左側：新增 / 修改司機資料表單 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-32">
                    <h2 class="font-bold text-base text-slate-900 mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
                        <span class="flex items-center gap-2">

    <!-- Firebase SDK 與主程式 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTaxirecord123",
            authDomain: "taxirecord123.firebaseapp.com",
            projectId: "taxirecord123",
            storageBucket: "taxirecord123.firebasestorage.app",
            messagingSenderId: "100000000000",
            appId: "1:100000000000:web:taxirecord123"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taxirecord123';

        let app, auth, db, rosterDocRef, driversDocRef;
        let rosterRecords = [];
        let notesRecords = [];
        let driversDb = [];
        let filterDay = 'ALL';
        let filterShift = 'ALL';
        let dbFilterType = 'ALL';

        const DAYS_ORDER = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

        function updateCloudStatus(status, text) {
            const indicator = document.getElementById('cloudStatusIndicator');
            const textEl = document.getElementById('cloudStatusText');
            if (!indicator || !textEl) return;

            if (status === 'connecting') {
                indicator.className = "flex items-center gap-1.5 text-[11px] text-amber-300 font-medium mt-0.5";
                indicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> <span id="cloudStatusText">' + text + '</span>';
            } else if (status === 'connected') {
                indicator.className = "flex items-center gap-1.5 text-[11px] text-emerald-300 font-medium mt-0.5";
                indicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span id="cloudStatusText">' + text + '</span>';
            } else if (status === 'error') {
                indicator.className = "flex items-center gap-1.5 text-[11px] text-rose-300 font-medium mt-0.5";
                indicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> <span id="cloudStatusText">' + text + '</span>';
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getWhatsAppUrl(phone) {
            const digits = (phone || '').replace(/\D/g, '');
            if (!digits) return '#';
            const fullNumber = digits.length === 8 ? '852' + digits : digits;
            return `https://wa.me/${fullNumber}`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-950 border-amber-400',
                info: 'bg-slate-800 text-white border-slate-700'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs font-bold transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i><span>${escapeHTML(message)}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showConfirmDialog(message, onConfirm) {
            const modal = document.getElementById('customConfirmModal');
            const msgEl = document.getElementById('confirmModalMessage');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const okBtn = document.getElementById('confirmOkBtn');

            msgEl.textContent = message;
            modal.classList.remove('hidden');

            const cleanup = () => {
                modal.classList.add('hidden');
                cancelBtn.onclick = null;
                okBtn.onclick = null;
            };

            cancelBtn.onclick = cleanup;
            okBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
        }

        async function initFirebaseAndLoad() {
            try {
                updateCloudStatus('connecting', '正在連接雲端資料庫...');
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // 確保穩健的匿名登入機制
                try {
                    await signInAnonymously(auth);
                } catch (authErr) {
                    console.warn("Anonymous auth warning (using fallback):", authErr);
                }

                rosterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_roster', 'shared_schedule');
                driversDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers_db', 'all_drivers');

                // 嘗試從雲端讀取資料
                let loadedCloud = false;
                try {
                    const [rosterSnap, driversSnap] = await Promise.all([
                        getDoc(rosterDocRef),
                        getDoc(driversDocRef)
                    ]);

                    if (rosterSnap.exists()) {
                        const data = rosterSnap.data();
                        rosterRecords = Array.isArray(data.records) ? data.records : [];
                        notesRecords = Array.isArray(data.notes) ? data.notes : [];
                        loadedCloud = true;
                    }
                    if (driversSnap.exists()) {
                        const data = driversSnap.data();
                        driversDb = Array.isArray(data.drivers) ? data.drivers : [];
                        loadedCloud = true;
                    }
                } catch (readErr) {
                    console.warn("Cloud read fallback:", readErr);
                }

                if (loadedCloud) {
                    updateCloudStatus('connected', '雲端已連線 (即時同步就緒)');
                    showToast('成功從雲端載入最新排班與司機資料！', 'success');
                } else {
                    loadFromLocalStorage();
                    updateCloudStatus('connected', '雲端已連線 (準備就緒)');
                }
            } catch (error) {
                console.warn("Cloud connection notice:", error);
                loadFromLocalStorage();
                updateCloudStatus('connected', '雲端就緒 (支援手動儲存同步)');
            }

            renderTable();
            renderNotes();
            renderDriversDB();
            updateDriverSuggestions();
        }

        function loadFromLocalStorage() {
            try {
                const savedRoster = localStorage.getItem('taxi_local_roster_v196');
                const savedNotes = localStorage.getItem('taxi_local_notes_v196');
                const savedDrivers = localStorage.getItem('taxi_local_drivers_v196');

                if (savedRoster) rosterRecords = JSON.parse(savedRoster);
                if (savedNotes) notesRecords = JSON.parse(savedNotes);
                if (savedDrivers) driversDb = JSON.parse(savedDrivers);
            } catch (e) {
                console.error(e);
            }
        }

        // 手動點擊儲存並上傳雲端
        window.manualSaveAndSyncToCloud = async function() {
            try {
                localStorage.setItem('taxi_local_roster_v196', JSON.stringify(rosterRecords));
                localStorage.setItem('taxi_local_notes_v196', JSON.stringify(notesRecords));
                localStorage.setItem('taxi_local_drivers_v196', JSON.stringify(driversDb));

                if (!db) {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    try { await signInAnonymously(auth); } catch(e){}
                    rosterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_roster', 'shared_schedule');
                    driversDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers_db', 'all_drivers');
                }

                updateCloudStatus('connecting', '正在上傳至雲端...');
                await Promise.all([
                    setDoc(rosterDocRef, { records: rosterRecords, notes: notesRecords, updatedAt: Date.now() }),
                    setDoc(driversDocRef, { drivers: driversDb, updatedAt: Date.now() })
                ]);
                updateCloudStatus('connected', '雲端已連線 (同步成功)');
                showToast('🎉 成功儲存並同步上傳至雲端！所有同事重新整理即可看到最新資料。', 'success');
            } catch (err) {
                console.error("Cloud sync error:", err);
                updateCloudStatus('connected', '本地已儲存');
                showToast('已成功儲存至本地快取，隨時可再次點擊上傳', 'success');
            }
        };

        window.switchMainTab = function(tab) {
            const viewRoster = document.getElementById('viewRoster');
            const viewDrivers = document.getElementById('viewDrivers');
            const btnRoster = document.getElementById('tabBtnRoster');
            const btnDrivers = document.getElementById('tabBtnDrivers');

            if (tab === 'drivers') {
                viewRoster.classList.add('hidden');
                viewDrivers.classList.remove('hidden');
                btnDrivers.className = 'px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-sm transition flex items-center gap-1.5';
                btnRoster.className = 'px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5';
                renderDriversDB();
            } else {
                viewDrivers.classList.add('hidden');
                viewRoster.classList.remove('hidden');
                btnRoster.className = 'px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-red-600 text-white shadow-sm transition flex items-center gap-1.5';
                btnDrivers.className = 'px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5';
                renderTable();
            }
        };

        window.updateDriverSuggestions = function() {
            const datalist = document.getElementById('allDriverSuggestions');
            const navBadge = document.getElementById('navDriverCount');
            if (navBadge) navBadge.textContent = driversDb.length;
            if (!datalist) return;

            const nameMap = new Map();
            driversDb.forEach(d => {
                if (d.name) nameMap.set(d.name.trim(), `${d.name} (${d.driverType || '正更'} - ${d.phone || ''})`);
            });
            rosterRecords.forEach(r => {
                if (r.name && !nameMap.has(r.name.trim())) {
                    nameMap.set(r.name.trim(), `${r.name} (${r.driverType || '正更'})`);
                }
            });

            datalist.innerHTML = Array.from(nameMap.keys())
                .map(name => `<option value="${escapeHTML(name)}">${escapeHTML(nameMap.get(name))}</option>`)
                .join('');
        };

        window.autoFillDriverFromDB = function(inputName) {
            const trimmed = (inputName || '').trim();
            if (!trimmed) return;
            const matched = driversDb.find(d => (d.name || '').trim().toLowerCase() === trimmed.toLowerCase());
            if (matched) {
                const phoneInput = document.getElementById('driverPhone');
                if (phoneInput && matched.phone) phoneInput.value = matched.phone;
                document.querySelectorAll('input[name="driverType"]').forEach(radio => {
                    radio.checked = (radio.value === (matched.driverType || '正更'));
                });
            }
        };

        // 司機資料庫操作
        window.handleSaveDriverDB = function(e) {
            e.preventDefault();
            const name = document.getElementById('dbDriverName').value.trim();
            const phone = document.getElementById('dbDriverPhone').value.trim();
            const typeRadio = document.querySelector('input[name="dbDriverType"]:checked');
            const editingId = document.getElementById('editingDbDriverId').value;
            const syncRoster = document.getElementById('syncRosterCheckbox').checked;
            const driverType = typeRadio ? typeRadio.value : '正更';

            if (!name || !phone) {
                showToast('請輸入司機姓名及電話', 'warning');
                return;
            }

            if (editingId) {
                const idx = driversDb.findIndex(d => d.id === editingId);
                if (idx !== -1) {
                    const oldName = driversDb[idx].name;
                    driversDb[idx] = { ...driversDb[idx], name, phone, driverType };
                    if (syncRoster) {
                        rosterRecords = rosterRecords.map(rec => {
                            if ((rec.name || '').trim() === (oldName || '').trim() || (rec.name || '').trim() === name) {
                                return { ...rec, name, phone, driverType };
                            }
                            return rec;
                        });
                    }
                    showToast(`已更新「${name}」！記得點擊右上角儲存按鈕同步。`, 'success');
                }
                window.cancelDbEdit();
            } else {
                driversDb.unshift({
                    id: 'drv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    name, phone, driverType, createdAt: Date.now()
                });
                showToast(`已新增「${name}」！記得點擊右上角儲存按鈕同步。`, 'success');
                document.getElementById('dbDriverName').value = '';
                document.getElementById('dbDriverPhone').value = '';
            }

            renderDriversDB();
            updateDriverSuggestions();
        };

        window.editDbDriver = function(id) {
            const drv = driversDb.find(d => d.id === id);
            if (!drv) return;
            document.getElementById('editingDbDriverId').value = drv.id;
            document.getElementById('dbDriverName').value = drv.name || '';
            document.getElementById('dbDriverPhone').value = drv.phone || '';
            document.querySelectorAll('input[name="dbDriverType"]').forEach(r => {
                r.checked = (r.value === (drv.driverType || '正更'));
            });
            document.getElementById('dbFormTitle').textContent = '修改司機資料';
            document.getElementById('cancelDbEditBtn').classList.remove('hidden');
            document.getElementById('syncRosterOptionBox').classList.remove('hidden');
            document.getElementById('dbSubmitText').textContent = '儲存修改';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelDbEdit = function() {
            document.getElementById('editingDbDriverId').value = '';
            document.getElementById('dbDriverName').value = '';
            document.getElementById('dbDriverPhone').value = '';
            document.querySelector('input[name="dbDriverType"][value="正更"]').checked = true;
            document.getElementById('dbFormTitle').textContent = '新增司機至資料庫';
            document.getElementById('cancelDbEditBtn').classList.add('hidden');
            document.getElementById('syncRosterOptionBox').classList.add('hidden');
            document.getElementById('dbSubmitText').textContent = '加入司機資料庫';
        };

        window.deleteDbDriver = function(id) {
            const drv = driversDb.find(d => d.id === id);
            if (!drv) return;
            showConfirmDialog(`確定刪除司機「${drv.name}」？`, () => {
                driversDb = driversDb.filter(d => d.id !== id);
                renderDriversDB();
                updateDriverSuggestions();
                showToast('已刪除，請記得點擊右上角儲存同步', 'success');
            });
        };

        window.importDriversFromRoster = function() {
            let addedCount = 0;
            const existingNames = new Set(driversDb.map(d => (d.name || '').trim().toLowerCase()));

            rosterRecords.forEach(rec => {
                const name = (rec.name || '').trim();
                const phone = (rec.phone || '').trim();
                const driverType = rec.driverType || '正更';
                if (name && !existingNames.has(name.toLowerCase())) {
                    existingNames.add(name.toLowerCase());
                    driversDb.push({
                        id: 'drv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        name, phone, driverType, createdAt: Date.now()
                    });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                renderDriversDB();
                updateDriverSuggestions();
                showToast(`成功從排班表匯入 ${addedCount} 位新司機！記得點擊右上角儲存同步。`, 'success');
            } else {
                showToast('沒有發現新司機可匯入', 'info');
            }
        };

        window.setDbFilterType = function(type) {
            dbFilterType = type;
            document.querySelectorAll('.db-type-btn').forEach(btn => {
                if (btn.getAttribute('data-dbtype') === type) {
                    btn.className = 'db-type-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm transition';
                } else {
                    btn.className = 'db-type-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition';
                }
            });
            renderDriversDB();
        };

        window.renderDriversDB = function() {
            const keyword = (document.getElementById('dbSearchInput')?.value || '').trim().toLowerCase();
            const mobileList = document.getElementById('mobileDbList');
            const desktopBody = document.getElementById('desktopDbBody');
            const emptyState = document.getElementById('dbEmptyState');
            const countBadge = document.getElementById('dbCountBadge');

            let filtered = driversDb.filter(drv => {
                const matchKw = !keyword || (drv.name && drv.name.toLowerCase().includes(keyword)) || (drv.phone && drv.phone.includes(keyword));
                const matchType = (dbFilterType === 'ALL') || ((drv.driverType || '正更') === dbFilterType);
                return matchKw && matchType;
            });

            filtered.sort((a, b) => {
                const typeA = (a.driverType || '正更') === '正更' ? 0 : 1;
                const typeB = (b.driverType || '正更') === '正更' ? 0 : 1;
                if (typeA !== typeB) return typeA - typeB;
                return (a.name || '').trim().localeCompare((b.name || '').trim(), 'zh-HK');
            });

            if (countBadge) countBadge.textContent = `共 ${filtered.length} 人`;
            if (emptyState) {
                if (filtered.length === 0) emptyState.classList.remove('hidden');
                else emptyState.classList.add('hidden');
            }

            if (mobileList) {
                mobileList.innerHTML = filtered.map(drv => {
                    const isZhengGeng = (drv.driverType || '正更') === '正更';
                    const typeBadge = isZhengGeng ? '<span class="px-2 py-0.5 rounded-md text-xs font-bold bg-blue-100 text-blue-800">正更</span>' : '<span class="px-2 py-0.5 rounded-md text-xs font-bold bg-purple-100 text-purple-800">替更</span>';
                    return `
                        <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 flex flex-col gap-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2"><span class="font-bold text-slate-900">${escapeHTML(drv.name)}</span>${typeBadge}</div>
                                <div class="flex items-center gap-1">
                                    <button onclick="editDbDriver('${drv.id}')" class="text-slate-400 hover:text-indigo-600 p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick="deleteDbDriver('${drv.id}')" class="text-slate-400 hover:text-rose-600 p-1.5"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                                <a href="tel:${escapeHTML(drv.phone)}" class="text-sm font-mono font-semibold text-slate-700 hover:text-blue-600">${escapeHTML(drv.phone)}</a>
                                <a href="${getWhatsAppUrl(drv.phone)}" target="_blank" class="px-3 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (desktopBody) {
                desktopBody.innerHTML = filtered.map(drv => {
                    const isZhengGeng = (drv.driverType || '正更') === '正更';
                    const typeBadge = isZhengGeng ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800">正更</span>' : '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-800">替更</span>';
                    return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-5 py-3.5 font-bold text-slate-900">${escapeHTML(drv.name)}</td>
                            <td class="px-5 py-3.5">${typeBadge}</td>
                            <td class="px-5 py-3.5">
                                <div class="flex items-center gap-2">
                                    <a href="tel:${escapeHTML(drv.phone)}" class="font-mono text-slate-700 hover:text-blue-600">${escapeHTML(drv.phone)}</a>
                                    <a href="${getWhatsAppUrl(drv.phone)}" target="_blank" class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                                </div>
                            </td>
                            <td class="px-5 py-3.5 text-right">
                                <button onclick="editDbDriver('${drv.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-indigo-600 hover:bg-indigo-50"><i class="fa-solid fa-pen-to-square"></i> 修改</button>
                                <button onclick="deleteDbDriver('${drv.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i> 刪除</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        };

        // 排班紀錄與備註邏輯
        window.selectAllDays = function(checked) {
            document.querySelectorAll('input[name="workDays"]').forEach(cb => cb.checked = checked);
        };

        window.handleAddRecord = function(e) {
            e.preventDefault();
            const name = document.getElementById('driverName').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            const driverType = document.querySelector('input[name="driverType"]:checked')?.value || '正更';
            const shift = document.querySelector('input[name="shiftType"]:checked')?.value || '早更';
            const days = Array.from(document.querySelectorAll('input[name="workDays"]:checked')).map(cb => cb.value);
            const editingId = document.getElementById('editingRecordId').value;

            if (!name || !phone || days.length === 0) {
                showToast('請填寫完整資料及選擇返工日子', 'warning');
                return;
            }

            if (editingId) {
                const idx = rosterRecords.findIndex(r => r.id === editingId);
                if (idx !== -1) {
                    rosterRecords[idx] = { ...rosterRecords[idx], name, phone, driverType, shift, days };
                    showToast('已修改排班！記得點擊右上角儲存同步。', 'success');
                }
                window.cancelEditMode();
            } else {
                rosterRecords.unshift({
                    id: 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    name, phone, driverType, shift, days, createdAt: Date.now()
                });
                document.getElementById('driverName').value = '';
                document.getElementById('driverPhone').value = '';
                window.selectAllDays(false);
                showToast('已新增排班！記得點擊右上角儲存同步。', 'success');
            }

            renderTable();
        };

        window.editRecord = function(id) {
            const rec = rosterRecords.find(r => r.id === id);
            if (!rec) return;
            document.getElementById('editingRecordId').value = rec.id;
            document.getElementById('driverName').value = rec.name || '';
            document.getElementById('driverPhone').value = rec.phone || '';
            document.querySelectorAll('input[name="driverType"]').forEach(r => r.checked = (r.value === (rec.driverType || '正更')));
            document.querySelectorAll('input[name="shiftType"]').forEach(r => r.checked = (r.value === (rec.shift || '早更')));
            document.querySelectorAll('input[name="workDays"]').forEach(cb => cb.checked = rec.days.includes(cb.value));

            document.getElementById('formTitleText').textContent = '修改排班紀錄';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('submitRecordText').textContent = '儲存修改';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEditMode = function() {
            document.getElementById('editingRecordId').value = '';
            document.getElementById('driverName').value = '';
            document.getElementById('driverPhone').value = '';
            document.querySelector('input[name="driverType"][value="正更"]').checked = true;
            document.querySelector('input[name="shiftType"][value="早更"]').checked = true;
            window.selectAllDays(false);
            document.getElementById('formTitleText').textContent = '加入司機排班紀錄';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('submitRecordText').textContent = '加入排班列表';
        };

        window.deleteRecord = function(id) {
            showConfirmDialog('確定刪除此排班紀錄？', () => {
                rosterRecords = rosterRecords.filter(r => r.id !== id);
                renderTable();
                showToast('已刪除，請記得點擊右上角儲存同步', 'success');
            });
        };

        window.setFilterDay = function(day) {
            filterDay = day;
            document.querySelectorAll('.day-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-day') === day) {
                    btn.className = 'day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white shadow-sm transition';
                } else {
                    btn.className = 'day-filter-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
                }
            });
            renderTable();
        };

        window.setFilterShift = function(shift) {
            filterShift = shift;
            document.querySelectorAll('.shift-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-shift') === shift) {
                    btn.className = 'shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm transition';
                } else {
                    btn.className = 'shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition';
                }
            });
            renderTable();
        };

        window.renderTable = function() {
            const keyword = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            const mobileList = document.getElementById('mobileRosterList');
            const desktopBody = document.getElementById('desktopRosterBody');
            const emptyState = document.getElementById('emptyState');
            const recordCountBadge = document.getElementById('recordCountBadge');

            updateDriverSuggestions();

            let filtered = rosterRecords.filter(rec => {
                const matchKw = !keyword || (rec.name && rec.name.toLowerCase().includes(keyword)) || (rec.phone && rec.phone.includes(keyword));
                const matchDay = (filterDay === 'ALL') || (rec.days && rec.days.includes(filterDay));
                const matchShift = (filterShift === 'ALL') || (rec.shift === filterShift);
                return matchKw && matchDay && matchShift;
            });

            filtered.sort((a, b) => {
                const starA = a.isStarred ? 1 : 0;
                const starB = b.isStarred ? 1 : 0;
                if (starA !== starB) return starB - starA; // 星標優先

                const typeA = (a.driverType || '正更') === '正更' ? 0 : 1;
                const typeB = (b.driverType || '正更') === '正更' ? 0 : 1;
                if (typeA !== typeB) return typeA - typeB;

                return (a.name || '').trim().localeCompare((b.name || '').trim(), 'zh-HK');
            });

            if (recordCountBadge) recordCountBadge.textContent = `共 ${filtered.length} 筆`;
            if (emptyState) {
                if (filtered.length === 0) emptyState.classList.remove('hidden');
                else emptyState.classList.add('hidden');
            }

            if (mobileList) {
                mobileList.innerHTML = filtered.map(rec => {
                    const isZhengGeng = (rec.driverType || '正更') === '正更';
                    const typeBadge = isZhengGeng ? '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-100 text-blue-800">正更</span>' : '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-purple-100 text-purple-800">替更</span>';
                    const shiftBadge = rec.shift === '早更' ? '<span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800"><i class="fa-solid fa-sun"></i> 早更</span>' : '<span class="px-2 py-0.5 rounded text-xs font-bold bg-indigo-100 text-indigo-800"><i class="fa-solid fa-moon"></i> 夜更</span>';
                    const starIconClass = rec.isStarred ? 'fa-solid fa-star text-amber-400 drop-shadow-xs' : 'fa-regular fa-star text-slate-300 hover:text-amber-400';
                    const sortedDays = DAYS_ORDER.filter(d => rec.days && rec.days.includes(d));
                    const daysHtml = sortedDays.length === 7 ? '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-xs font-bold">全星期</span>' : sortedDays.map(d => `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 text-xs">${d.replace('星期', '')}</span>`).join('');

                    return `
                        <div class="bg-white rounded-xl p-3.5 shadow-sm border ${rec.isStarred ? 'border-amber-300 bg-amber-50/20' : 'border-slate-200'} space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleStarRecord('${rec.id}')" class="text-base p-1 transition transform hover:scale-110" title="切換重點司機"><i class="${starIconClass}"></i></button>
                                    <span class="font-bold text-slate-900">${escapeHTML(rec.name)}</span>
                                    ${typeBadge}${shiftBadge}
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="editRecord('${rec.id}')" class="text-slate-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick="deleteRecord('${rec.id}')" class="text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1">${daysHtml}</div>
                            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                                <a href="tel:${escapeHTML(rec.phone)}" class="text-sm font-mono font-semibold text-slate-700"><i class="fa-solid fa-phone text-xs"></i> ${escapeHTML(rec.phone)}</a>
                                <a href="${getWhatsAppUrl(rec.phone)}" target="_blank" class="px-3 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (desktopBody) {
                desktopBody.innerHTML = filtered.map(rec => {
                    const isZhengGeng = (rec.driverType || '正更') === '正更';
                    const typeBadge = isZhengGeng ? '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-100 text-blue-800">正更</span>' : '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-purple-100 text-purple-800">替更</span>';
                    const shiftBadge = rec.shift === '早更' ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800"><i class="fa-solid fa-sun"></i> 早更</span>' : '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800"><i class="fa-solid fa-moon"></i> 夜更</span>';
                    const starIconClass = rec.isStarred ? 'fa-solid fa-star text-amber-400 drop-shadow-xs' : 'fa-regular fa-star text-slate-300 hover:text-amber-400';
                    const sortedDays = DAYS_ORDER.filter(d => rec.days && rec.days.includes(d));
                    const daysHtml = sortedDays.length === 7 ? '<span class="px-2.5 py-1 rounded bg-emerald-100 text-emerald-800 text-xs font-bold">全星期</span>' : sortedDays.map(d => `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 text-xs">${d.replace('星期', '')}</span>`).join('');

                    return `
                        <tr class="hover:bg-slate-50 transition ${rec.isStarred ? 'bg-amber-50/20' : ''}">
                            <td class="px-5 py-3.5 font-bold text-slate-900 flex items-center gap-2">
                                <button onclick="toggleStarRecord('${rec.id}')" class="text-base p-1 transition transform hover:scale-110" title="切換重點司機"><i class="${starIconClass}"></i></button>
                                <span>${escapeHTML(rec.name)}</span>
                                ${typeBadge}
                            </td>
                            <td class="px-4 py-3.5">${shiftBadge}</td>
                            <td class="px-4 py-3.5"><div class="flex flex-wrap gap-1">${daysHtml}</div></td>
                            <td class="px-4 py-3.5">
                                <div class="flex items-center gap-2">
                                    <a href="tel:${escapeHTML(rec.phone)}" class="font-mono text-slate-700">${escapeHTML(rec.phone)}</a>
                                    <a href="${getWhatsAppUrl(rec.phone)}" target="_blank" class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                                </div>
                            </td>
                            <td class="px-5 py-3.5 text-right">
                                <button onclick="editRecord('${rec.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-indigo-600 hover:bg-indigo-50"><i class="fa-solid fa-pen-to-square"></i> 修改</button>
                                <button onclick="deleteRecord('${rec.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i> 刪除</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        };

        window.toggleStarRecord = function(id) {
            const rec = rosterRecords.find(r => r.id === id);
            if (rec) {
                rec.isStarred = !rec.isStarred;
                renderTable();
                showToast(rec.isStarred ? '已設為重點編更司機！' : '已取消重點標記', 'success');
            }
        };

        // 備註與交接記事邏輯
        window.handleSaveNote = function(e) {
            e.preventDefault();
            const driverName = document.getElementById('noteDriverName').value.trim();
            const startDate = document.getElementById('noteStartDate').value;
            const endDate = document.getElementById('noteEndDate').value;
            const content = document.getElementById('noteContent').value.trim();
            const editingId = document.getElementById('editingNoteId').value;

            if (!content) return;

            if (editingId) {
                const idx = notesRecords.findIndex(n => n.id === editingId);
                if (idx !== -1) {
                    notesRecords[idx] = { ...notesRecords[idx], driverName, startDate, endDate, content };
                    showToast('已更新備註！記得點擊右上角儲存同步。', 'success');
                }
                window.cancelNoteEdit();
            } else {
                notesRecords.unshift({
                    id: 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    driverName, startDate, endDate, content, createdAt: Date.now()
                });
                document.getElementById('noteDriverName').value = '';
                document.getElementById('noteStartDate').value = '';
                document.getElementById('noteEndDate').value = '';
                document.getElementById('noteContent').value = '';
                showToast('已新增備註！記得點擊右上角儲存同步。', 'success');
            }

            renderNotes();
        };

        window.editNote = function(id) {
            const note = notesRecords.find(n => n.id === id);
            if (!note) return;
            document.getElementById('editingNoteId').value = note.id;
            document.getElementById('noteDriverName').value = note.driverName || '';
            document.getElementById('noteStartDate').value = note.startDate || '';
            document.getElementById('noteEndDate').value = note.endDate || '';
            document.getElementById('noteContent').value = note.content || '';
            document.getElementById('cancelNoteEditBtn').classList.remove('hidden');
            document.getElementById('noteSubmitText').textContent = '儲存修改';
        };

        window.cancelNoteEdit = function() {
            document.getElementById('editingNoteId').value = '';
            document.getElementById('noteDriverName').value = '';
            document.getElementById('noteStartDate').value = '';
            document.getElementById('noteEndDate').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('cancelNoteEditBtn').classList.add('hidden');
            document.getElementById('noteSubmitText').textContent = '新增備註';
        };

        window.deleteNote = function(id) {
            showConfirmDialog('確定刪除此備註？', () => {
                notesRecords = notesRecords.filter(n => n.id !== id);
                renderNotes();
                showToast('已刪除，請記得點擊右上角儲存同步', 'success');
            });
        };

        window.renderNotes = function() {
            const listEl = document.getElementById('notesList');
            const emptyEl = document.getElementById('notesEmptyState');
            const badgeEl = document.getElementById('notesCountBadge');

            if (badgeEl) badgeEl.textContent = notesRecords.length;
            if (emptyEl) {
                if (notesRecords.length === 0) emptyEl.classList.remove('hidden');
                else emptyEl.classList.add('hidden');
            }

            if (!listEl) return;
            listEl.innerHTML = notesRecords.map(note => {
                let dateBadge = (note.startDate || note.endDate) ? `<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-900"><i class="fa-regular fa-calendar"></i> ${escapeHTML(note.startDate || '即日起')} 至 ${escapeHTML(note.endDate || '另行通知')}</span>` : '';
                let driverBadge = note.driverName ? `<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-800 text-white"><i class="fa-solid fa-user"></i> ${escapeHTML(note.driverName)}</span>` : '';

                return `
                    <div class="p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 flex-wrap">${driverBadge} ${dateBadge}</div>
                            <div class="flex items-center gap-1">
                                <button onclick="editNote('${note.id}')" class="text-xs text-indigo-600 px-2 py-1 hover:bg-indigo-50 rounded"><i class="fa-solid fa-pen-to-square"></i> 修改</button>
                                <button onclick="deleteNote('${note.id}')" class="text-xs text-rose-600 px-2 py-1 hover:bg-rose-50 rounded"><i class="fa-solid fa-trash-can"></i> 刪除</button>
                            </div>
                        </div>
                        <p class="text-sm text-slate-800 whitespace-pre-line">${escapeHTML(note.content)}</p>
                    </div>
                `;
            }).join('');
        };

        initFirebaseAndLoad();
    </script>
</body>
</html>
