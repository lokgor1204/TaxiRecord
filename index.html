<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的士編更系統 v3.4.0 (Firebase ES Module 雲端版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Firebase ES Module Import Map -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
    }
    </script>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- 頂部導航與狀態欄 -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div id="cloudStatusBar" class="bg-amber-600 text-white px-4 py-1.5 text-xs font-bold text-center flex flex-wrap items-center justify-center gap-2 transition-all">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span id="cloudStatusText">正在連接 Firebase 雲端...</span>
            <button onclick="loadFromCloud()" class="underline ml-1 text-[11px] hover:text-slate-200 bg-black/20 px-2 py-0.5 rounded">重新載入</button>
            <button id="showErrorDetailBtn" onclick="toggleErrorDetailModal()" class="hidden text-[11px] bg-white text-rose-700 font-extrabold px-2 py-0.5 rounded shadow-sm">查看錯誤詳情</button>
        </div>

        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center shadow-inner shrink-0">
                    <i class="fa-solid fa-taxi text-white text-lg"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-base sm:text-lg tracking-tight truncate">的士編更系統</h1>
                        <span class="px-2 py-0.5 text-[10px] font-mono font-bold bg-slate-800 text-amber-400 border border-slate-700 rounded-md shrink-0">v3.4.0</span>
                    </div>
                    <div id="connectionSubText" class="flex items-center gap-1.5 text-[11px] text-amber-300 font-medium mt-0.5">
                        <span id="connectionDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        <span id="connectionLabel">準備連線至 taxirecord123...</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <button onclick="syncToCloud()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>立即同步</span>
                </button>
                <button onclick="exportLocalData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">匯出</span>
                </button>
            </div>
        </div>

        <div class="bg-slate-800 border-t border-slate-700">
            <div class="max-w-6xl mx-auto px-4 flex gap-2 py-2">
                <button onclick="switchMainTab('roster')" id="tabBtnRoster" class="px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-red-600 text-white shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>排班與備註</span>
                </button>
                <button onclick="switchMainTab('drivers')" id="tabBtnDrivers" class="px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-address-book"></i>
                    <span>司機資料庫</span>
                    <span id="navDriverCount" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-700 text-slate-200">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 錯誤診斷詳情彈窗 -->
    <div id="errorDetailModal" class="hidden fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-rose-200 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2 text-rose-600 font-bold text-sm">
                    <i class="fa-solid fa-bug"></i>
                    <span>Firebase 錯誤 Console 日誌</span>
                </div>
                <button onclick="toggleErrorDetailModal()" class="text-slate-400 hover:text-slate-700 text-sm font-bold px-2">✕</button>
            </div>
            <pre id="errorDetailContent" class="bg-slate-950 text-rose-300 p-3.5 rounded-xl text-xs font-mono overflow-x-auto max-h-64 whitespace-pre-wrap leading-relaxed">暫無錯誤紀錄</pre>
            <div class="flex justify-end gap-2">
                <button onclick="copyErrorDetail()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-white hover:bg-slate-700 transition">複製錯誤代碼</button>
                <button onclick="toggleErrorDetailModal()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">關閉</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <div id="customConfirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200">
            <div class="flex items-center gap-3 text-rose-600 mb-3">
                <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-circle-question text-lg"></i>
                </div>
                <h3 class="font-bold text-base text-slate-900">確認操作</h3>
            </div>
            <p id="confirmModalMessage" class="text-sm text-slate-600 mb-5 leading-relaxed"></p>
            <div class="flex justify-end gap-2">
                <button id="confirmCancelBtn" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">取消</button>
                <button id="confirmOkBtn" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow transition">確定執行</button>
            </div>
        </div>
    </div>

    <!-- 排班與備註主頁面 -->
    <main id="viewRoster" class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 lg:sticky lg:top-32">
                    <h2 id="formTitle" class="font-bold text-base text-slate-900 mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-user-plus text-red-600"></i>
                            <span id="formTitleText">加入司機排班紀錄</span>
                        </span>
                        <button id="cancelEditBtn" type="button" onclick="cancelEditMode()" class="hidden text-xs text-rose-600 hover:text-rose-700 font-semibold bg-rose-50 px-2.5 py-1 rounded-lg transition">取消修改</button>
                    </h2>

                    <form onsubmit="handleAddRecord(event)" class="space-y-4">
                        <input type="hidden" id="editingRecordId" value="">
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-xs font-bold text-slate-700">司機姓名 <span class="text-rose-500">*</span></label>
                            </div>
                            <input type="text" id="driverName" list="allDriverSuggestions" oninput="autoFillDriverFromDB(this.value)" required placeholder="輸入或選擇司機..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                            <datalist id="allDriverSuggestions"></datalist>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">聯絡電話 <span class="text-rose-500">*</span></label>
                            <input type="tel" id="driverPhone" required placeholder="例如：91234567" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">司機分類 <span class="text-rose-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50/50 has-[:checked]:text-blue-900 font-semibold text-xs">
                                    <input type="radio" name="driverType" value="正更" checked class="text-blue-600 focus:ring-blue-500"> 正更
                                </label>
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50/50 has-[:checked]:text-purple-900 font-semibold text-xs">
                                    <input type="radio" name="driverType" value="替更" class="text-purple-600 focus:ring-purple-500"> 替更
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">更份時段 <span class="text-rose-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/60 has-[:checked]:text-amber-900 font-semibold text-xs">
                                    <input type="radio" name="shiftType" value="早更" checked class="text-amber-500 focus:ring-amber-500"> 早更
                                </label>
                                <label class="flex items-center justify-center gap-2 p-2.5 border border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/60 has-[:checked]:text-indigo-900 font-semibold text-xs">
                                    <input type="radio" name="shiftType" value="夜更" class="text-indigo-600 focus:ring-indigo-500"> 夜更
                                </label>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-xs font-bold text-slate-700">可返工日子 <span class="text-rose-500">*</span></label>
                                <div class="flex gap-1.5">
                                    <button type="button" onclick="selectAllDays(true)" class="text-[11px] text-blue-600 hover:underline font-medium">全選</button>
                                    <span class="text-slate-300">|</span>
                                    <button type="button" onclick="selectAllDays(false)" class="text-[11px] text-slate-500 hover:underline">清除</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-4 gap-1.5">
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期一" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white transition">一</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期二" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white transition">二</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期三" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white transition">三</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期四" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white transition">四</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期五" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-slate-800 peer-checked:text-white transition">五</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期六" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-red-600 peer-checked:text-white transition">六</div></label>
                                <label class="cursor-pointer"><input type="checkbox" name="workDays" value="星期日" class="peer sr-only"><div class="text-center py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600 peer-checked:bg-red-600 peer-checked:text-white transition">日</div></label>
                            </div>
                        </div>
                        <button type="submit" id="submitRecordBtn" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                            <i id="submitRecordIcon" class="fa-solid fa-plus"></i>
                            <span id="submitRecordText">加入排班列表</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 flex flex-col gap-6">
                <div class="flex flex-col gap-4">
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                        <div class="flex flex-col sm:flex-row gap-3 justify-between">
                            <div class="relative flex-grow">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
                                <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋司機姓名或電話..." 
                                    class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                            </div>
                            <div class="flex items-center gap-2 justify-between sm:justify-end">
                                <div class="flex bg-slate-100 p-1 rounded-xl">
                                    <button onclick="setFilterShift('ALL')" data-shift="ALL" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white transition">全部</button>
                                    <button onclick="setFilterShift('早更')" data-shift="早更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition">早更</button>
                                    <button onclick="setFilterShift('夜更')" data-shift="夜更" class="shift-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition">夜更</button>
                                </div>
                                <span id="recordCountBadge" class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-xl whitespace-nowrap">共 0 筆</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div id="mobileRosterList" class="block sm:hidden p-3 space-y-3"></div>
                        <div class="hidden sm:block overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider">
                                        <th class="px-5 py-3">司機資料</th>
                                        <th class="px-4 py-3 whitespace-nowrap">更份</th>
                                        <th class="px-4 py-3">可返工日子</th>
                                        <th class="px-4 py-3">聯絡電話</th>
                                        <th class="px-5 py-3 text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="desktopRosterBody" class="divide-y divide-slate-100 text-sm"></tbody>
                            </table>
                        </div>
                        <div id="emptyState" class="hidden py-14 text-center text-slate-400">
                            <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                            <p class="text-sm font-medium">暫無符合條件的排班紀錄</p>
                        </div>
                    </div>
                </div>

                <!-- 備註與交接 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-clipboard-list text-amber-500"></i>
                            <span>備註與交接記事</span>
                            <span id="notesCountBadge" class="
