<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>的士編更系統 · 雲端紀錄</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";
        import { 
            getFirestore, collection, addDoc, deleteDoc, doc, 
            onSnapshot, query, orderBy, updateDoc 
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_bNvEgF5-4m8czZSv15ZTY8-7_7LYQPg",
            authDomain: "taxirecord123.firebaseapp.com",
            databaseURL: "https://taxirecord123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taxirecord123",
            storageBucket: "taxirecord123.firebasestorage.app",
            messagingSenderId: "23507400232",
            appId: "1:23507400232:web:bfe1110e57b2d82b25e71d",
            measurementId: "G-2BVTVP5W7N"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        
        // 三個 Collections
        const recordsCollection = collection(db, "shiftRecords"); // 司機紀錄
        const notesCollection = collection(db, "shiftNotes");     // 備註
        const driversCollection = collection(db, "driversData");  // 司機資料

        // 主 UI
        const tabRecords = document.getElementById('tabRecords');
        const tabNotes = document.getElementById('tabNotes');
        const tabDrivers = document.getElementById('tabDrivers');
        const panelRecords = document.getElementById('panelRecords');
        const panelNotes = document.getElementById('panelNotes');
        const panelDrivers = document.getElementById('panelDrivers');

        const connectionStatus = document.getElementById('connectionStatus');
        const versionEl = document.getElementById('version');
        const cloudSaveBtn = document.getElementById('cloudSaveBtn');
        const saveStatusMsg = document.getElementById('saveStatusMsg');

        const APP_VERSION = 'V1.2'; // 版本更新
        versionEl.textContent = APP_VERSION;

        // 全局數據
        let currentRecords = [];
        let currentNotes = [];
        let currentDrivers = [];

        // 待同步隊列
        let pendingChanges = [];
        let pendingNoteChanges = [];
        let pendingDriverChanges = [];

        // 編輯狀態
        let editingId = null;
        let editingNoteId = null;
        let editingDriverId = null;

        // 司機紀錄表單
        const form = document.getElementById('recordForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const plateInput = document.getElementById('plate');
        const formTitle = document.getElementById('formTitle');
        const saveBtn = document.getElementById('saveBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        let selectedWeekdays = new Set();
        let selectedShift = null;
        let selectedType = null; // 正更 / 替更

        // 備註表單
        const noteForm = document.getElementById('noteForm');
        const noteStart = document.getElementById('noteStart');
        const noteEnd = document.getElementById('noteEnd');
        const noteDriver = document.getElementById('noteDriver');
        const notePhone = document.getElementById('notePhone');
        const noteText = document.getElementById('noteText');
        const noteTitle = document.getElementById('noteTitle');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const noteCancelBtn = document.getElementById('noteCancelBtn');

        // 司機資料表單
        const driverForm = document.getElementById('driverForm');
        const dName = document.getElementById('dName');
        const dPhone = document.getElementById('dPhone');
        const driverTitle = document.getElementById('driverTitle');
        const addDriverBtn = document.getElementById('addDriverBtn');
        const driverCancelBtn = document.getElementById('driverCancelBtn');

        const WEEKDAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const WEEKDAY_LABEL = { 'mon': '一', 'tue': '二', 'wed': '三', 'thu': '四', 'fri': '五', 'sat': '六', 'sun': '日' };
        const SHIFT_LABEL = { 'morning': '早更', 'night': '夜更' };
        const NOTE_EXPIRE_DAYS = 6;

        const WA_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

        function setStatus(type) {
            const map = { connecting: { text: '連接中…', cls: 'status-connecting' }, connected: { text: '已連接', cls: 'status-connected' }, failed: { text: '連線失敗', cls: 'status-failed' } };
            const s = map[type] || map.connecting;
            connectionStatus.textContent = s.text;
            connectionStatus.className = 'conn-status ' + s.cls;
        }

        function showSaveMsg(text, ok) {
            saveStatusMsg.textContent = text;
            saveStatusMsg.className = 'save-msg ' + (ok ? 'save-ok' : 'save-fail');
            saveStatusMsg.style.display = 'inline-block';
            clearTimeout(window.__saveMsgTimer);
            window.__saveMsgTimer = setTimeout(() => { saveStatusMsg.style.display = 'none'; }, 3000);
        }

        function updatePendingIndicator() {
            const total = pendingChanges.length + pendingNoteChanges.length + pendingDriverChanges.length;
            if (total > 0) {
                cloudSaveBtn.classList.add('has-pending');
                cloudSaveBtn.textContent = `儲存 (${total})`;
            } else {
                cloudSaveBtn.classList.remove('has-pending');
                cloudSaveBtn.textContent = '儲存';
            }
        }

        function switchTab(tab) {
            tabRecords.classList.remove('active');
            tabNotes.classList.remove('active');
            tabDrivers.classList.remove('active');
            panelRecords.style.display = 'none';
            panelNotes.style.display = 'none';
            panelDrivers.style.display = 'none';

            if (tab === 'records') {
                tabRecords.classList.add('active');
                panelRecords.style.display = 'block';
            } else if (tab === 'notes') {
                tabNotes.classList.add('active');
                panelNotes.style.display = 'block';
            } else {
                tabDrivers.classList.add('active');
                panelDrivers.style.display = 'block';
            }
        }

        // ==========================================
        // Autocomplete 自動填入功能
        // ==========================================
        function setupAutocomplete(inputEl, phoneEl) {
            // 建立下拉選單容器
            const dropdown = document.createElement('div');
            dropdown.className = 'autocomplete-dropdown';
            dropdown.style.display = 'none';
            inputEl.parentNode.style.position = 'relative';
            inputEl.parentNode.appendChild(dropdown);

            inputEl.addEventListener('input', () => {
                const val = inputEl.value.trim().toLowerCase();
                if (!val) {
                    dropdown.style.display = 'none';
                    return;
                }
                
                // 從現有司機資料庫過濾
                const matches = currentDrivers.filter(d => d.name.toLowerCase().includes(val));
                
                if (matches.length === 0) {
                    dropdown.style.display = 'none';
                    return;
                }

                dropdown.innerHTML = matches.map(d => `
                    <div class="autocomplete-item" data-name="${escapeHtml(d.name)}" data-phone="${escapeHtml(d.phone)}">
                        <span>${escapeHtml(d.name)}</span>
                        <span class="ac-phone">${escapeHtml(d.phone)}</span>
                    </div>
                `).join('');
                dropdown.style.display = 'block';

                // 點擊選項自動填入
                dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                    item.addEventListener('click', () => {
                        inputEl.value = item.getAttribute('data-name');
                        if (phoneEl) phoneEl.value = item.getAttribute('data-phone');
                        dropdown.style.display = 'none';
                    });
                });
            });

            // 點擊外部關閉
            document.addEventListener('click', (e) => {
                if (e.target !== inputEl && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }

        // ==========================================
        // 1. 監聽數據
        // ==========================================
        function listenToRecords() {
            const q = query(recordsCollection, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                if (pendingChanges.length > 0) return;
                currentRecords = [];
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    currentRecords.push({ id: docSnap.id, ...d, weekdays: Array.isArray(d.weekdays) ? d.weekdays : (d.weekday ? [d.weekday] : []) });
                });
                renderRecords();
                setStatus('connected');
            }, (err) => { console.error(err); setStatus('failed'); });
        }

        function listenToNotes() {
            const q = query(notesCollection, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                if (pendingNoteChanges.length > 0) return;
                currentNotes = [];
                snapshot.forEach(docSnap => {
                    currentNotes.push({ id: docSnap.id, ...docSnap.data() });
                });
                cleanupExpiredNotes(currentNotes);
                renderNotes();
            });
        }

        function listenToDrivers() {
            const q = query(driversCollection, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                if (pendingDriverChanges.length > 0) return;
                currentDrivers = [];
                snapshot.forEach(docSnap => {
                    currentDrivers.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderDrivers();
            });
        }

        // ==========================================
        // 2. 渲染數據
        // ==========================================
        function renderRecords() {
            const list = document.getElementById('recordsList');
            if (currentRecords.length === 0) {
                list.innerHTML = `<div class="empty-message">暫時未有司機紀錄。</div>`;
                return;
            }
            list.innerHTML = currentRecords.map(rec => {
                const days = WEEKDAY_ORDER.filter(d => rec.weekdays.includes(d)).map(d => `<span class="day-tag">${WEEKDAY_LABEL[d]}</span>`).join('');
                const shift = SHIFT_LABEL[rec.shift] || rec.shift;
                const typeLabel = rec.type === '正更' ? '<span class="type-tag regular">正更</span>' : '<span class="type-tag substitute">替更</span>';
                const plate = rec.plate ? `<span class="record-plate">${escapeHtml(rec.plate)}</span>` : '';
                
                let wa = '';
                if (rec.phone) {
                    const c = rec.phone.replace(/[^0-9]/g, '');
                    const n = c.length === 8 ? '852' + c : c;
                    wa = `<a class="wa-btn" href="https://wa.me/${n}" target="_blank">${WA_ICON}</a>`;
                }

                return `
                    <div class="record-item ${rec._pending ? 'pending' : ''}" data-id="${rec.id}">
                        <div class="record-row-top">
                            <div class="row-left">
                                <span class="record-name">${escapeHtml(rec.name)}</span>
                                ${typeLabel}
                                <span class="record-shift ${rec.shift}">${shift}</span>
                                ${plate}
                            </div>
                            <div class="record-contact">
                                <span class="record-phone">${escapeHtml(rec.phone)}</span>
                                ${wa}
                            </div>
                        </div>
                        <div class="record-row-bottom">
                            <div class="days-tags">${days || '<span class="day-tag empty">未設定</span>'}</div>
                            <div class="record-actions">
                                <button class="edit-btn" onclick="enterEditMode('${rec.id}')">修改</button>
                                <button class="delete-btn" onclick="queueDelete('${rec.id}')">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNotes() {
            const list = document.getElementById('notesList');
            if (currentNotes.length === 0) {
                list.innerHTML = `<div class="empty-message">暫時未有備註。</div>`;
                return;
            }
            list.innerHTML = currentNotes.map(n => {
                const dates = n.startDate && n.endDate ? `${n.startDate} 至 ${n.endDate}` : '未設定';
                let wa = '';
                if (n.phone) {
                    const c = n.phone.replace(/[^0-9]/g, '');
                    const num = c.length === 8 ? '852' + c : c;
                    wa = `<a class="wa-btn" href="https://wa.me/${num}" target="_blank">${WA_ICON}</a>`;
                }
                return `
                    <div class="note-item ${n._pending ? 'pending' : ''}" data-id="${n.id}">
                        <div class="note-row-top">
                            <span class="note-date">${dates}</span>
                            <span class="note-text">${escapeHtml(n.text)}</span>
                        </div>
                        <div class="note-row-bottom">
                            <span class="note-driver">${escapeHtml(n.driver)}</span>
                            <div class="record-contact">
                                <span class="record-phone">${n.phone ? escapeHtml(n.phone) : ''}</span>
                                ${wa}
                            </div>
                        </div>
                        <div class="note-row-actions">
                            <span class="note-expire">自動刪除：${getExpireHint(n.endDate)}</span>
                            <div class="note-actions">
                                <button class="note-edit-btn" onclick="enterNoteEditMode('${n.id}')">修改</button>
                                <button class="note-delete-btn" onclick="queueDeleteNote('${n.id}')">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDrivers() {
            const list = document.getElementById('driversList');
            if (currentDrivers.length === 0) {
                list.innerHTML = `<div class="empty-message">暫時未有司機資料。</div>`;
                return;
            }
            list.innerHTML = currentDrivers.map(d => {
                const typeLabel = d.type === '正更' ? '<span class="type-tag regular">正更</span>' : '<span class="type-tag substitute">替更</span>';
                return `
                    <div class="driver-item ${d._pending ? 'pending' : ''}">
                        <div class="driver-info">
                            <span class="record-name">${escapeHtml(d.name)}</span>
                            ${typeLabel}
                        </div>
                        <div class="driver-phone">${escapeHtml(d.phone)}</div>
                        <div class="record-actions">
                            <button class="edit-btn" onclick="enterDriverEditMode('${d.id}')">修改</button>
                            <button class="delete-btn" onclick="queueDeleteDriver('${d.id}')">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getExpireHint(endDate) {
            if (!endDate) return '-';
            const end = new Date(endDate + 'T23:59:59');
            const exp = new Date(end.getTime() + 6 * 86400000);
            return `${exp.getFullYear()}-${String(exp.getMonth()+1).padStart(2,'0')}-${String(exp.getDate()).padStart(2,'0')}`;
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        // ==========================================
        // 3. 隊列操作 (本機暫存)
        // ==========================================
        // 司機紀錄
        window.queueDelete = (id) => {
            if (!confirm('確定刪除？(需撳儲存)')) return;
            const pAdd = pendingChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pAdd !== -1) { pendingChanges.splice(pAdd, 1); currentRecords = currentRecords.filter(r => r.id !== id); }
            else {
                pendingChanges = pendingChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingChanges.push({ type: 'delete', id });
                currentRecords = currentRecords.filter(r => r.id !== id);
            }
            renderRecords(); updatePendingIndicator(); if(editingId === id) exitEditMode();
        };

        window.enterEditMode = (id) => {
            const r = currentRecords.find(x => x.id === id); if(!r) return;
            editingId = id;
            nameInput.value = r.name; phoneInput.value = r.phone; plateInput.value = r.plate || '';
            selectedWeekdays = new Set(r.weekdays);
            document.querySelectorAll('.weekday-btn').forEach(b => b.classList.toggle('active', selectedWeekdays.has(b.dataset.day)));
            selectedShift = r.shift;
            document.querySelectorAll('.shift-btn').forEach(b => b.classList.toggle('active', b.dataset.shift === selectedShift));
            selectedType = r.type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === selectedType));
            formTitle.textContent = '修改司機紀錄'; saveBtn.textContent = '加入修改'; cancelEditBtn.style.display = 'inline-block';
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function exitEditMode() {
            editingId = null;
            form.reset();
            selectedWeekdays.clear(); selectedShift = null; selectedType = null;
            document.querySelectorAll('.weekday-btn, .shift-btn, .type-btn').forEach(b => b.classList.remove('active'));
            formTitle.textContent = '新增司機紀錄'; saveBtn.textContent = '加入新增'; cancelEditBtn.style.display = 'none';
        }

        // 備註
        window.queueDeleteNote = (id) => {
            if (!confirm('確定刪除？(需撳儲存)')) return;
            const pAdd = pendingNoteChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pAdd !== -1) { pendingNoteChanges.splice(pAdd, 1); currentNotes = currentNotes.filter(n => n.id !== id); }
            else {
                pendingNoteChanges = pendingNoteChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingNoteChanges.push({ type: 'delete', id });
                currentNotes = currentNotes.filter(n => n.id !== id);
            }
            renderNotes(); updatePendingIndicator(); if(editingNoteId === id) exitNoteEditMode();
        };

        window.enterNoteEditMode = (id) => {
            const n = currentNotes.find(x => x.id === id); if(!n) return;
            editingNoteId = id;
            noteStart.value = n.startDate; noteEnd.value = n.endDate;
            noteDriver.value = n.driver; notePhone.value = n.phone; noteText.value = n.text;
            noteTitle.textContent = '修改備註'; addNoteBtn.textContent = '加入修改'; noteCancelBtn.style.display = 'inline-block';
            noteForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function exitNoteEditMode() {
            editingNoteId = null;
            noteForm.reset();
            noteTitle.textContent = '新增備註'; addNoteBtn.textContent = '加入備註'; noteCancelBtn.style.display = 'none';
        }

        // 司機資料
        window.queueDeleteDriver = (id) => {
            if (!confirm('確定刪除？(需撳儲存)')) return;
            const pAdd = pendingDriverChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pAdd !== -1) { pendingDriverChanges.splice(pAdd, 1); currentDrivers = currentDrivers.filter(d => d.id !== id); }
            else {
                pendingDriverChanges = pendingDriverChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingDriverChanges.push({ type: 'delete', id });
                currentDrivers = currentDrivers.filter(d => d.id !== id);
            }
            renderDrivers(); updatePendingIndicator(); if(editingDriverId === id) exitDriverEditMode();
        };

        window.enterDriverEditMode = (id) => {
            const d = currentDrivers.find(x => x.id === id); if(!d) return;
            editingDriverId = id;
            dName.value = d.name; dPhone.value = d.phone;
            document.querySelectorAll('.d-type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === d.type));
            driverTitle.textContent = '修改司機資料'; addDriverBtn.textContent = '加入修改'; driverCancelBtn.style.display = 'inline-block';
            driverForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function exitDriverEditMode() {
            editingDriverId = null;
            driverForm.reset();
            document.querySelectorAll('.d-type-btn').forEach(b => b.classList.remove('active'));
            driverTitle.textContent = '新增司機資料'; addDriverBtn.textContent = '加入資料'; driverCancelBtn.style.display = 'none';
        }

        // ==========================================
        // 4. 初始化 & 事件綁定
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            // 建立按鈕
            const wContainer = document.getElementById('weekdayButtons');
            WEEKDAY_ORDER.forEach(d => {
                const b = document.createElement('button'); b.type = 'button'; b.className = 'weekday-btn'; b.dataset.day = d; b.textContent = WEEKDAY_LABEL[d];
                b.onclick = () => { if(selectedWeekdays.has(d)){selectedWeekdays.delete(d); b.classList.remove('active');} else {selectedWeekdays.add(d); b.classList.add('active');} };
                wContainer.appendChild(b);
            });

            const sContainer = document.getElementById('shiftButtons');
            ['morning', 'night'].forEach(s => {
                const b = document.createElement('button'); b.type = 'button'; b.className = 'shift-btn'; b.dataset.shift = s; b.textContent = SHIFT_LABEL[s];
                b.onclick = () => { selectedShift = s; document.querySelectorAll('.shift-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
                sContainer.appendChild(b);
            });

            const tContainer = document.getElementById('typeButtons');
            ['正更', '替更'].forEach(t => {
                const b = document.createElement('button'); b.type = 'button'; b.className = 'type-btn'; b.dataset.type = t; b.textContent = t;
                b.onclick = () => { selectedType = t; document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
                tContainer.appendChild(b);
            });

            const dtContainer = document.getElementById('dTypeButtons');
            ['正更', '替更'].forEach(t => {
                const b = document.createElement('button'); b.type = 'button'; b.className = 'd-type-btn'; b.dataset.type = t; b.textContent = t;
                b.onclick = () => { document.querySelectorAll('.d-type-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
                dtContainer.appendChild(b);
            });

            // 綁定 Autocomplete
            setupAutocomplete(nameInput, phoneInput);
            setupAutocomplete(noteDriver, notePhone);

            // 監聽 Firestore
            listenToRecords();
            listenToNotes();
            listenToDrivers();

            // 表單提交
            form.onsubmit = (e) => {
                e.preventDefault();
                if (!nameInput.value.trim() || !phoneInput.value.trim() || selectedWeekdays.size === 0 || !selectedShift || !selectedType) { alert('請填寫完整資料及選擇更別/正替更'); return; }
                const data = { name: nameInput.value.trim(), phone: phoneInput.value.trim(), plate: plateInput.value.trim(), weekdays: Array.from(selectedWeekdays), shift: selectedShift, type: selectedType };
                if (editingId) {
                    const idx = currentRecords.findIndex(r => r.id === editingId);
                    const pAdd = pendingChanges.find(c => c.type === 'add' && c.tempId === editingId);
                    if(pAdd) pAdd.data = data;
                    else { pendingChanges = pendingChanges.filter(c => !(c.type === 'update' && c.id === editingId)); pendingChanges.push({type:'update', id: editingId, data}); }
                    currentRecords[idx] = { ...currentRecords[idx], ...data, _pending: true };
                } else {
                    const tempId = 'temp_' + Date.now();
                    currentRecords.unshift({ id: tempId, ...data, _pending: true, createdAt: new Date() });
                    pendingChanges.push({ type: 'add', tempId, data });
                }
                renderRecords(); updatePendingIndicator(); exitEditMode(); showSaveMsg('已加入暫存', true);
            };

            noteForm.onsubmit = (e) => {
                e.preventDefault();
                if (!noteStart.value || !noteEnd.value || !noteDriver.value.trim() || !notePhone.value.trim() || !noteText.value.trim()) { alert('請填寫完整備註資料'); return; }
                const data = { startDate: noteStart.value, endDate: noteEnd.value, driver: noteDriver.value.trim(), phone: notePhone.value.trim(), text: noteText.value.trim() };
                if (editingNoteId) {
                    const idx = currentNotes.findIndex(n => n.id === editingNoteId);
                    const pAdd = pendingNoteChanges.find(c => c.type === 'add' && c.tempId === editingNoteId);
                    if(pAdd) pAdd.data = data;
                    else { pendingNoteChanges = pendingNoteChanges.filter(c => !(c.type === 'update' && c.id === editingNoteId)); pendingNoteChanges.push({type:'update', id: editingNoteId, data}); }
                    currentNotes[idx] = { ...currentNotes[idx], ...data, _pending: true };
                } else {
                    const tempId = 'note_' + Date.now();
                    currentNotes.unshift({ id: tempId, ...data, _pending: true, createdAt: new Date() });
                    pendingNoteChanges.push({ type: 'add', tempId, data });
                }
                renderNotes(); updatePendingIndicator(); exitNoteEditMode(); showSaveMsg('已加入暫存', true);
            };

            driverForm.onsubmit = (e) => {
                e.preventDefault();
                const typeBtn = document.querySelector('.d-type-btn.active');
                if (!dName.value.trim() || !dPhone.value.trim() || !typeBtn) { alert('請填寫姓名、電話並選擇正/替更'); return; }
                const data = { name: dName.value.trim(), phone: dPhone.value.trim(), type: typeBtn.dataset.type };
                if (editingDriverId) {
                    const idx = currentDrivers.findIndex(d => d.id === editingDriverId);
                    const pAdd = pendingDriverChanges.find(c => c.type === 'add' && c.tempId === editingDriverId);
                    if(pAdd) pAdd.data = data;
                    else { pendingDriverChanges = pendingDriverChanges.filter(c => !(c.type === 'update' && c.id === editingDriverId)); pendingDriverChanges.push({type:'update', id: editingDriverId, data}); }
                    currentDrivers[idx] = { ...currentDrivers[idx], ...data, _pending: true };
                } else {
                    const tempId = 'd_' + Date.now();
                    currentDrivers.unshift({ id: tempId, ...data, _pending: true, createdAt: new Date() });
                    pendingDriverChanges.push({ type: 'add', tempId, data });
                }
                renderDrivers(); updatePendingIndicator(); exitDriverEditMode(); showSaveMsg('已加入暫存', true);
            };

            // 取消修改
            cancelEditBtn.onclick = () => exitEditMode();
            noteCancelBtn.onclick = () => exitNoteEditMode();
            driverCancelBtn.onclick = () => exitDriverEditMode();

            // 分頁切換
            tabRecords.onclick = () => switchTab('records');
            tabNotes.onclick = () => switchTab('notes');
            tabDrivers.onclick = () => switchTab('drivers');

            // 儲存上雲端
            cloudSaveBtn.onclick = async () => {
                const total = pendingChanges.length + pendingNoteChanges.length + pendingDriverChanges.length;
                if (total === 0) { showSaveMsg('冇改動需要儲存', true); return; }

                cloudSaveBtn.disabled = true; cloudSaveBtn.textContent = '儲存中…';
                let sCount = 0, fCount = 0, fMsg = '';

                // 逐個處理隊列
                for (const change of pendingDriverChanges) {
                    try {
                        if (change.type === 'add') await addDoc(driversCollection, { ...change.data, createdAt: new Date() });
                        else if (change.type === 'update') await updateDoc(doc(db, "driversData", change.id), change.data);
                        else if (change.type === 'delete') await deleteDoc(doc(db, "driversData", change.id));
                        sCount++;
                    } catch (e) { fCount++; fMsg = e.message; }
                }
                for (const change of pendingChanges) {
                    try {
                        if (change.type === 'add') await addDoc(recordsCollection, { ...change.data, createdAt: new Date() });
                        else if (change.type === 'update') await updateDoc(doc(db, "shiftRecords", change.id), change.data);
                        else if (change.type === 'delete') await deleteDoc(doc(db, "shiftRecords", change.id));
                        sCount++;
                    } catch (e) { fCount++; fMsg = e.message; }
                }
                for (const change of pendingNoteChanges) {
                    try {
                        if (change.type === 'add') await addDoc(notesCollection, { ...change.data, createdAt: new Date() });
                        else if (change.type === 'update') await updateDoc(doc(db, "shiftNotes", change.id), change.data);
                        else if (change.type === 'delete') await deleteDoc(doc(db, "shiftNotes", change.id));
                        sCount++;
                    } catch (e) { fCount++; fMsg = e.message; }
                }

                cloudSaveBtn.disabled = false; updatePendingIndicator();

                if (fCount === 0) {
                    pendingChanges = []; pendingNoteChanges = []; pendingDriverChanges = [];
                    updatePendingIndicator();
                    showSaveMsg(`儲存成功 (${sCount} 項)`, true);
                    currentRecords.forEach(r => delete r._pending);
                    currentNotes.forEach(n => delete n._pending);
                    currentDrivers.forEach(d => delete d._pending);
                    renderRecords(); renderNotes(); renderDrivers();
                } else {
                    showSaveMsg(`儲存失敗 (${fCount} 項): ${fMsg}`, false);
                }
            };
        });
    </script>

<body>
    <div class="container">
        <div class="header-row">

                <h1>的士編更系統</h1>
                <span class="version" id="version">V1.2</span>
            </div>
            <div class="right-top">

                <div class="save-row">
                    <span id="saveStatusMsg" class="save-msg"></span>
                    <button type="button" id="cloudSaveBtn" class="cloud-save-btn">儲存</button>
                </div>
            </div>
        </div>
        <div class="subhead">
            管理司機資料、排更同備註。所有改動會先暫存，撳右上角「儲存」才會寫上雲端。

        <div class="tabs">

        <!-- 分頁 1：司機紀錄 -->

            <div class="form-card">
                <h2 id="formTitle">新增司機紀錄</h2>
                <form id="recordForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>司機姓名</label>
                            <input type="text" id="name" placeholder="陳大文" required autocomplete="off">
                        </div>
                        <div class="input-group">
                            <label>電話號碼</label>
                            <input type="tel" id="phone" placeholder="91234567" required>
                        </div>
                        <div class="input-group" style="grid-column: 1 / -1;">
                            <label>逢星期幾返工（可揀多日）</label>
                            <div id="weekdayButtons" class="weekday-selector"></div>
                        </div>
                        <div class="input-group">
                            <label>更別</label>
                            <div id="shiftButtons" class="shift-selector"></div>
                        </div>
                        <div class="input-group">
                            <label>車牌（選填）</label>
                            <input type="text" id="plate" placeholder="AB 1234">

                            <div id="typeButtons" class="type-selector"></div>

                    </div>
                    <div class="record-form-actions">
                        <button type="submit" id="saveBtn" class="btn btn-primary">加入新增</button>
                        <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display: none;">取消修改</button>
                    </div>
                </form>
            </div>

            <div class="records-header">
                <h2>司機紀錄</h2>
            </div>
            <div id="recordsList" class="records-list">
                <div class="empty-message">載入中...</div>
            </div>
        </div>

        <!-- 分頁 2：備註 -->
        <div id="panelNotes" style="display: none;">
            <div class="note-form-card form-card">
                <h3 id="noteTitle">新增備註</h3>
                <form id="noteForm">
                    <div class="note-line-1">
                        <div class="input-group">
                            <label>開始日期</label>
                            <input type="date" id="noteStart" required>
                        </div>
                        <div class="input-group">
                            <label>結束日期</label>
                            <input type="date" id="noteEnd" required>
                        </div>
                    </div>
                    <div class="note-line-2">
                        <div class="input-group">
                            <label>司機姓名 (可搜尋)</label>
                            <input type="text" id="noteDriver" placeholder="A司機" required autocomplete="off">
                        </div>
                        <div class="input-group">
                            <label>電話號碼</label>
                            <input type="tel" id="notePhone" placeholder="91234567" required>
                        </div>
                    </div>
                    <div class="note-line-3">
                        <div class="input-group">
                            <label>備註事情</label>
                            <input type="text" id="noteText" placeholder="放假 / 優先排更" required>
                        </div>
                        <button type="submit" id="addNoteBtn" class="btn btn-primary" style="padding: 9px 16px; white-space: nowrap;">加入備註</button>
                        <button type="button" id="noteCancelBtn" class="btn btn-outline" style="display: none; padding: 9px 16px; white-space: nowrap;">取消修改</button>
                    </div>
                </form>
            </div>

            <div id="notesList" class="records-list">
                <div class="empty-message">載入中...</div>
            </div>
        </div>

        <!-- 分頁 3：司機資料 -->
        <div id="panelDrivers" style="display: none;">
            <div class="form-card">
                <h3 id="driverTitle">新增司機資料</h3>
                <form id="driverForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>司機姓名</label>
                            <input type="text" id="dName" placeholder="陳大文" required>
                        </div>
                        <div class="input-group">
                            <label>電話號碼</label>
                            <input type="tel" id="dPhone" placeholder="91234567" required>
                        </div>
                        <div class="input-group" style="grid-column: 1 / -1;">
                            <label>類型</label>
                            <div id="dTypeButtons" class="d-type-selector"></div>
                        </div>
                    </div>
                    <div class="record-form-actions">
                        <button type="submit" id="addDriverBtn" class="btn btn-primary">加入資料</button>
                        <button type="button" id="driverCancelBtn" class="btn btn-outline" style="display: none;">取消修改</button>
                    </div>
                </form>
            </div>

            <div class="records-header">
