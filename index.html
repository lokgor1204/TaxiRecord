        /* ================= 細工具 ================= */
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function normPhone(v) { return (v || '').replace(/[^0-9]/g, ''); }

        function isPhoneOk(v) {
            const c = normPhone(v);
            return c.length === 8 || (c.length === 11 && c.indexOf('852') === 0);
        }

        function waNumber(v) {
            const c = normPhone(v);
            return c.length === 8 ? '852' + c : c;
        }

        function toMillis(v) {
            if (!v) return 0;
            if (typeof v.toMillis === 'function') return v.toMillis();
            if (v instanceof Date) return v.getTime();
            if (typeof v === 'number') return v;
            const t = Date.parse(v);
            return isNaN(t) ? 0 : t;
        }

        function pendingTotal() {
            return pendingChanges.length + pendingNoteChanges.length + pendingDriverChanges.length;
        }

        function setStatus(type) {
            const map = {
                connecting: { text: '連接中…', cls: 'status-connecting' },
                connected: { text: '已連接', cls: 'status-connected' },
                failed: { text: '連線失敗', cls: 'status-failed' }
            };
            const s = map[type] || map.connecting;
            connectionStatus.textContent = s.text;
            connectionStatus.className = 'conn-status ' + s.cls;
        }

        function showSaveMsg(text, ok) {
            saveStatusMsg.textContent = text;
            saveStatusMsg.className = 'save-msg ' + (ok ? 'save-ok' : 'save-fail');
            saveStatusMsg.style.display = 'inline-block';
            clearTimeout(window.__saveMsgTimer);
            window.__saveMsgTimer = setTimeout(() => { saveStatusMsg.style.display = 'none'; }, 3500);
        }

        function updatePendingIndicator() {
            const total = pendingTotal();
            if (saving) return;
            if (total > 0) {
                cloudSaveBtn.classList.add('has-pending');
                cloudSaveBtn.textContent = `儲存 (${total})`;
            } else {
                cloudSaveBtn.classList.remove('has-pending');
                cloudSaveBtn.textContent = '儲存';
            }
        }

        /* ===== 同一個 id 只保留一條 update，資料合併而唔係覆蓋 ===== */
        function queueChange(pending, id, data) {
            const add = pending.find(c => c.type === 'add' && c.tempId === id);
            if (add) { Object.assign(add.data, data); return; }
            const ex = pending.find(c => c.type === 'update' && c.id === id);
            if (ex) { Object.assign(ex.data, data); return; }
            pending.push({ type: 'update', id, data: Object.assign({}, data) });
        }

        /* ===== 雲端資料同未儲存改動合併 ===== */
        function mergeWithPending(serverList, pending) {
            const map = new Map();
            serverList.forEach(d => map.set(d.id, Object.assign({}, d)));

            for (const c of pending) {
                if (c.type === 'delete') {
                    map.delete(c.id);
                } else if (c.type === 'update') {
                    const cur = map.get(c.id);
                    if (cur) map.set(c.id, Object.assign({}, cur, c.data, { _pending: true }));
                }
            }

            const adds = pending
                .filter(c => c.type === 'add')
                .map(c => Object.assign({ id: c.tempId }, c.data, { _pending: true }));

            return adds.concat(Array.from(map.values()));
        }

            }
        }

                dropdown.innerHTML = matches.map(d => `

                        <span class="ac-phone">${escapeHtml(d.phone)}</span>

                        phoneInput.value = item.getAttribute('data-phone');
                        selectedType = item.getAttribute('data-type');

            });

            document.addEventListener('click', (e) => {
                if (e.target !== nameInput && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';

        }

        /* ================= 讀取雲端 ================= */
        function listenAll() {
            if (unsubRecords) return;
            setStatus('connecting');

            unsubRecords = onSnapshot(recordsCollection, (snapshot) => {
                const server = [];
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    server.push(Object.assign({ id: docSnap.id }, d, {
                        weekdays: Array.isArray(d.weekdays) ? d.weekdays : (d.weekday ? [d.weekday] : []),
                        isStarred: !!d.isStarred
                    }));
                });
                currentRecords = mergeWithPending(server, pendingChanges);
                renderRecords();
                setStatus('connected');
            }, (err) => { console.error(err); setStatus('failed'); });

            unsubNotes = onSnapshot(notesCollection, (snapshot) => {
                const server = [];
                snapshot.forEach(docSnap => server.push(Object.assign({ id: docSnap.id }, docSnap.data())));
                cleanupExpiredNotes(server);
                currentNotes = mergeWithPending(server, pendingNoteChanges);
                renderNotes();
            }, (err) => { console.error(err); });

            unsubDrivers = onSnapshot(driversCollection, (snapshot) => {
                const server = [];
                snapshot.forEach(docSnap => server.push(Object.assign({ id: docSnap.id }, docSnap.data())));
                currentDrivers = mergeWithPending(server, pendingDriverChanges);
                renderDrivers();
                renderNotes();
                renderRecords();
            }, (err) => { console.error(err); });
        }

        function stopListeners() {
            if (unsubRecords) { unsubRecords(); unsubRecords = null; }
            if (unsubNotes) { unsubNotes(); unsubNotes = null; }
            if (unsubDrivers) { unsubDrivers(); unsubDrivers = null; }
        }

        async function cleanupExpiredNotes(notes) {
            const now = new Date();
            const expired = notes.filter(n => {
                if (!n.endDate) return false;
                const end = new Date(n.endDate + 'T23:59:59');
                return now > new Date(end.getTime() + 6 * 86400000);
            });
            for (const n of expired) {
                try { await deleteDoc(doc(db, "shiftNotes", n.id)); } catch (e) { console.error(e); }
            }
        }

        /* ================= 列表畫面 ================= */
        function renderRecords() {
            const list = document.getElementById('recordsList');

            let filtered = currentRecords;
            if (recordSearchQuery) {
                const q = recordSearchQuery.toLowerCase();
                filtered = filtered.filter(r => (r.name || '').toLowerCase().includes(q) || (r.phone || '').includes(q));
            }
            if (recordSearchType) filtered = filtered.filter(r => r.type === recordSearchType);
            if (recordSearchShift) filtered = filtered.filter(r => r.shift === recordSearchShift);
            if (recordSearchWeekdays.size > 0) {
                filtered = filtered.filter(r => Array.from(recordSearchWeekdays).every(day => (r.weekdays || []).includes(day)));
            }

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-message">暫時未有符合條件嘅指定編更。</div>`;
                return;
            }

            const sortedRecords = filtered.slice().sort((a, b) => {
                if (a.isStarred && !b.isStarred) return -1;
                if (!a.isStarred && b.isStarred) return 1;
                if (a.type === '正更' && b.type !== '正更') return -1;
                if (a.type !== '正更' && b.type === '正更') return 1;
                return (a.name || '').localeCompare(b.name || '', 'zh-HK');
            });

            list.innerHTML = sortedRecords.map(rec => {
                const days = WEEKDAY_ORDER.filter(d => (rec.weekdays || []).includes(d))
                    .map(d => `<span class="day-tag">${WEEKDAY_LABEL[d]}</span>`).join('');
                const shift = SHIFT_LABEL[rec.shift] || rec.shift || '';
                const typeLabel = rec.type === '正更'
                    ? '<span class="type-tag regular">正更</span>'
                    : '<span class="type-tag substitute">替更</span>';

                /* 以紀錄自己嘅車牌為先，冇才用司機資料庫嘅 */
                let displayPlate = (rec.plate || '').trim();
                if (!displayPlate) {
                    const matchedDriver = currentDrivers.find(d => d.name === rec.name);
                    if (matchedDriver && matchedDriver.plate) displayPlate = matchedDriver.plate;
                }
                const plateLabel = displayPlate ? `<span class="record-plate">${escapeHtml(displayPlate)}</span>` : '';

                let wa = '';
                if (rec.phone) {
                    wa = `<a class="wa-btn" href="https://wa.me/${waNumber(rec.phone)}" target="_blank" rel="noopener noreferrer">${WA_ICON}</a>`;
                }

                const starBtn = rec.isStarred
                    ? `<button class="star-btn starred" onclick="toggleStar('${rec.id}')">★</button>`
                    : `<button class="star-btn" onclick="toggleStar('${rec.id}')">☆</button>`;

                return `
                    <div class="record-item ${rec._pending ? 'pending' : ''}" data-id="${rec.id}">
                        <div class="record-row-top">
                            <div class="row-left">
                                ${starBtn}
                                <span class="driver-name-tag">${escapeHtml(rec.name)}</span>
                                ${typeLabel}
                                <span class="record-shift ${rec.shift}">${shift}</span>
                                ${plateLabel}
                            </div>
                            <div class="record-contact">
                                <span class="record-phone">${escapeHtml(rec.phone)}</span>
                                ${wa}
                            </div>
                        </div>
                        <div class="record-row-bottom">
                            <div class="days-tags">${days || '<span class="day-tag empty">未設定</span>'}</div>
                            <div class="record-actions">
                                <button class="edit-btn" onclick="enterEditMode('${rec.id}')">修改</button>
                                <button class="delete-btn" onclick="queueDelete('${rec.id}')">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNotes() {
            const list = document.getElementById('notesList');

            let filteredNotes = currentNotes;
            if (noteSearchStart) filteredNotes = filteredNotes.filter(n => n.endDate && n.endDate >= noteSearchStart);
            if (noteSearchEnd) filteredNotes = filteredNotes.filter(n => n.startDate && n.startDate <= noteSearchEnd);
            if (noteSearchType) {
                filteredNotes = filteredNotes.filter(n => {
                    const md = n.driver ? currentDrivers.find(d => d.name === n.driver) : null;
                    const t = (md && md.type) ? md.type : n.type;
                    return t === noteSearchType;
                });
            }
            if (noteSearchShift) {
                filteredNotes = filteredNotes.filter(n => {
                    const md = n.driver ? currentDrivers.find(d => d.name === n.driver) : null;
                    const s = (md && md.shift) ? md.shift : n.shift;
                    return s === noteSearchShift;
                });
            }

            if (filteredNotes.length === 0) {
                list.innerHTML = `<div class="empty-message">冇符合條件嘅備註。</div>`;
                return;
            }

            /* ===== 按「距離今日」排序：日期範圍包含今日 → 最上 ===== */
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const todayMs = todayStart.getTime();

            const noteDistance = (n) => {
                const sRaw = n.startDate ? new Date(n.startDate + 'T00:00:00').getTime() : NaN;
                const eRaw = n.endDate ? new Date(n.endDate + 'T00:00:00').getTime() : NaN;
                const sv = isNaN(sRaw) ? null : sRaw;
                const ev = isNaN(eRaw) ? null : eRaw;

                if (sv === null && ev === null) return Number.MAX_SAFE_INTEGER;
                if (sv !== null && ev !== null && todayMs >= sv && todayMs <= ev) return 0;

                const ds = sv !== null ? Math.abs(todayMs - sv) : Infinity;
                const de = ev !== null ? Math.abs(todayMs - ev) : Infinity;
                return Math.min(ds, de);
            };

            filteredNotes = filteredNotes.slice().sort((a, b) => {
                const da = noteDistance(a);
                const db = noteDistance(b);
                if (da !== db) return da - db;
                const sa = a.startDate || '';
                const sb = b.startDate || '';
                if (sa !== sb) return sb.localeCompare(sa);
                return toMillis(b.createdAt) - toMillis(a.createdAt);
            });

            list.innerHTML = filteredNotes.map(n => {
                const dates = (n.startDate && n.endDate) ? `${n.startDate} 至 ${n.endDate}` : '未設定';

                const matchedDriver = n.driver ? currentDrivers.find(d => d.name === n.driver) : null;

                let displayType = n.type || '';
                let displayShift = n.shift || '';
                if (matchedDriver) {
                    if (matchedDriver.type) displayType = matchedDriver.type;
                    if (matchedDriver.shift) displayShift = matchedDriver.shift;
                }

                const typeLabel = displayType === '正更'
                    ? '<span class="type-tag regular">正更</span>'
                    : (displayType === '替更' ? '<span class="type-tag substitute">替更</span>' : '');
                const shiftLabel = displayShift ? `<span class="record-shift ${displayShift}">${SHIFT_LABEL[displayShift]}</span>` : '';

                /* 有司機名 → 顯示名；只有車牌 → 只顯示車牌 */
                const nameLabel = n.driver
                    ? `<span class="driver-name-tag">${escapeHtml(n.driver)}</span>`
                    : (n.plate ? `<span class="record-plate">${escapeHtml(n.plate)}</span>` : '');

                /* 電話：有司機名才顯示，優先取司機資料庫最新電話 */
                let displayPhone = '';
                if (n.driver) {
                    displayPhone = (matchedDriver && matchedDriver.phone) ? matchedDriver.phone : (n.phone || '');
                }

                let wa = '';
                if (displayPhone) {
                    wa = `<a class="wa-btn" href="https://wa.me/${waNumber(displayPhone)}" target="_blank" rel="noopener noreferrer">${WA_ICON}</a>`;
                }

                let daysTags = '';
                if (n.weekdays && n.weekdays.length > 0) {
                    daysTags = `<div class="days-tags" style="margin-top: 4px;">${WEEKDAY_ORDER.filter(d => n.weekdays.includes(d)).map(d => `<span class="day-tag" style="background:#fce7f3; color:#be185d;">${WEEKDAY_LABEL[d]}</span>`).join('')}</div>`;
                }

                return `
                    <div class="note-item ${n._pending ? 'pending' : ''}" data-id="${n.id}">
                        <div class="note-row-top">
                            <span class="note-date">${dates}</span>
                            <span class="note-text">${escapeHtml(n.text)}</span>
                        </div>
                        <div class="note-row-bottom">
                            <div class="row-left" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                    ${nameLabel}
                                    ${typeLabel}
                                    ${shiftLabel}
                                </div>
                                ${daysTags}
                            </div>
                            <div class="record-contact">
                                <span class="record-phone">${displayPhone ? escapeHtml(displayPhone) : ''}</span>
                                ${wa}
                            </div>
                        </div>
                        <div class="note-row-footer">
                            <span class="note-expire">自動刪除：${getExpireHint(n.endDate)}</span>
                            <div class="record-actions">
                                <button class="edit-btn" onclick="enterNoteEditMode('${n.id}')">修改</button>
                                <button class="delete-btn" onclick="queueDeleteNote('${n.id}')">刪除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDrivers() {
            const list = document.getElementById('driversList');

            let filtered = currentDrivers.slice();
            if (driverSearchQuery) {
                const q = driverSearchQuery.toLowerCase();
                filtered = currentDrivers.filter(d =>
                    (d.name || '').toLowerCase().includes(q) ||
                    (d.phone || '').includes(q) ||
                    (d.plate || '').toLowerCase().includes(q)
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-message">${driverSearchQuery ? '搵唔到符合嘅司機' : '暫時未有司機資料'}</div>`;
                return;
            }

            filtered.sort((a, b) => {
                const pA = normPhone(a.phone);
                const pB = normPhone(b.phone);
                if (!pA && pB) return 1;
                if (pA && !pB) return -1;
                return pA.localeCompare(pB);
            });

            list.innerHTML = filtered.map(d => {
                const typeLabel = d.type === '正更'
                    ? '<span class="type-tag regular">正更</span>'
                    : '<span class="type-tag substitute">替更</span>';
                const shiftLabel = d.shift ? `<span class="record-shift ${d.shift}">${SHIFT_LABEL[d.shift]}</span>` : '';
                const plateLabel = d.plate ? `<span class="record-plate">${escapeHtml(d.plate)}</span>` : '';

                let wa = '';
                if (d.phone) {
                    wa = `<a class="wa-btn" href="https://wa.me/${waNumber(d.phone)}" target="_blank" rel="noopener noreferrer">${WA_ICON}</a>`;
                }

                return `
                    <div class="driver-item ${d._pending ? 'pending' : ''}">
                        <div class="row-left driver-left">
                            <span class="driver-name-tag">${escapeHtml(d.name)}</span>
                            ${typeLabel}
                            ${shiftLabel}
                            ${plateLabel}
                        </div>
                        <div class="driver-right">
                            <span class="driver-phone">${escapeHtml(d.phone)}</span>
                            ${wa}
                        </div>
                        <div class="record-actions">
                            <button class="edit-btn" onclick="enterDriverEditMode('${d.id}')">修改</button>
                            <button class="delete-btn" onclick="queueDeleteDriver('${d.id}')">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getExpireHint(endDate) {
            if (!endDate) return '-';
            const end = new Date(endDate + 'T23:59:59');
            const exp = new Date(end.getTime() + 6 * 86400000);
            return `${exp.getFullYear()}-${String(exp.getMonth() + 1).padStart(2, '0')}-${String(exp.getDate()).padStart(2, '0')}`;
        }

        /* ================= 星標 / 刪除 / 修改 ================= */
        window.toggleStar = (id) => {
            const idx = currentRecords.findIndex(r => r.id === id);
            if (idx === -1) return;
            const newStarred = !currentRecords[idx].isStarred;
            currentRecords[idx].isStarred = newStarred;
            currentRecords[idx]._pending = true;
            queueChange(pendingChanges, id, { isStarred: newStarred });
            renderRecords();
            updatePendingIndicator();
        };

        window.queueDelete = (id) => {
            if (!confirm('確定刪除？(需撳儲存)')) return;
            const pAdd = pendingChanges.findIndex(c => c.type === 'add' && c.tempId === id);
            if (pAdd !== -1) {
                pendingChanges.splice(pAdd, 1);
            } else {
                pendingChanges = pendingChanges.filter(c => !(c.type === 'update' && c.id === id));
                pendingChanges.push({ type: 'delete', id });
            }
            currentRecords = currentRecords.filter(r => r.id !== id);
            renderRecords();
            updatePendingIndicator();
            if (editingId === id) exitEditMode();
        };

            noteCancelBtn.style.display = 'none';

        /* ================= 密碼閘 ================= */
        let unlockedInMemory = false;

        function readUnlocked() {
            try { return localStorage.getItem(UNLOCK_KEY) === '1'; }
            catch (e) { return unlockedInMemory; }
        }

        function saveUnlocked() {
            unlockedInMemory = true;
            try { localStorage.setItem(UNLOCK_KEY, '1'); } catch (e) { /* 無痕模式 */ }
        }

        function clearUnlocked() {
            unlockedInMemory = false;
            try { localStorage.removeItem(UNLOCK_KEY); } catch (e) { /* ignore */ }
        }

        function showLockScreen() {
            appRoot.style.display = 'none';
            lockScreen.style.display = 'flex';
            lockInput.value = '';
            lockError.style.display = 'none';
            setTimeout(() => { try { lockInput.focus(); } catch (e) {} }, 150);
        }

        function unlockApp() {
            saveUnlocked();
            lockScreen.style.display = 'none';
            appRoot.style.display = 'block';
            listenAll();
        }

        function tryUnlock() {
            if (lockInput.value === ACCESS_PASSWORD) {
                lockError.style.display = 'none';
                unlockApp();
            } else {
                lockError.style.display = 'block';
                lockInput.value = '';
                lockInput.focus();
            }
        }

        /* ================= 建立按鈕 / 綁定事件 ================= */
        function buildControls() {
            const wContainer = document.getElementById('weekdayButtons');
            WEEKDAY_ORDER.forEach(d => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'weekday-btn';
                b.dataset.day = d;
                b.textContent = WEEKDAY_LABEL[d];
                b.onclick = () => {
                    if (selectedWeekdays.has(d)) { selectedWeekdays.delete(d); b.classList.remove('active'); }
                    else { selectedWeekdays.add(d); b.classList.add('active'); }
                };
                wContainer.appendChild(b);
            });

            const nwContainer = document.getElementById('noteWeekdayButtons');
            WEEKDAY_ORDER.forEach(d => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'weekday-btn note-weekday-btn';
                b.dataset.day = d;
                b.textContent = WEEKDAY_LABEL[d];
                b.onclick = () => {
                    if (selectedNoteWeekdays.has(d)) { selectedNoteWeekdays.delete(d); b.classList.remove('active'); }
                    else { selectedNoteWeekdays.add(d); b.classList.add('active'); }
                };

                    b.classList.add('active');
                };
                sContainer.appendChild(b);

            const dtContainer = document.getElementById('dTypeButtons');
            ['正更', '替更'].forEach(t => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'd-type-btn';
                b.dataset.type = t;
                b.textContent = t;
                b.onclick = () => {
                    document.querySelectorAll('.d-type-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                dtContainer.appendChild(b);
            });

            const dsContainer = document.getElementById('dShiftButtons');
            ['morning', 'night', 'special'].forEach(s => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'd-shift-btn shift-btn';
                b.dataset.shift = s;
                b.textContent = SHIFT_SELECT_LABEL[s];
                b.onclick = () => {
                    dSelectedShift = s;
                    document.querySelectorAll('.d-shift-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                dsContainer.appendChild(b);

        function wireEvents() {
            /* 密碼閘 */
            lockBtn.onclick = tryUnlock;
            lockInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tryUnlock(); } });

            /* 鎖定掣 */
            lockNowBtn.onclick = () => {
                if (pendingTotal() > 0) {
                    if (!confirm(`仲有 ${pendingTotal()} 項改動未儲存，鎖定後會全部消失。\n確定要鎖定？`)) return;
                    pendingChanges = [];
                    pendingNoteChanges = [];
                    pendingDriverChanges = [];
                }
                clearUnlocked();
                stopListeners();
                location.reload();
            };

            resetRecordBtn.onclick = () => {
                if (confirm('確定要清空所有輸入及選項嗎？')) exitEditMode();
            };

            setupRecordAutocomplete();
            setupNoteAutocomplete();

            searchDriverInput.addEventListener('input', (e) => {
                driverSearchQuery = e.target.value.trim();
                renderDrivers();
            });

            searchRecordText.addEventListener('input', (e) => { recordSearchQuery = e.target.value.trim(); renderRecords(); });
            searchRecordType.addEventListener('change', (e) => { recordSearchType = e.target.value; renderRecords(); });
            searchRecordShift.addEventListener('change', (e) => { recordSearchShift = e.target.value; renderRecords(); });

            recordWeekdayCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) recordSearchWeekdays.add(cb.value);
                    else recordSearchWeekdays.delete(cb.value);
                    renderRecords();
                });
            });

            clearRecordSearchBtn.addEventListener('click', () => {
                searchRecordText.value = '';
                searchRecordType.value = '';
                searchRecordShift.value = '';
                recordWeekdayCheckboxes.forEach(cb => { cb.checked = false; });
                recordSearchQuery = '';
                recordSearchType = '';
                recordSearchShift = '';
                recordSearchWeekdays.clear();
                renderRecords();
            });

            searchNoteStart.addEventListener('input', (e) => { noteSearchStart = e.target.value; renderNotes(); });
            searchNoteEnd.addEventListener('input', (e) => { noteSearchEnd = e.target.value; renderNotes(); });
            searchNoteType.addEventListener('change', (e) => { noteSearchType = e.target.value; renderNotes(); });
            searchNoteShift.addEventListener('change', (e) => { noteSearchShift = e.target.value; renderNotes(); });

            clearNoteSearchBtn.addEventListener('click', () => {
                searchNoteStart.value = '';
                searchNoteEnd.value = '';
                searchNoteType.value = '';
                searchNoteShift.value = '';
                noteSearchStart = '';
                noteSearchEnd = '';
                noteSearchType = '';
                noteSearchShift = '';
                renderNotes();
            });

            /* 撳外面自動收合「星期幾」下拉 */
            document.addEventListener('click', (e) => {
                document.querySelectorAll('details.wd-dropdown[open]').forEach(d => {
                    if (!d.contains(e.target)) d.removeAttribute('open');
                });
            });

            /* 未儲存就關頁面 → 警告 */
            window.addEventListener('beforeunload', (e) => {
                if (pendingTotal() > 0) { e.preventDefault(); e.returnValue = ''; return ''; }
            });

            /* ===== 指定編更 提交 ===== */
            form.onsubmit = (e) => {
                e.preventDefault();
                const inputName = nameInput.value.trim();

                if (!inputName || !phoneInput.value || !selectedType || selectedWeekdays.size === 0 || !selectedShift) {
                    alert('請喺名單中撳選司機，並選擇星期幾及更別。');
                    return;
                }
                if (!isPhoneOk(phoneInput.value)) {
                    alert('呢位司機嘅電話號碼唔完整（要 8 位數字），請先去「司機資料」改正。');
                    return;
                }
                if (!editingId && currentRecords.some(r => (r.name || '').toLowerCase() === inputName.toLowerCase())) {
                    alert(`「${inputName}」已經存在於指定編更中，請勿重複新增！`);
                    return;
                }

                const data = {
                    name: inputName,
                    phone: phoneInput.value,
                    plate: plateInput.value.trim().toUpperCase(),
                    weekdays: Array.from(selectedWeekdays),
                    shift: selectedShift,
                    type: selectedType
                };

                if (editingId) {
                    const idx = currentRecords.findIndex(r => r.id === editingId);
                    if (idx !== -1) currentRecords[idx] = Object.assign({}, currentRecords[idx], data, { _pending: true });
                    queueChange(pendingChanges, editingId, data);
                } else {
                    const tempId = 'temp_' + Date.now();
                    currentRecords.unshift(Object.assign({ id: tempId }, data, { isStarred: false, _pending: true, createdAt: new Date() }));
                    pendingChanges.push({ type: 'add', tempId, data: Object.assign({}, data, { isStarred: false }) });
                }
                renderRecords();
                updatePendingIndicator();
                exitEditMode();
                showSaveMsg('已加入暫存', true);
            };

            /* ===== 備註 提交 ===== */
            noteForm.onsubmit = (e) => {
                e.preventDefault();
                const inputDriver = noteDriver.value.trim();
                const inputPlate = notePlate.value.trim().toUpperCase();

                if (!noteStart.value || !noteEnd.value || !noteText.value.trim()) {
                    alert('請填寫開始日期、結束日期同備註事情');
                    return;
                }
                if (!inputDriver && !inputPlate) {
                    alert('請輸入司機姓名，或者輸入車牌（最少填一樣）');
                    return;
                }
                if (noteEnd.value < noteStart.value) {
                    alert('結束日期唔可以早過開始日期。');
                    return;
                }

                let noteType = '';
                let noteShift = '';
                let notePhoneVal = '';
                if (inputDriver) {
                    const matchedDriver = currentDrivers.find(d => d.name === inputDriver);
                    if (matchedDriver) {
                        if (matchedDriver.type) noteType = matchedDriver.type;
                        if (matchedDriver.shift) noteShift = matchedDriver.shift;
                        if (matchedDriver.phone) notePhoneVal = matchedDriver.phone;
                    }
                }

                const data = {
                    startDate: noteStart.value,
                    endDate: noteEnd.value,
                    driver: inputDriver,
                    plate: inputPlate,
                    phone: notePhoneVal,
                    text: noteText.value.trim(),
                    type: noteType,
                    shift: noteShift,
                    weekdays: Array.from(selectedNoteWeekdays)
                };

                if (editingNoteId) {
                    const idx = currentNotes.findIndex(n => n.id === editingNoteId);
                    if (idx !== -1) currentNotes[idx] = Object.assign({}, currentNotes[idx], data, { _pending: true });
                    queueChange(pendingNoteChanges, editingNoteId, data);
                } else {
                    const tempId = 'note_' + Date.now();
                    currentNotes.unshift(Object.assign({ id: tempId }, data, { _pending: true, createdAt: new Date() }));
                    pendingNoteChanges.push({ type: 'add', tempId, data: Object.assign({}, data) });
                }
                renderNotes();
                updatePendingIndicator();
                exitNoteEditMode();
                showSaveMsg('已加入暫存', true);
            };

            /* ===== 司機資料 提交 ===== */
            driverForm.onsubmit = (e) => {
                e.preventDefault();
                const typeBtn = document.querySelector('.d-type-btn.active');
                const newName = dName.value.trim();

                if (!newName || !dPhone.value.trim() || !typeBtn || !dSelectedShift) {
                    alert('請填寫姓名、電話，並選擇類型（正/替）及更別（早/夜/特）');
                    return;
                }
                if (!isPhoneOk(dPhone.value)) {
                    alert('電話號碼格式唔啱，請輸入 8 位數字（或 852 加 8 位）。');
                    return;
                }
                if (!editingDriverId && currentDrivers.some(d => (d.name || '').toLowerCase() === newName.toLowerCase())) {
                    alert(`「${newName}」已經存在於司機資料庫中，請勿重複新增！`);
                    return;
                }

                const data = {
                    name: newName,
                    phone: dPhone.value.trim(),
                    plate: dPlate.value.trim().toUpperCase(),
                    type: typeBtn.dataset.type,
                    shift: dSelectedShift
                };

                if (editingDriverId) {
                    const oldDriver = currentDrivers.find(d => d.id === editingDriverId);
                    const oldName = oldDriver ? oldDriver.name : '';

                    const idx = currentDrivers.findIndex(d => d.id === editingDriverId);
                    if (idx !== -1) currentDrivers[idx] = Object.assign({}, currentDrivers[idx], data, { _pending: true });
                    queueChange(pendingDriverChanges, editingDriverId, data);

                    if (oldName && oldName !== newName) {
                        currentRecords.forEach(r => {
                            if (r.name === oldName) {
                                r.name = newName;
                                r._pending = true;
                                queueChange(pendingChanges, r.id, { name: newName });
                            }
                        });
                        renderRecords();

                        currentNotes.forEach(n => {
                            if (n.driver === oldName) {
                                n.driver = newName;
                                n._pending = true;
                                queueChange(pendingNoteChanges, n.id, { driver: newName });
                            }
                        });
                        renderNotes();
                    }
                } else {
                    const tempId = 'd_' + Date.now();
                    currentDrivers.unshift(Object.assign({ id: tempId }, data, { _pending: true, createdAt: new Date() }));
                    pendingDriverChanges.push({ type: 'add', tempId, data: Object.assign({}, data) });
                }

                renderDrivers();
                updatePendingIndicator();
                exitDriverEditMode();
                showSaveMsg('已加入暫存', true);
            };

            cancelEditBtn.onclick = () => exitEditMode();
            noteCancelBtn.onclick = () => exitNoteEditMode();
            driverCancelBtn.onclick = () => exitDriverEditMode();

            tabRecords.onclick = () => switchTab('records');
            tabNotes.onclick = () => switchTab('notes');
            tabDrivers.onclick = () => switchTab('drivers');

            cloudSaveBtn.onclick = handleSave;
        }

        /* ================= 儲存 ================= */
        async function handleSave() {
            const total = pendingTotal();
            if (total === 0) { showSaveMsg('冇改動需要儲存', true); return; }
            if (saving) return;

            saving = true;
            cloudSaveBtn.disabled = true;
            cloudSaveBtn.textContent = '儲存中…';

            const failedDrivers = [];
            const failedRecords = [];
            const failedNotes = [];
            const idRemap = {};
            let sCount = 0;
            let fCount = 0;
            let fMsg = '';

            const handleError = (e) => {
                fCount++;
                fMsg = (e && e.message) ? e.message : String(e);
            };

            /* 1) 司機 */
            for (const c of pendingDriverChanges) {
                try {
                    if (c.type === 'add') {
                        const ref = await addDoc(driversCollection, Object.assign({}, c.data, { createdAt: new Date() }));
                        idRemap[c.tempId] = ref.id;
                    } else if (c.type === 'update') {
                        await updateDoc(doc(db, "driversData", c.id), c.data);
                    } else if (c.type === 'delete') {
                        await deleteDoc(doc(db, "driversData", c.id));
                    }
                    sCount++;
                } catch (e) {
                    if ((c.type === 'update' || c.type === 'delete') && e && e.code === 'not-found') { sCount++; }
                    else { handleError(e); failedDrivers.push(c); }
                }
            }

            /* 2) 編更 */
            for (const c of pendingChanges) {
                try {
                    if (c.type === 'add') {
                        const ref = await addDoc(recordsCollection, Object.assign({}, c.data, { createdAt: new Date() }));
                        idRemap[c.tempId] = ref.id;
                    } else if (c.type === 'update') {
                        await updateDoc(doc(db, "shiftRecords", c.id), c.data);
                    } else if (c.type === 'delete') {
                        await deleteDoc(doc(db, "shiftRecords", c.id));
                    }
                    sCount++;
                } catch (e) {
                    if ((c.type === 'update' || c.type === 'delete') && e && e.code === 'not-found') { sCount++; }
                    else { handleError(e); failedRecords.push(c); }
                }
            }

            /* 3) 備註 */
            for (const c of pendingNoteChanges) {
                try {
                    if (c.type === 'add') {
                        const ref = await addDoc(notesCollection, Object.assign({}, c.data, { createdAt: new Date() }));
                        idRemap[c.tempId] = ref.id;
                    } else if (c.type === 'update') {
                        await updateDoc(doc(db, "shiftNotes", c.id), c.data);
                    } else if (c.type === 'delete') {
                        await deleteDoc(doc(db, "shiftNotes", c.id));
                    }
                    sCount++;
                } catch (e) {
                    if ((c.type === 'update' || c.type === 'delete') && e && e.code === 'not-found') { sCount++; }
                    else { handleError(e); failedNotes.push(c); }
                }
            }

            /* 只保留失敗項目，成功嘅唔會再重複寫一次 */
            pendingDriverChanges = failedDrivers;
            pendingChanges = failedRecords;
            pendingNoteChanges = failedNotes;

            /* 臨時 ID 換成真正 ID，同時清走重複副本 */
            const remapIds = (list) => {
                list.forEach(item => {
                    if (idRemap[item.id]) item.id = idRemap[item.id];
                });
                const seen = new Map();
                list.forEach(item => seen.set(item.id, item));
                return Array.from(seen.values());
            };
            currentRecords = remapIds(currentRecords);
            currentNotes = remapIds(currentNotes);
            currentDrivers = remapIds(currentDrivers);

            /* 只保留仍然未儲存項目嘅 pending 標記 */
            const remainIds = new Set();
            pendingChanges.forEach(c => remainIds.add(c.type === 'add' ? c.tempId : c.id));
            pendingNoteChanges.forEach(c => remainIds.add(c.type === 'add' ? c.tempId : c.id));
            pendingDriverChanges.forEach(c => remainIds.add(c.type === 'add' ? c.tempId : c.id));

            [currentRecords, currentNotes, currentDrivers].forEach(list => {
                list.forEach(item => {
                    if (!remainIds.has(item.id)) delete item._pending;
                });
            });

            saving = false;
            cloudSaveBtn.disabled = false;
            updatePendingIndicator();

            if (fCount === 0) {
                showSaveMsg(`儲存成功 (${sCount} 項)`, true);
            } else {
                showSaveMsg(`有 ${fCount} 項儲存失敗，其餘已成功`, false);
                console.error('儲存失敗原因：', fMsg);
            }

            renderRecords();
            renderNotes();
            renderDrivers();

            align-self: stretch;
        }

        .note-row-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
        .note-expire { font-size: clamp(0.65rem, 2.3vw, 0.72rem); color: #9ca3af; flex: 1; }

        footer { margin-top: 18px; font-size: 0.72rem; color: #9ca3af; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 14px; }

        @media (max-width: 500px) {
            .driver-item { flex-direction: column; align-items: stretch; gap: 8px; }
            .driver-left, .driver-right { width: 100%; justify-content: flex-start; }
            .driver-right { justify-content: flex-end; }
            .driver-item .record-actions { margin-left: auto; }

            .note-line-1, .note-line-2 { grid-template-columns: 1fr 1fr; }
            .notes-filter-bar .filter-group { width: 100%; justify-content: space-between; }
            .notes-filter-bar input[type="date"] { flex: 1; min-width: 0; }
            .record-line-3 { grid-template-columns: 1fr; }
            .record-line-3 .record-form-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <!-- ===== 密碼閘 ===== -->
    <div id="lockScreen" class="lock-screen">
        <div class="lock-card">
            <h1>的士編更系統</h1>
            <p>請輸入密碼以繼續</p>
            <input type="password" id="lockInput" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="••••">
            <button type="button" id="lockBtn" class="lock-btn">進入</button>
            <div id="lockError" class="lock-error">密碼不正確，請再試一次</div>
        </div>
    </div>

    <!-- ===== 主體（未解鎖時隱藏） ===== -->
    <div id="appRoot" style="display: none;">
        <div class="container">
            <div class="header-row">
                <div class="title-wrap">
                    <h1>的士編更系統</h1>
                    <span class="version" id="version">V3.4</span>
                </div>
                <div class="right-top">
                    <span id="connectionStatus" class="conn-status status-connecting">連接中…</span>
                    <div class="save-row">
                        <span id="saveStatusMsg" class="save-msg"></span>
                        <button type="button" id="cloudSaveBtn" class="cloud-save-btn">儲存</button>
                        <button type="button" id="lockNowBtn" class="lock-now-btn" title="鎖定">🔒</button>
                    </div>
                </div>
            </div>
            <div class="subhead">
                管理司機資料、排更同備註。所有改動會先暫存，撳右上角「儲存」才會寫上雲端。
            </div>

            <div class="tabs">
                <button type="button" id="tabRecords" class="tab-btn active">指定編更</button>
                <button type="button" id="tabNotes" class="tab-btn">備註</button>
                <button type="button" id="tabDrivers" class="tab-btn">司機資料</button>
            </div>

            <!-- 分頁 1：指定編更 -->
            <div id="panelRecords">
                <div class="form-card">
                    <div class="form-title-row">
                        <h2 id="formTitle">指定編更</h2>
                        <button type="button" id="resetRecordBtn" class="btn-reset">重設</button>
                    </div>
                    <form id="recordForm">
                        <div class="record-form-grid">
                            <div class="record-line-1">
                                <div class="input-group">
                                    <label>司機姓名</label>
                                    <input type="text" id="name" placeholder="輸入並撳選司機" required autocomplete="off">
                                    <input type="hidden" id="phone">
                                </div>
                                <div class="input-group">
                                    <label>車牌 <span class="opt">（選填）</span></label>
                                    <input type="text" id="plate" placeholder="AB 1234">
                                </div>
                            </div>

                            <div class="record-line-2 input-group">
                                <label>逢星期幾返工（可揀多日）</label>
                                <div id="weekdayButtons" class="weekday-selector"></div>
                            </div>

                            <div class="record-line-3">
                                <div class="input-group">
                                    <label>更別</label>
                                    <div id="shiftButtons" class="shift-selector"></div>
                                </div>
                                <div class="record-form-actions">
                                    <button type="submit" id="saveBtn" class="btn btn-primary">加入新增</button>
                                    <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display: none;">取消修改</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="records-header">
                    <h2>指定編更紀錄</h2>
                </div>

                <div class="filter-bar">
                    <div class="filter-item">
                        <input type="text" id="searchRecordText" placeholder="🔍 搜尋人名/電話" style="width: 130px;">
                    </div>
                    <div class="filter-item">
                        <select id="searchRecordType">
                            <option value="">全部類型</option>
                            <option value="正更">正更</option>
                            <option value="替更">替更</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <select id="searchRecordShift">
                            <option value="">全部更別</option>
                            <option value="morning">早</option>
                            <option value="night">夜</option>
                            <option value="special">特</option>
                        </select>
                    </div>
                    <details class="wd-dropdown">
                        <summary>📅 星期幾</summary>
                        <div class="wd-dropdown-content">
                            <label><input type="checkbox" class="record-filter-wd" value="mon"> 一</label>
                            <label><input type="checkbox" class="record-filter-wd" value="tue"> 二</label>
                            <label><input type="checkbox" class="record-filter-wd" value="wed"> 三</label>
                            <label><input type="checkbox" class="record-filter-wd" value="thu"> 四</label>
                            <label><input type="checkbox" class="record-filter-wd" value="fri"> 五</label>
                            <label><input type="checkbox" class="record-filter-wd" value="sat"> 六</label>
                            <label><input type="checkbox" class="record-filter-wd" value="sun"> 日</label>
                        </div>
                    </details>
                    <button type="button" id="clearRecordSearchBtn" class="btn-clear">清除</button>
                </div>

                <div id="recordsList" class="records-list">
                    <div class="empty-message">載入中...</div>
                </div>
            </div>

            <!-- 分頁 2：備註 -->
            <div id="panelNotes" style="display: none;">
                <div class="note-form-card form-card">
                    <h3 id="noteTitle">新增備註</h3>
                    <form id="noteForm">
                        <div class="note-line-1">
                            <div class="input-group">
                                <label>開始日期</label>
                                <input type="date" id="noteStart" required>
                            </div>
                            <div class="input-group">
                                <label>結束日期</label>
                                <input type="date" id="noteEnd" required>
                            </div>
                        </div>

                        <div class="input-group" style="margin-bottom: 8px;">
                            <label>指定星期幾 <span class="opt">（選填）</span></label>
                            <div id="noteWeekdayButtons" class="weekday-selector"></div>
                        </div>

                        <div class="note-line-2">
                            <div class="input-group">
                                <label>司機姓名 <span class="opt">（選填）</span></label>
                                <input type="text" id="noteDriver" placeholder="輸入並撳選司機" autocomplete="off">
                            </div>
                            <div class="input-group">
                                <label>車牌 <span class="opt">（選填）</span></label>
                                <input type="text" id="notePlate" placeholder="AB 1234">
                            </div>
                        </div>

                        <div class="note-hint">司機姓名同車牌最少填一樣。填咗司機會自動帶出電話同類型。</div>

                        <div class="note-line-3">
                            <div class="input-group">
                                <label>備註事情</label>
                                <input type="text" id="noteText" placeholder="放假 / 優先排更 / 車輛維修" required>
                            </div>
                            <button type="submit" id="addNoteBtn" class="btn btn-primary" style="padding: 9px 16px; white-space: nowrap;">加入備註</button>
                            <button type="button" id="noteCancelBtn" class="btn btn-outline" style="display: none; padding: 9px 16px; white-space: nowrap;">取消修改</button>
                        </div>
                    </form>
                </div>

                <div class="notes-filter-bar">
                    <div class="filter-group">
                        <span>日期：</span>
                        <input type="date" id="searchNoteStart" title="開始日期搜尋">
                        <span>至</span>
                        <input type="date" id="searchNoteEnd" title="結束日期搜尋">
                    </div>
                    <div class="filter-group">
                        <span>類型：</span>
                        <select id="searchNoteType">
                            <option value="">全部</option>
                            <option value="正更">正更</option>
                            <option value="替更">替更</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <span>更別：</span>
                        <select id="searchNoteShift">
                            <option value="">全部</option>
                            <option value="morning">早</option>
                            <option value="night">夜</option>
                            <option value="special">特</option>
                        </select>
                    </div>
                    <button type="button" id="clearNoteSearchBtn" class="btn-clear">清除搜尋</button>
                </div>

                <div id="notesList" class="records-list">
                    <div class="empty-message">載入中...</div>
                </div>
            </div>

            <!-- 分頁 3：司機資料 -->
            <div id="panelDrivers" style="display: none;">
                <div class="form-card">
                    <h3 id="driverTitle">新增司機資料</h3>
                    <form id="driverForm">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>司機姓名</label>
                                <input type="text" id="dName" placeholder="陳大文" required>
                            </div>
                            <div class="input-group">
                                <label>電話號碼</label>
                                <input type="tel" id="dPhone" placeholder="91234567" required>
                            </div>
                            <div class="input-group">
                                <label>類型 (正更 / 替更)</label>
                                <div id="dTypeButtons" class="d-type-selector"></div>
                            </div>
                            <div class="input-group">
                                <label>更別 (早 / 夜 / 特)</label>
                                <div id="dShiftButtons" class="d-shift-selector"></div>
                            </div>
                            <div class="input-group" style="grid-column: 1 / -1;">
                                <label>車牌 <span class="opt">（選填）</span></label>
                                <input type="text" id="dPlate" placeholder="AB 1234">
                            </div>
                        </div>
                        <div class="record-form-actions">
                            <button type="submit" id="addDriverBtn" class="btn btn-primary">加入資料</button>
                            <button type="button" id="driverCancelBtn" class="btn btn-outline" style="display: none;">取消修改</button>
                        </div>
                    </form>
                </div>

                <div class="records-header">
                    <h2>司機資料庫</h2>
                    <input type="text" id="searchDriver" class="search-input" placeholder="🔍 搜尋名/電話/車牌...">
                </div>
                <div id="driversList" class="driver-list">
                    <div class="empty-message">載入中...</div>
                </div>
            </div>

            <footer>
                手動儲存模式 · 改動暫存本機，撳右上角「儲存」才寫上雲端 · 備註結束日期後 6 日自動刪除
            </footer>
        </div>
    </div>
</body>
</html>
