<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的士編更雲端系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- 頂部導航欄 (符合手機單行排版與美觀) -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white font-bold shadow-md shrink-0">
                    🚕
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight leading-tight">的士編更雲端系統</h1>
                    <p class="text-xs text-slate-400">團隊共用排班表 (v1.7.0)</p>
                </div>
            </div>

            <div class="flex items-center gap-2 ml-auto">
                <div id="cloud-status-badge" class="flex items-center gap-2 px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-full text-xs font-medium text-amber-700 shadow-sm">
                    <span id="cloud-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    <span id="cloud-status-text">連線中...</span>
                </div>
                <button id="save-cloud-btn" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow transition-all active:scale-95 shrink-0">
                    ☁️ 儲存同步
                </button>
            </div>
        </div>
    </header>

    <!-- 頁籤導航 -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-[61px] z-30">
        <div class="max-w-4xl mx-auto px-4 flex gap-2 overflow-x-auto">
            <button data-tab="roster" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-red-600 text-red-600 bg-red-50/50 transition-all shrink-0">
                📋 恆常排班表
            </button>
            <button data-tab="leave" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-600 hover:text-slate-900 transition-all shrink-0">
                🏖️ 正更放假紀錄
            </button>
            <button data-tab="priority" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-600 hover:text-slate-900 transition-all shrink-0">
                ⭐ 替更補更(優先排更)
            </button>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Tab 1: 恆常排班表 -->
        <div id="tab-roster" class="tab-content space-y-6">
            <!-- 新增/修改司機表單 -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="form-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <span>👤</span> 加入 / 修改司機排班紀錄
                    </h2>
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs rounded-lg font-medium">
                        取消修改
                    </button>
                </div>

                <form id="shift-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">司機姓名 <span class="text-red-500">*</span></label>
                            <input type="text" id="driver-name" required placeholder="例如：陳大文" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">電話號碼 <span class="text-red-500">*</span></label>
                            <input type="tel" id="driver-phone" required placeholder="例如：91234567" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">司機分類 <span class="text-red-500">*</span></label>
                            <div class="flex gap-4 pt-1">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="driver-type" value="regular" checked class="text-red-600 focus:ring-red-500">
                                    <span class="text-sm font-medium text-slate-700">正更司機</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="driver-type" value="relief" class="text-red-600 focus:ring-red-500">
                                    <span class="text-sm font-medium text-slate-700">替更司機</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">更份選擇 <span class="text-red-500">*</span></label>
                            <div class="flex gap-4 pt-1">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="driver-shift" value="morning" checked class="text-red-600 focus:ring-red-500">
                                    <span class="text-sm font-medium text-slate-700">☀️ 早更</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="driver-shift" value="night" class="text-red-600 focus:ring-red-500">
                                    <span class="text-sm font-medium text-slate-700">🌙 夜更</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">每星期返工星期 (可選多個) <span class="text-red-500">*</span></label>
                        <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="1" class="form-day-checkbox mr-1.5">一</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="2" class="form-day-checkbox mr-1.5">二</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="3" class="form-day-checkbox mr-1.5">三</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="4" class="form-day-checkbox mr-1.5">四</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="5" class="form-day-checkbox mr-1.5">五</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="6" class="form-day-checkbox mr-1.5">六</label>
                            <label class="flex items-center justify-center p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 text-xs font-medium"><input type="checkbox" value="7" class="form-day-checkbox mr-1.5">日</label>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold shadow-md shadow-red-600/20 transition-all active:scale-[0.99]">
                        <span id="submit-btn-text">＋ 加入暫存列表</span>
                    </button>
                </form>
            </section>

            <!-- 篩選與列表 -->
            <section class="space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">快速篩選星期</h3>
                        <p class="text-xs text-slate-500">點擊篩選特定日子的排班（留空顯示全部）</p>
                    </div>
                    <div class="flex gap-1.5 flex-wrap">
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="1">一</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="2">二</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="3">三</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="4">四</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="5">五</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="6">六</button>
                        <button class="filter-day-btn px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50" data-day="7">日</button>
                        <button id="clear-filter-btn" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-medium">重設</button>
                    </div>
                </div>

                <!-- 排序提示：正更排先，次要A-Z -->
                <div class="flex justify-between items-center text-xs text-slate-500 px-1">
                    <span>排序：正更優先 ➔ 替更，次要按姓名 (A-Z)</span>
                    <span id="total-count">共 0 筆紀錄</span>
                </div>

                <div id="shift-list-container" class="space-y-3">
                    <!-- 動態載入排班卡片 -->
                </div>
            </section>
        </div>

        <!-- Tab 2: 正更放假紀錄 -->
        <div id="tab-leave" class="tab-content hidden space-y-6">
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-2">🏖️ 新增正更放假紀錄</h2>
                <p class="text-xs text-slate-500 mb-4">純粹記錄正更司機放假日期（無需輸入替更姓名）</p>
                <form id="leave-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">正更司機姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="leave-name" required placeholder="例如：陳大文" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">開始日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="leave-start" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">結束日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="leave-end" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold shadow-md shadow-red-600/20 transition-all">
                        ＋ 記錄正更放假
                    </button>
                </form>
            </section>

            <div class="space-y-4">
                <h3 class="font-bold text-slate-800 text-sm">目前生效中的正更放假</h3>
                <div id="leave-list-container" class="space-y-3"></div>

                <h3 class="font-bold text-slate-800 text-sm pt-4">📦 過往放假紀錄 (7日內自動刪除)</h3>
                <div id="leave-archive-container" class="space-y-3"></div>
            </div>
        </div>

        <!-- Tab 3: 替更優先排更 -->
        <div id="tab-priority" class="tab-content hidden space-y-6">
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-2">⭐ 替更補更 / 優先排更（上星期編唔夠更）</h2>
                <p class="text-xs text-slate-500 mb-4">專門記錄上星期欠更、需要在指定日期內優先安排更份的替更司機。</p>
                <form id="priority-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">替更司機姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="priority-name" required placeholder="例如：張偉強" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">需要優先排更的開始日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="priority-start" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">需要優先排更的結束日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="priority-end" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold shadow-md shadow-red-600/20 transition-all">
                        ＋ 記錄替更優先排更（補更）
                    </button>
                </form>
            </section>

            <div class="space-y-4">
                <h3 class="font-bold text-slate-800 text-sm">目前生效中的優先補更</h3>
                <div id="priority-list-container" class="space-y-3"></div>

                <h3 class="font-bold text-slate-800 text-sm pt-4">📦 過往優先補更紀錄 (7日內自動刪除)</h3>
                <div id="priority-archive-container" class="space-y-3"></div>
            </div>
        </div>

    </main>

    <!-- Toast 提示框 -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none bg-slate-900 text-white">
        <span id="toast-msg">提示訊息</span>
    </div>

    <!-- Firebase SDKs & App logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKeyForDemoPurposesOnly123456",
            authDomain: "taxirecord123.firebaseapp.com",
            projectId: "taxirecord123",
            storageBucket: "taxirecord123.appspot.com",
            messagingSenderId: "331818290264",
            appId: "1:331818290264:web:324567890abcdef"
        };

        let db = null;
        let auth = null;
        let currentEditingId = null;
        let activeFilterDays = [];
        let isCloudLoaded = false;

        let shiftData = [
            { id: '1', name: '陳大文', phone: '91234567', type: 'regular', shift: 'morning', days: ['1','2','3','4','5'] },
            { id: '2', name: '張偉強', phone: '98765432', type: 'relief', shift: 'night', days: ['6','7'] }
        ];

        let leaveData = [];
        let leaveArchive = [];

        let priorityData = [];
        let priorityArchive = [];

        const dayNameMap = { '1':'一', '2':'二', '3':'三', '4':'四', '5':'五', '6':'六', '7':'日' };

        window.addEventListener('DOMContentLoaded', async () => {
            initTabs();
            initFirebase();
            setupEventListeners();
            renderAll();
        });

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('border-red-600', 'text-red-600', 'bg-red-50/50');
                        b.classList.add('border-transparent', 'text-slate-600');
                    });
                    e.currentTarget.classList.remove('border-transparent', 'text-slate-600');
                    e.currentTarget.classList.add('border-red-600', 'text-red-600', 'bg-red-50/50');

                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById(`tab-${tab}`).classList.remove('hidden');
                });
            });
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                // 監聽雲端認證與建立實時同步監聽
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        setupRealtimeSync();
                    }
                });

                try {
                    await signInAnonymously(auth);
                    updateCloudStatus(true, '雲端已連線 (即時同步)');
                } catch (authErr) {
                    console.warn("Auth warning:", authErr);
                    updateCloudStatus(false, '離線預覽模式');
                }
            } catch (error) {
                console.error("Firebase error:", error);
                updateCloudStatus(false, '離線模式');
            }
        }

        function setupRealtimeSync() {
            if (!db) return;
            const docRef = doc(db, "taxidata", "main_roster_v173");
            
            // 使用 onSnapshot 實現所有人實時同步
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.shiftData) shiftData = data.shiftData;
                    if (data.leaveData) leaveData = data.leaveData;
                    if (data.leaveArchive) leaveArchive = data.leaveArchive;
                    if (data.priorityData) priorityData = data.priorityData;
                    if (data.priorityArchive) priorityArchive = data.priorityArchive;
                    checkAutoArchive();
                    renderAll();
                    if (!isCloudLoaded) {
                        showToast('已成功從雲端同步最新排班資料！', 'success');
                        isCloudLoaded = true;
                    }
                }
            }, (error) => {
                console.error("Cloud sync error:", error);
                updateCloudStatus(false, '雲端讀取受阻');
            });
        }

        function updateCloudStatus(connected, text) {
            const badge = document.getElementById('cloud-status-badge');
            const dot = document.getElementById('cloud-status-dot');
            const txt = document.getElementById('cloud-status-text');
            txt.textContent = text;
            if (connected) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
                badge.className = 'flex items-center gap-2 px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-full text-xs font-medium text-emerald-700 shadow-sm';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
                badge.className = 'flex items-center gap-2 px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-full text-xs font-medium text-amber-700 shadow-sm';
            }
        }

        async function saveToCloud() {
            if (!db) {
                showToast('未連線至雲端', 'error');
                return;
            }
            try {
                checkAutoArchive();
                const docRef = doc(db, "taxidata", "main_roster_v173");
                await setDoc(docRef, { 
                    shiftData, 
                    leaveData, 
                    leaveArchive, 
                    priorityData, 
                    priorityArchive, 
                    updatedAt: new Date().toISOString() 
                });
                showToast('雲端儲存同步成功！所有人即時更新', 'success');
            } catch (e) {
                showToast('儲存失敗：' + e.message, 'error');
            }
        }

        function checkAutoArchive() {
            const todayStr = new Date().toISOString().split('T')[0];

            // 檢查正更放假過期歸檔
            const activeLeaves = [];
            leaveData.forEach(item => {
                if (item.endDate < todayStr) {
                    const expireDate = new Date(item.endDate);
                    expireDate.setDate(expireDate.getDate() + 7);
                    if (new Date().toISOString().split('T')[0] <= expireDate.toISOString().split('T')[0]) {
                        leaveArchive.push(item);
                    }
                } else {
                    activeLeaves.push(item);
                }
            });
            leaveData = activeLeaves;

            // 清理超過7日的放假紀錄
            leaveArchive = leaveArchive.filter(item => {
                const expireDate = new Date(item.endDate);
                expireDate.setDate(expireDate.getDate() + 7);
                return new Date().toISOString().split('T')[0] <= expireDate.toISOString().split('T')[0];
            });

            // 檢查替更優先排更過期歸檔
            const activePriorities = [];
            priorityData.forEach(item => {
                if (item.endDate < todayStr) {
                    const expireDate = new Date(item.endDate);
                    expireDate.setDate(expireDate.getDate() + 7);
                    if (new Date().toISOString().split('T')[0] <= expireDate.toISOString().split('T')[0]) {
                        priorityArchive.push(item);
                    }
                } else {
                    activePriorities.push(item);
                }
            });
            priorityData = activePriorities;

            // 清理超過7日的優先排更紀錄
            priorityArchive = priorityArchive.filter(item => {
                const expireDate = new Date(item.endDate);
                expireDate.setDate(expireDate.getDate() + 7);
                return new Date().toISOString().split('T')[0] <= expireDate.toISOString().split('T')[0];
            });
        }

        function setupEventListeners() {
            document.getElementById('save-cloud-btn').addEventListener('click', saveToCloud);
            document.getElementById('shift-form').addEventListener('submit', handleShiftSubmit);
            document.getElementById('leave-form').addEventListener('submit', handleLeaveSubmit);
            document.getElementById('priority-form').addEventListener('submit', handlePrioritySubmit);

            document.querySelectorAll('.filter-day-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const day = e.currentTarget.dataset.day;
                    if (activeFilterDays.includes(day)) {
                        activeFilterDays = activeFilterDays.filter(d => d !== day);
                        e.currentTarget.classList.remove('bg-red-600', 'text-white', 'border-red-600');
                        e.currentTarget.classList.add('bg-white', 'text-slate-700');
                    } else {
                        activeFilterDays.push(day);
                        e.currentTarget.classList.add('bg-red-600', 'text-white', 'border-red-600');
                        e.currentTarget.classList.remove('bg-white', 'text-slate-700');
                    }
                    renderShiftList();
                });
            });

            document.getElementById('clear-filter-btn').addEventListener('click', () => {
                activeFilterDays = [];
                document.querySelectorAll('.filter-day-btn').forEach(btn => {
                    btn.classList.remove('bg-red-600', 'text-white', 'border-red-600');
                    btn.classList.add('bg-white', 'text-slate-700');
                });
                renderShiftList();
            });
        }

        function handleShiftSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('driver-name').value.trim();
            const phone = document.getElementById('driver-phone').value.trim();
            const type = document.querySelector('input[name="driver-type"]:checked').value;
            const shift = document.querySelector('input[name="driver-shift"]:checked').value;
            
            const days = [];
            document.querySelectorAll('.form-day-checkbox:checked').forEach(cb => days.push(cb.value));

            if (!name || !phone || days.length === 0) {
                showToast('請完整填寫司機資料並選擇至少一日', 'error');
                return;
            }

            if (currentEditingId) {
                const item = shiftData.find(s => s.id === currentEditingId);
                if (item) {
                    item.name = name;
                    item.phone = phone;
                    item.type = type;
                    item.shift = shift;
                    item.days = days;
                }
                currentEditingId = null;
                document.getElementById('submit-btn-text').textContent = '＋ 加入暫存列表';
                document.getElementById('cancel-edit-btn').classList.add('hidden');
            } else {
                shiftData.push({ id: Date.now().toString(), name, phone, type, shift, days });
            }

            document.getElementById('shift-form').reset();
            renderAll();
            showToast('已更新暫存列表，請點擊右上角儲存同步！', 'success');
        }

        function handleLeaveSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('leave-name').value.trim();
            const startDate = document.getElementById('leave-start').value;
            const endDate = document.getElementById('leave-end').value;

            if (!name || !startDate || !endDate) return;

            leaveData.push({ id: Date.now().toString(), name, startDate, endDate });
            document.getElementById('leave-form').reset();
            renderAll();
            showToast('已新增正更放假紀錄', 'success');
        }

        function handlePrioritySubmit(e) {
            e.preventDefault();
            const name = document.getElementById('priority-name').value.trim();
            const startDate = document.getElementById('priority-start').value;
            const endDate = document.getElementById('priority-end').value;

            if (!name || !startDate || !endDate) return;

            priorityData.push({ id: Date.now().toString(), name, startDate, endDate });
            document.getElementById('priority-form').reset();
            renderAll();
            showToast('已新增替更優先排更紀錄', 'success');
        }

        function renderAll() {
            renderShiftList();
            renderLeaveList();
            renderPriorityList();
        }

        function renderShiftList() {
            const container = document.getElementById('shift-list-container');
            
            let filtered = shiftData;
            if (activeFilterDays.length > 0) {
                filtered = shiftData.filter(item => item.days.some(d => activeFilterDays.includes(d)));
            }

            // 優先排序：正更排先 (type === 'regular' 優先)，次要排序 A-Z
            const sorted = [...filtered].sort((a, b) => {
                if (a.type === 'regular' && b.type !== 'regular') return -1;
                if (a.type !== 'regular' && b.type === 'regular') return 1;
                return a.name.localeCompare(b.name, 'zh-HK');
            });

            document.getElementById('total-count').textContent = `共 ${sorted.length} 筆紀錄`;

            if (sorted.length === 0) {
                container.innerHTML = `<div class="text-center py-8 bg-white rounded-2xl border border-slate-200 text-slate-400 text-sm">暫無符合條件的排班紀錄</div>`;
                return;
            }

            let html = '';
            sorted.forEach(item => {
                const typeBadge = item.type === 'regular' 
                    ? `<span class="px-2.5 py-0.5 bg-blue-50 text-blue-700 text-xs rounded-md font-semibold border border-blue-100">正更</span>`
                    : `<span class="px-2.5 py-0.5 bg-purple-50 text-purple-700 text-xs rounded-md font-semibold border border-purple-100">替更</span>`;
                
                const shiftBadge = item.shift === 'morning'
                    ? `<span class="px-2 py-0.5 bg-amber-50 text-amber-700 text-xs rounded-md font-medium">早更</span>`
                    : `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 text-xs rounded-md font-medium">夜更</span>`;

                const daysStr = item.days.map(d => dayNameMap[d]).join('、');
                const whatsappText = encodeURIComponent(`你好 ${item.name}，關於編更安排：電話 ${item.phone}，更份：${item.shift==='morning'?'早更':'夜更'}，日子：${daysStr}`);

                html += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-2.5">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-slate-900 text-base">${escapeHtml(item.name)}</span>
                                    ${typeBadge}
                                    ${shiftBadge}
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <a href="https://wa.me/?text=${whatsappText}" target="_blank" class="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs rounded-lg font-medium">💬 WhatsApp</a>
                                <button onclick="editShift('${item.id}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium">修改</button>
                                <button onclick="deleteShift('${item.id}')" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs rounded-lg font-medium">刪除</button>
                            </div>
                        </div>
                        <div class="text-sm text-slate-600 flex items-center gap-4">
                            <span>電話：<a href="tel:${escapeHtml(item.phone)}" class="text-red-600 underline font-semibold">${escapeHtml(item.phone)}</a></span>
                        </div>
                        <div class="text-sm text-slate-600">返工星期：<span class="font-bold text-slate-800">${daysStr}</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderLeaveList() {
            const activeContainer = document.getElementById('leave-list-container');
            const archiveContainer = document.getElementById('leave-archive-container');

            activeContainer.innerHTML = leaveData.length === 0 
                ? `<div class="text-center py-4 bg-white rounded-xl border border-slate-200 text-slate-400 text-xs">暫無生效中正更放假</div>`
                : leaveData.map(item => `
                    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-800">正更：${escapeHtml(item.name)}</span>
                            <div class="text-xs text-slate-500 mt-0.5">放假日期：${escapeHtml(item.startDate)} ~ ${escapeHtml(item.endDate)}</div>
                        </div>
                        <button onclick="deleteLeave('${item.id}')" class="px-2.5 py-1 bg-red-50 text-red-600 text-xs rounded-lg font-medium">刪除</button>
                    </div>
                `).join('');

            archiveContainer.innerHTML = leaveArchive.length === 0 
                ? `<div class="text-center py-4 bg-white rounded-xl border border-slate-200 text-slate-400 text-xs">暫無過往放假紀錄</div>`
                : leaveArchive.map(item => `
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 opacity-75 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-700">正更：${escapeHtml(item.name)} (已完結)</span>
                            <div class="text-xs text-slate-500 mt-0.5">原放假日期：${escapeHtml(item.startDate)} ~ ${escapeHtml(item.endDate)}</div>
                        </div>
                    </div>
                `).join('');
        }

        function renderPriorityList() {
            const activeContainer = document.getElementById('priority-list-container');
            const archiveContainer = document.getElementById('priority-archive-container');

            activeContainer.innerHTML = priorityData.length === 0 
                ? `<div class="text-center py-4 bg-white rounded-xl border border-slate-200 text-slate-400 text-xs">暫無生效中優先補更紀錄</div>`
                : priorityData.map(item => `
                    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-800">替更補更：${escapeHtml(item.name)}</span>
                            <div class="text-xs text-slate-500 mt-0.5">優先排更期：${escapeHtml(item.startDate)} ~ ${escapeHtml(item.endDate)}</div>
                        </div>
                        <button onclick="deletePriority('${item.id}')" class="px-2.5 py-1 bg-red-50 text-red-600 text-xs rounded-lg font-medium">刪除</button>
                    </div>
                `).join('');

            archiveContainer.innerHTML = priorityArchive.length === 0 
                ? `<div class="text-center py-4 bg-white rounded-xl border border-slate-200 text-slate-400 text-xs">暫無過往優先補更紀錄</div>`
                : priorityArchive.map(item => `
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 opacity-75 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-700">替更補更：${escapeHtml(item.name)} (已完結)</span>
                            <div class="text-xs text-slate-500 mt-0.5">原優先排更期：${escapeHtml(item.startDate)} ~ ${escapeHtml(item.endDate)}</div>
                        </div>
                    </div>
                `).join('');
        }

        window.editShift = function(id) {
            const item = shiftData.find(s => s.id === id);
            if (!item) return;
            currentEditingId = id;
            document.getElementById('driver-name').value = item.name;
            document.getElementById('driver-phone').value = item.phone;
            document.querySelector(`input[name="driver-type"][value="${item.type}"]`).checked = true;
            document.querySelector(`input[name="driver-shift"][value="${item.shift}"]`).checked = true;

            document.querySelectorAll('.form-day-checkbox').forEach(cb => {
                cb.checked = item.days.includes(cb.value);
            });

            document.getElementById('submit-btn-text').textContent = '確認修改紀錄';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            currentEditingId = null;
            document.getElementById('shift-form').reset();
            document.getElementById('submit-btn-text').textContent = '＋ 加入暫存列表';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        window.deleteShift = function(id) {
            shiftData = shiftData.filter(s => s.id !== id);
            renderAll();
            showToast('已刪除紀錄', 'success');
        };

        window.deleteLeave = function(id) {
            leaveData = leaveData.filter(l => l.id !== id);
            renderAll();
            showToast('已刪除正更放假紀錄', 'success');
        };

        window.deletePriority = function(id) {
            priorityData = priorityData.filter(p => p.id !== id);
            renderAll();
            showToast('已刪除替更優先排更紀錄', 'success');
        };

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            msg.textContent = message;
            toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-0 ${
                type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'
            }`;
            setTimeout(() => {
                toast.className = 'fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none';
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
